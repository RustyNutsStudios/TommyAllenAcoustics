/* ══ THE SHARED HALF OF window.VB ═════════════════════════════════════════
   Each tool assigns its own members on top of this (Object.assign), so a
   single-tool build exposes exactly the doors that tool actually has. */
window.VB={
  version:VERSION, SR:SR, design:DESIGN_REF,
  spec:function(){ var s={}; for(var k in SPEC) s[k]=SPEC[k]; return s; },
  seed:function(){return M.seed;},  setSeed:function(n){M.seed=(n>>>0);markStale();VBUI.notify();},
  /* §SAVE: where a file can actually go from this host, and a test door to
     force it so the refusal path can be exercised without an editor. */
  deliveryPath:function(){ return vbDeliveryPath(); },
  /* call back when window.ue.taa arrives — see vbBridgeReady's note: on CEF 128
     it is NOT bound yet when the page script runs. */
  onBridge:function(cb){ return vbBridgeReady(cb); },
  forceDeliveryPath:function(p){ return forceDeliveryPath(p); },
  slotCount:function(i){return L[i]?L[i].files.length:0;},
  /* STRINGS STAY STRINGS. This used to coerce with +value, so setDial(0,'pick',
     'FIXED') silently became NaN and the contract could not set PICK at all -
     a setter that fails in silence is the worst kind. */
  setDial:function(slot,dial,value){
    var l=L[slot]; if(!l) return;
    var num=(typeof value!=='string')||(value.trim()!=='' && isFinite(+value));
    var v=num?+value:value;
    if(dial in l.r) l.r[dial]=+v; else if(dial in l) l[dial]=v;
    markStale(); VBUI.notify();
  },
  setMaster:function(dial,value){
    var strDial=(dial==='normalise'||dial==='name');
    if(strDial) M[dial]=String(value); else if(dial in M) M[dial]=+value;
    if(dial==='normalise'){ latchGain=null; latchStale=false; } else markStale();
    VBUI.notify();
  },
  /* §14 trim, through the contract - TESTER asked for it by name */
  loadLayer:function(slot,o){
    var l=L[slot]; if(!l) return 0;
    var s=o.samples;
    if(o.sampleRate&&o.sampleRate!==SR){    /* linear resample — harness convenience */
      var ratio=o.sampleRate/SR, m=Math.floor(s.length/ratio), r=new Float32Array(m);
      for(var i=0;i<m;i++){ var x=i*ratio,i0=Math.floor(x),fr=x-i0;
        var a=s[i0]||0,b=s[i0+1]||0; r[i]=a+(b-a)*fr; }
      s=r;
    }
    l.files.push({name:o.name||('inject_'+l.files.length), samples:s, durMs:s.length/SR*1000, stereo:false});
    if(!l.name) l.name=o.name||('slot'+l.id);
    latchGain=null; VBUI.notify();
    return l.files.length;
  },
  clearLayer:function(slot){ var l=L[slot]; if(!l) return; l.files=[]; l.trimIn=0; l.trimOut=-1;
    latchGain=null; VBUI.notify(); },
  state:function(){
    return { v:1, seed:M.seed, knob:M.knob, count:M.count, trim:M.trim, normalise:M.normalise,
      tailFade:M.tailFade, maxLength:M.maxLength, rate:M.rate, bits:M.bits, channels:M.channels,
      name:M.name, rolls:rolls.slice(), marks:marks.slice(), latchGain:latchGain, sel:sel,
      layers:L.map(function(l){ return {name:l.name, pick:l.pick, fixedIdx:l.fixedIdx, on:l.on,
        solo:l.solo, mute:l.mute, level:l.level, delay:l.delay, pan:l.pan, lp:l.lp, hp:l.hp,
        trimIn:l.trimIn, trimOut:l.trimOut, files:l.files.map(function(f){return f.name;}),
        r:{offset:l.r.offset,pitch:l.r.pitch,gain:l.r.gain,tone:l.r.tone,
           spread:l.r.spread,reverse:l.r.reverse,start:l.r.start}};})};
  },
  restore:function(s){
    if(!s) return;
    M.seed=s.seed>>>0; M.knob=s.knob; M.count=s.count; M.trim=s.trim; M.normalise=s.normalise;
    M.tailFade=s.tailFade; M.maxLength=s.maxLength; M.rate=s.rate; M.bits=s.bits;
    M.channels=s.channels; M.name=s.name;
    rolls=s.rolls.slice(); marks=s.marks.slice(); latchGain=s.latchGain; sel=s.sel||0;
    s.layers.forEach(function(o,i){
      var l=L[i]; if(!l) return;
      l.name=o.name; l.pick=o.pick; l.fixedIdx=o.fixedIdx; l.on=o.on; l.solo=o.solo; l.mute=o.mute;
      l.level=o.level; l.delay=o.delay; l.pan=o.pan; l.lp=o.lp; l.hp=o.hp;
      l.trimIn=o.trimIn; l.trimOut=o.trimOut;
      for(var k in o.r) l.r[k]=o.r[k];
    });
    /* the engine does not know what a screen looks like - it says "something
       changed" and every registered tool repaints itself. */
    VBUI.notify();
  },
  loadDemoKit:function(){ demoKit(); if(window.__vbAfterDemo) window.__vbAfterDemo(); },
  onChange:function(fn){ VBUI.onChange(fn); },
  undo:function(){ doUndo(); return undoStack.length; },
  redo:function(){ doRedo(); return redoStack.length; },
  undoDepth:function(){ return {undo:undoStack.length, redo:redoStack.length, max:UNDO_MAX}; },
  commitUndo:function(){ commitUndo(); return undoStack.length; },
  presets:function(){
    var store=loadUserPresets();
    return {current:presetName, dirty:presetDirty, persistent:storageOK,
            factory:FACTORY.map(function(f){return f.name;}),
            folders:store.folders.map(function(f){return {name:f.name,presets:f.presets.map(function(p){return p.name;})};})};
  },
  loadFactory:function(i){ applyFactory(FACTORY[i]); return presetName; },
  savePresetAs:function(nm){
    var store=loadUserPresets(), fo=store.folders[0], st=window.VB.state();
    var ex=fo.presets.filter(function(p){return p.name===nm;})[0];
    if(ex) ex.state=st; else fo.presets.push({name:nm,state:st});
    saveUserPresets(store); presetName=fo.name+' / '+nm; presetDirty=false; paintPreset();
    return nm;
  },
  loadPresetNamed:function(nm){
    var store=loadUserPresets(), found=null;
    store.folders.forEach(function(fo){ fo.presets.forEach(function(p){ if(p.name===nm){ p.folder=fo.name; found=p; } }); });
    if(!found) return null;
    applyUserPreset(found); return presetName;
  },
  audioReady:audioReady,
  play:play
};
/* ══ HEADLESS SELF-CHECK ══════════════════════════════════════════════════
   Once the tools are separate files, a preview pane that re-serves a page as a
   data: URL cannot load their script tags - so the ONLY honest way to test a
   split tool is headless. This renders results into the DOM where
   `chrome --dump-dom` can read them, which is exactly what run-vbench needs.
   Usage:  <tool>/index.html?selftest      Look for  VBSELFTEST PASS/FAIL. */
function vbSelfTest(toolName, checks){
  /* ── ENGINE INVARIANTS — asserted in EVERY tool, for free ─────────────────
     These belong to the engine, not to any one screen. Copying them into three
     gates would mean three gates that drift apart, and the one tool that quietly
     dropped a check would be the one that broke — so they live at the single
     place every tool already calls. No tool can forget them, and adding a tool
     cannot lose them. Three sessions now write into one window.VB; the clash
     check in particular has to run everywhere or it is not a guard at all. */
  var engine=[
    {name:'ENGINE · no namespace CLASH — nobody silently overwrote anybody',
     fn:function(){ var c=(window.VB&&window.VB.nsClashes)?window.VB.nsClashes():[];
       return {ok:c.length===0, detail:c.length? c.join(', ') : 'none'}; }},
    {name:'ENGINE · the page NAMES ITSELF (VB.tool)',
     fn:function(){ var t=window.VB&&window.VB.tool;
       return {ok:(typeof t==='string')&&!!t, detail:'tool = '+t}; }},
    {name:'ENGINE · SAVE never claims success without a delivery path',
     fn:function(){
       /* The lie this kills: the editor drops <a download> with no error while
          the status line says it saved. Forced, so it is proven without an
          editor and in EVERY tool, not just the one that found it. */
       var was=window.VB.deliveryPath();
       window.VB.forceDeliveryPath('none');
       var r=saveBlob(new Blob(['probe']),'probe.wav');
       window.VB.forceDeliveryPath(null);
       var m=(r&&r.msg)||'';
       return {ok: !!r && r.ok===false && m.indexOf('NO FILE WAS WRITTEN')>=0 &&
                   m.indexOf('SAVED')<0 && window.VB.deliveryPath()===was,
               detail:'path none → ok='+(r&&r.ok)+', says WRITTEN not SAVED'}; }},
    {name:'ENGINE · state()/restore() round-trips BYTE-EXACT (CONTRACT)',
     fn:function(){
       var a=snapKey(window.VB.state());
       window.VB.restore(JSON.parse(a));        /* a CLONE — proves no aliasing */
       var b=snapKey(window.VB.state());
       return {ok:a===b, detail:(a===b)? (a.length+' bytes, identical') : 'DIFFERS'}; }}
  ];
  checks=engine.concat(checks);
  var out=[], failed=0;
  checks.forEach(function(c){
    var ok=false, detail='';
    try{ var r=c.fn(); if(r&&typeof r==='object'){ ok=!!r.ok; detail=r.detail||''; } else ok=!!r; }
    catch(e){ ok=false; detail='threw: '+(e&&e.message?e.message:e); }
    if(!ok) failed++;
    out.push((ok?'PASS ':'FAIL ')+c.name+(detail?('  ['+detail+']'):''));
  });
  var pre=document.createElement('pre');
  pre.id='vbselftest';
  pre.style.cssText='position:fixed;inset:0;z-index:999;background:#0b0a06;color:#d6d3d1;'+
                    'font:12px monospace;padding:12px;overflow:auto;white-space:pre-wrap';
  pre.textContent='VBSELFTEST '+(failed?'FAIL':'PASS')+' - '+toolName+' - '+
                  (checks.length-failed)+'/'+checks.length+String.fromCharCode(10,10)+
                  out.join(String.fromCharCode(10));
  document.body.appendChild(pre);
  document.title='VBSELFTEST '+(failed?'FAIL':'PASS')+' '+toolName;
  return failed===0;
}

/* boot helper every tool uses. NEVER gate first paint on rAF alone: rAF is
   PAUSED in a non-compositing webview and the tool would render blank with no
   error at all (INFRA.md risk 5). */
function vbBoot(fn){
  var done=false;
  function go(){ if(done) return; done=true; fn(); vbAnnounce(); }
  setTimeout(go,0); requestAnimationFrame(go);
}

/* ══ ANNOUNCE — one line into the editor log, once ════════════════════
   THERE IS NO DEVTOOLS WINDOW ON THIS BROWSER. Inside the editor a page is a
   black box the moment anything goes wrong on a machine that is not ours, so
   every tool says what it is, what host it thinks it is in, and where it
   believes a file can go — the three things worth knowing before anything else
   is diagnosed.

   It also carries the exact phrase `page loaded:` that verify-gui.ps1 greps for,
   which is what lets a REAL tool be gated in a real editor rather than only a
   placeholder page that was written to be gateable. A harness that can only
   verify a stub verifies nothing that ships. */
function vbAnnounce(){
  vbBridgeReady(function(bridge){
    try{
      bridge.log('page loaded: ' + (window.VB && window.VB.tool || 'unknown') +
                 ' ' + VERSION +
                 ' | host=' + (vbIsUnrealHost() ? 'unreal' : 'browser') +
                 ' | delivery=' + vbDeliveryPath() +
                 ' | storage=' + (storageOK ? 'persistent' : 'none'));
    }catch(e){}
  });
}

/* ── NAMESPACE REGISTRAR — VB.ns('daw', {…}) ───────────────────────
   Three sessions now write into one window.VB: the engine here, VB.rec from
   mini-recorder, VB.daw from mini-daw. A plain `window.VB.rec = {…}` written in
   two files means THE LAST ONE LOADED WINS and the other disappears without a
   sound — the exact silent-failure class this build keeps paying for (setDial
   coercing to NaN, the swallowed storage exception, the contract advertising
   doors that did not exist).

   So registration MERGES rather than replaces, and every duplicate key is
   RECORDED so the gate can go red on a collision instead of shipping whichever
   file happened to load second. A clash is not resolved here on purpose: two
   sessions disagreeing about who owns a verb is a routing question, and the
   honest thing is to make it visible, not to pick a winner quietly. */
var _nsClash=[];
window.VB.ns=function(name,members){
  var t=window.VB[name]||(window.VB[name]={});
  for(var k in members){
    if(!Object.prototype.hasOwnProperty.call(members,k)) continue;
    if(Object.prototype.hasOwnProperty.call(t,k)) _nsClash.push(name+'.'+k);
    t[k]=members[k];
  }
  return t;
};
window.VB.nsClashes=function(){ return _nsClash.slice(); };

</script>
<script>
/* inlined: daw.js */
/* ══════════════════════════════════════════════════════════════════════════
   MINI DAW — the tiny Reaper
   Part of the TAA tool family. Shared engine lives in ../shared/.
   ══════════════════════════════════════════════════════════════════════════ */
'use strict';
/* ══════════════════════════════════════════════════════════════════════════
   MINI DAW (DESIGN §16) — the tiny Reaper.
   "were nto replacing that, were replacing thsoe simple tasks" (§0). So: cut,
   move, snip, zoom, balance, bounce. No automation, no FX chains, no crossfades.
   The DAW owns the NOMINAL (§16.1): a clip's start IS the layer's DELAY, its
   in/out ARE the layer's trim, its pitch IS pitchNom. The Variation Designer
   varies around whatever this window says.
   ══════════════════════════════════════════════════════════════════════════ */
var RULER_H=22, TRACK_H=96, DAW_MIN_CLIP_MS=SPEC.MIN_TRIM_MS;
var daw={
  tracks:[[],[],[],[]],          /* clips per track, kept sorted by startMs */
  pxPerSec:220, posMs:0, playing:false, loop:false,
  selA:null, selB:null, selTrack:0, selClip:null,
  masterDb:0,                    /* MONITOR level only — see dawApplyLive */
  trimArmed:[false,false,false,false],   /* TRIM button: reveal the clip handles */
  _nextId:1, _t0:0, _startPos:0, _nodes:null, _raf:0, _playLevels:[0,0,0,0],
  _bounceN:0                     /* per-session bounce counter — see dawBounceName */
};

/* ── THE FADER (REAPER-SPEC items 12-13, 16) ─────────────────────────────
   Tommy's acceptance test for this whole window is "theres fucking thing i
   can slide about", so this is a real grabbable cap driven by pointer
   events, not a restyled <input type=range>. Linear in dB, which is the
   honest mapping for a tool where the number beside it is also in dB. */
var FDR_MIN=-60, FDR_MAX=6, FDR_PAD=8;
function fdrPct(db){ return ((db-FDR_MIN)/(FDR_MAX-FDR_MIN))*100; }
function fdrFromY(el,clientY){
  var r=el.getBoundingClientRect();
  var usable=Math.max(1,r.height-FDR_PAD*2);
  var y=Math.min(usable,Math.max(0,(clientY-r.top)-FDR_PAD));
  var v=FDR_MAX-(y/usable)*(FDR_MAX-FDR_MIN);
  return Math.round(Math.max(FDR_MIN,Math.min(FDR_MAX,v))*10)/10;
}
function fdrHTML(key,db,label,tall){
  return '<div class="fdr'+(tall?' tall':'')+'" data-fader="'+key+'" tabindex="0" role="slider"'+
    ' aria-label="'+label+'" aria-valuemin="'+FDR_MIN+'" aria-valuemax="'+FDR_MAX+'"'+
    ' aria-valuenow="'+db+'" title="'+label+' — grab and drag, or focus and use the arrow keys">'+
    '<div class="fdrslot"></div><div class="fdrcap" style="bottom:'+fdrPct(db).toFixed(1)+'%"></div></div>';
}
/* ── THE PANEL KNOB (REAPER-SPEC item 3) ─────────────────────────────────
   Reaper's track panel carries a small ROUND volume knob, not a slider. It is
   the same value as the mixer fader — one number, three faces — so it goes
   through fdrSet/fdrPaint and cannot drift out of step with the strip. */
var KNB_SWEEP=270;                      /* -135deg .. +135deg */
function knbDeg(db){ return -KNB_SWEEP/2 + ((db-FDR_MIN)/(FDR_MAX-FDR_MIN))*KNB_SWEEP; }
function knbHTML(key,db,label){
  return '<div class="knb" data-knob="'+key+'" tabindex="0" role="slider"'+
    ' aria-label="'+label+'" aria-valuemin="'+FDR_MIN+'" aria-valuemax="'+FDR_MAX+'"'+
    ' aria-valuenow="'+db+'" title="'+label+' — drag up/down, or focus and use the arrow keys">'+
    '<i style="transform:rotate('+knbDeg(db).toFixed(1)+'deg)"></i></div>';
}
function fdrGet(key){ return (key==='master')? daw.masterDb : L[+key].level; }
function fdrSet(key,db){
  db=Math.round(Math.max(FDR_MIN,Math.min(FDR_MAX,db))*10)/10;
  if(key==='master') daw.masterDb=db;
  else { L[+key].level=db; markStale(); }
  dawApplyLive();
  fdrPaint(key);
  if(key!=='master') VBUI.notify();
  return db;
}
function fdrPaint(key){
  var db=fdrGet(key);
  document.querySelectorAll('[data-fader="'+key+'"]').forEach(function(el){
    var cap=el.querySelector('.fdrcap');
    if(cap) cap.style.bottom=fdrPct(db).toFixed(1)+'%';
    el.setAttribute('aria-valuenow',db);
  });
  var lbl=(key==='master')? $('dMixMasterDb') : $('dMixDb'+key);
  if(lbl) lbl.textContent=db.toFixed(1);
  /* the TCP knob and the MCP fader are ONE value, so they repaint together */
  document.querySelectorAll('[data-knob="'+key+'"]').forEach(function(k){
    var d=k.querySelector('i');
    if(d) d.style.transform='rotate('+knbDeg(db).toFixed(1)+'deg)';
    k.setAttribute('aria-valuenow',db);
  });
  if(key!=='master'){
    var t=$('dTcpDb'+key); if(t) t.textContent=db.toFixed(1);
    var r=document.querySelector('[data-dg="'+key+'"]');   /* if a slider still exists */
    if(r){ r.value=db; var b=r.parentNode.querySelector('b'); if(b) b.textContent=db.toFixed(1); }
  }
}

/* ── LIVE MONITOR GAINS ──────────────────────────────────────────────────
   The arrangement is pre-rendered per play with l.level already baked into
   the samples, so a fader moved DURING playback would otherwise change
   nothing you can hear until you pressed play again - and mute/solo did
   exactly that, silently. The live node therefore carries only the DELTA
   since playback began, which keeps the bounce path untouched. */
function dawApplyLive(){
  var n=daw._nodes; if(!n) return;
  if(n.gains) for(var i=0;i<4;i++){
    var g=n.gains[i]; if(!g) continue;
    g.gain.value = dawAudible(i)? Math.pow(10,(L[i].level-(daw._playLevels[i]||0))/20) : 0;
  }
  if(n.master) n.master.gain.value=Math.pow(10,daw.masterDb/20);
}
function dawTrackName(i){ return L[i].name || ('TRACK '+SLOT_IDS[i]); }

/* build one clip per track from what is loaded — the DAW opens showing the same
   four layers the Variation window has, because they are the same four layers */
function dawSync(){
  for(var i=0;i<4;i++){
    var l=L[i];
    if(!l.files.length){ daw.tracks[i]=[]; continue; }
    if(daw.tracks[i].length) continue;              /* already arranged */
    var f=l.files[0];
    daw.tracks[i]=[{id:daw._nextId++, fileIdx:0, startMs:l.delay,
                    inMs:0, outMs:f.durMs}];
  }
}
function dawLen(){                                   /* arrangement length, ms */
  var mx=1000;
  for(var i=0;i<4;i++) daw.tracks[i].forEach(function(c){
    if(c.startMs+(c.outMs-c.inMs)>mx) mx=c.startMs+(c.outMs-c.inMs); });
  return mx+500;
}
function msToPx(ms){ return ms/1000*daw.pxPerSec; }
function pxToMs(px){ return px/daw.pxPerSec*1000; }

/* ── ONE CLIP, rendered. Trim -> trim fades -> pitchNom varispeed -> LP/HP ->
      level. No variation draws: this is the nominal, by definition. ─────── */
function clipSamples(ti,c){
  var l=L[ti], f=l.files[c.fileIdx]; if(!f) return new Float32Array(0);
  var a=Math.max(0,Math.round(c.inMs/1000*SR));
  var b=Math.min(f.samples.length,Math.round(c.outMs/1000*SR));
  if(b-a<8) return new Float32Array(0);
  var n=b-a, out=new Float32Array(n), i;
  out.set(f.samples.subarray(a,b));
  /* §14.2 fades on any edge that was actually cut — this is what stops a butt
     join clicking, and it is the same rule the Variation trim uses */
  var maxF=Math.floor(n*SPEC.TRIM_FADE_MAX_PCT/100);
  if(a>0){ var fi=Math.min(Math.round(SPEC.TRIM_FADE_IN_MS/1000*SR),maxF);
    for(i=0;i<fi;i++) out[i]*=0.5-0.5*Math.cos(Math.PI*i/fi); }
  if(b<f.samples.length){ var fo=Math.min(Math.round(SPEC.TRIM_FADE_OUT_MS/1000*SR),maxF);
    for(i=0;i<fo;i++) out[n-1-i]*=0.5-0.5*Math.cos(Math.PI*i/fo); }
  var cents=l.pitchNom||0;
  if(Math.abs(cents)>0.001){
    var rate=Math.pow(2,cents/1200), m=Math.max(2,Math.floor(n/rate)), o2=new Float32Array(m);
    for(i=0;i<m;i++){ var x=i*rate,i0=Math.floor(x),fr=x-i0;
      var s0=out[i0]||0,s1=out[i0+1]||0; o2[i]=s0+(s1-s0)*fr; }
    out=o2; n=m;
  }
  if(l.lp<20000){ var cc=Math.exp(-2*Math.PI*l.lp/SR),z=0;
    for(i=0;i<n;i++){ z=out[i]*(1-cc)+z*cc; out[i]=z; } }
  if(l.hp>20){ var ch=Math.exp(-2*Math.PI*l.hp/SR),zh=0;
    for(i=0;i<n;i++){ zh=out[i]*(1-ch)+zh*ch; out[i]=out[i]-zh; } }
  var g=Math.pow(10,l.level/20);
  for(i=0;i<n;i++) out[i]*=g;
  return out;
}
/* the whole track, laid out in time. PURE: no device, no UI. */
function trackArrangement(ti,lenMs){
  var N=Math.round((lenMs||dawLen())/1000*SR), buf=new Float32Array(N);
  daw.tracks[ti].forEach(function(c){
    var s=clipSamples(ti,c), off=Math.round(c.startMs/1000*SR);
    for(var i=0;i<s.length;i++){ var j=off+i; if(j>=0&&j<N) buf[j]+=s[i]; }
  });
  return buf;
}
function dawAudible(ti){
  return !!(daw.tracks[ti].length && audibleSlot(L[ti]));
}

/* ── NO OVERLAP, EVER (§16.5). A move that would overlap is CLAMPED, and the
      clamped value is what the caller gets back — so it is observable. ──── */
function clipLen(c){ return c.outMs-c.inMs; }
function clampClip(ti,c,wantStart){
  var others=daw.tracks[ti].filter(function(x){return x!==c;})
                           .sort(function(a,b){return a.startMs-b.startMs;});
  var start=Math.max(0,wantStart), end=start+clipLen(c), guard=0;
  for(var i=0;i<others.length;i++){
    var o=others[i], oe=o.startMs+clipLen(o);
    if(start<oe && end>o.startMs){
      /* Butt it against whichever edge it is nearer — never overlap, never
         crossfade; §16.5 says two clips may not share an instant.
         THE `>= 0` IS THE WHOLE FIX (ENGINE handoff, 25 Aug): the left branch
         is only taken when the clip actually FITS before the neighbour.
         Without it, dragging a clip left onto a neighbour that starts nearer
         the origin than the clip is long clamped to 0, STILL overlapped, and
         restarted the scan forever — freezing the window with no console
         error. The gate never caught it because every existing check splits
         clips into EQUAL halves, where the midpoint test happens to take the
         other branch: a pass by coincidence, not by correctness. */
      if((start+end)/2 < (o.startMs+oe)/2 && o.startMs-clipLen(c) >= 0)
           start=o.startMs-clipLen(c);
      else start=oe;
      end=start+clipLen(c);
      /* a loop that can only be re-entered by accident should SAY so, not spin */
      if(++guard>1000) throw new Error('clampClip did not settle: ti='+ti+
        ' want='+wantStart+' len='+clipLen(c)+' start='+start);
      i=-1;                       /* re-check against everything after moving */
    }
  }
  return start;
}
function sortTrack(ti){ daw.tracks[ti].sort(function(a,b){return a.startMs-b.startMs;}); }

function dawSplit(ti,atMs){
  var list=daw.tracks[ti], made=null;
  for(var i=0;i<list.length;i++){
    var c=list[i], len=clipLen(c);
    if(atMs>c.startMs+DAW_MIN_CLIP_MS && atMs<c.startMs+len-DAW_MIN_CLIP_MS){
      var cut=atMs-c.startMs;
      var right={id:daw._nextId++, fileIdx:c.fileIdx, startMs:atMs,
                 inMs:c.inMs+cut, outMs:c.outMs};
      c.outMs=c.inMs+cut;
      list.push(right); sortTrack(ti);
      made=[c.id,right.id];
      break;
    }
  }
  return made;
}

/* ══ PLAYBACK — one buffer per track so mute/solo/gain/pan and the per-track
     meters are all real, not simulated. ═══════════════════════════════════ */
/* the transport strip's own paint: the play lamp and the status word */
function dawTransportPaint(){
  var p=$('dPlay'); if(p) p.classList.toggle('on',daw.playing);
  var l=$('dLoop'); if(l) l.classList.toggle('on',daw.loop);
  var s=$('dState');
  if(s){ s.textContent=daw.playing?'[Playing]':'[Stopped]'; s.classList.toggle('live',daw.playing); }
}
function dawStop(){
  daw.playing=false;
  if(daw._nodes){ daw._nodes.srcs.forEach(function(s){ try{s.stop();}catch(e){} }); daw._nodes=null; }
  if(daw._raf){ cancelAnimationFrame(daw._raf); daw._raf=0; }
  dawTransportPaint();
  dawPaintMeters(null);
}
/* ── §16.2 TRANSPORT SEMANTICS ───────────────────────────────────────────
   "Stop returns the playhead to where playback started; a second stop
   returns it to zero (the Reaper behaviour people expect)." The window had
   never implemented this — stop simply left the playhead wherever the tick
   had got to. The STOP button is new furniture, so this is where the spec
   finally gets honoured. PAUSE is the opposite by design: it holds. */
function dawTransportStop(){
  if(daw.playing){ var back=daw._startPos; dawStop(); daw.posMs=Math.max(0,back); }
  else { daw.posMs=0; }
  dawPaintPlayhead(); dawTransportPaint(); dawPaint();
}
function dawTransportPause(){
  if(daw.playing) dawStop();               /* hold position — do NOT rewind */
  dawPaintPlayhead(); dawTransportPaint();
}
function dawGoStart(){ if(daw.playing) dawStop(); daw.posMs=0;
  dawPaintPlayhead(); dawTransportPaint(); dawPaint(); }
function dawGoEnd(){ if(daw.playing) dawStop(); daw.posMs=Math.max(0,dawLen()-500);
  dawPaintPlayhead(); dawTransportPaint(); dawPaint(); }
function dawPlay(){
  if(daw.playing){ dawTransportStop(); return; }   /* §16.2: Space is play / STOP */
  if(!anyLoaded()){ setS('load some files first'); return; }
  dawSync();
  var ctx=audioReady(), lenMs=dawLen();
  var master=ctx.createGain(); master.gain.value=Math.pow(10,daw.masterDb/20);
  var mAn=ctx.createAnalyser(); mAn.fftSize=1024;
  master.connect(mAn); mAn.connect(ctx.destination);
  var srcs=[], ans=[], gains=[];
  for(var i=0;i<4;i++){
    var buf=ctx.createBuffer(1,Math.max(1,Math.round(lenMs/1000*SR)),SR);
    buf.getChannelData(0).set(trackArrangement(i,lenMs));
    var src=ctx.createBufferSource(); src.buffer=buf;
    var g=ctx.createGain(); g.gain.value=dawAudible(i)?1:0;
    var pan=ctx.createStereoPanner? ctx.createStereoPanner():null;
    if(pan) pan.pan.value=Math.max(-1,Math.min(1,(L[i].pan||0)/100));
    var an=ctx.createAnalyser(); an.fftSize=1024;
    src.connect(g); g.connect(an);
    if(pan){ an.connect(pan); pan.connect(master); } else an.connect(master);
    var a=daw.posMs/1000;
    if(daw.loop && daw.selA!==null && daw.selB!==null){
      src.loop=true; src.loopStart=Math.min(daw.selA,daw.selB)/1000;
      src.loopEnd=Math.max(daw.selA,daw.selB)/1000;
    } else if(daw.loop){ src.loop=true; }
    src.start(0,a);
    srcs.push(src); ans.push(an); gains.push(g);
    daw._playLevels[i]=L[i].level;      /* what is BAKED into this render */
  }
  daw._nodes={srcs:srcs, ans:ans, mAn:mAn, gains:gains, master:master};
  daw._t0=ctx.currentTime; daw._startPos=daw.posMs; daw.playing=true;
  dawTransportPaint();
  dawTick();
}
function dawTick(){
  if(!daw.playing) return;
  var ctx=audioReady(), lenMs=dawLen();
  var pos=daw._startPos+(ctx.currentTime-daw._t0)*1000;
  if(daw.loop && daw.selA!==null && daw.selB!==null){
    var a=Math.min(daw.selA,daw.selB), b=Math.max(daw.selA,daw.selB);
    if(pos>b) pos=a+((pos-a)%(b-a||1));
  } else if(pos>lenMs){ daw.posMs=0; dawStop(); dawPaintPlayhead(); return; }
  daw.posMs=pos;
  dawPaintPlayhead(); dawPaintMeters(daw._nodes);
  daw._raf=requestAnimationFrame(dawTick);
}
/* peak meters with the §16.3 ballistics, and the CLIP LED reads the signal
   BEFORE any guard (ruling, 25 Aug) — a LED on the output can never light */
var meterHold=[0,0,0,0,0], meterClip=[false,false,false,false,false], meterVal=[0,0,0,0,0];
function analyserPeak(an){
  var d=new Float32Array(an.fftSize); an.getFloatTimeDomainData(d);
  var m=0; for(var i=0;i<d.length;i++){ var v=d[i]<0?-d[i]:d[i]; if(v>m)m=v; }
  return m;
}
function analyserRms(an){
  var d=new Float32Array(an.fftSize); an.getFloatTimeDomainData(d);
  var s=0; for(var i=0;i<d.length;i++) s+=d[i]*d[i];
  return Math.sqrt(s/d.length);
}
/* one bar, painted from the values §16.3 already decided. Kept as a helper so
   the SAME numbers drive the TCP meter and its twin in the mixer strip. */
function paintOneBar(bar,vLin,hLin){
  if(!bar) return;
  var dbv=20*Math.log10(Math.max(1e-5,vLin));
  var h=Math.max(0,Math.min(1,(dbv+60)/60));
  bar.querySelector('b').style.height=(h*100)+'%';
  var hb=20*Math.log10(Math.max(1e-5,hLin));
  var hh=Math.max(0,Math.min(1,(hb+60)/60));
  var hold=bar.querySelector('i');
  hold.style.display=hLin>0.001?'':'none';
  hold.style.bottom=(hh*100)+'%';
}
function dawPaintMeters(nodes){
  for(var i=0;i<5;i++){
    var pk=0;
    if(nodes){ pk = (i<4)? analyserPeak(nodes.ans[i]) : analyserPeak(nodes.mAn); }
    var rel=Math.pow(10,-(SPEC.METER_RELEASE_DB_S||20)/20*0.033);
    meterVal[i]=Math.max(pk, meterVal[i]*rel);
    if(pk>=meterHold[i]) meterHold[i]=pk; else meterHold[i]*=0.995;
    if(pk>=1.0) meterClip[i]=true;
    var led=(i<4)? document.querySelector('#dMtr'+i+' .dled') : $('dMasterLed');
    paintOneBar((i<4)? document.querySelector('#dMtr'+i+' .dbar') : $('dMasterBar'),
                meterVal[i], meterHold[i]);
    paintOneBar((i<4)? $('dMixMtr'+i) : $('dMixMasterBar'), meterVal[i], meterHold[i]);
    if(led) led.classList.toggle('hot',meterClip[i]);
  }
  /* MASTER RMS readout — Reaper's master shows peak AND RMS. This is a
     separate instantaneous reading; it does NOT touch the §16.3 peak
     ballistics above, which stay peak-reading exactly as specified. */
  var rl=$('dMixMasterRms');
  if(rl){
    var rms=nodes? analyserRms(nodes.mAn) : 0;
    rl.textContent=(rms>0.00002)? (20*Math.log10(rms)).toFixed(1) : '−∞';
  }
}
function dawClearClip(){ for(var i=0;i<5;i++){meterClip[i]=false;meterHold[i]=0;} dawPaintMeters(daw._nodes); }

/* ── THE BOUNCE FILENAME (TOOL RECORDER's find, 25 Aug) ──────────────────
   It used to be `M.name + '_bounce.wav'`, which is TWO bugs in one string.
   M.name defaults to 'variation', so the Mini DAW was writing
   `variation_bounce.wav` — a name that belongs to the Variation Designer — and
   in the plugin BOTH tools write into the SAME project folder, so a shared
   default meant one tool silently overwriting the other's file.
   The tool tag goes in the name so it can never be mistaken for the other
   tool's output, and a per-session counter stops a second bounce quietly
   landing on the first.
   HONEST LIMIT, stated rather than implied away: this counter resets when the
   page reloads, so a bounce in a NEW session can still overwrite an old file of
   the same name. The page cannot see the disk, so it cannot know. What covers
   that is the engine's delivery verdict, which prints the exact path it wrote —
   an overwrite is visible rather than silent, which was the actual ask. */
var DAW_BOUNCE_TAG='mini-daw';
function dawBounceName(){
  daw._bounceN++;
  return (M.name||'mix')+'_'+DAW_BOUNCE_TAG+'_bounce'+
         (daw._bounceN>1? ('-'+daw._bounceN) : '')+'.wav';
}

/* ── BOUNCE SELECTION -> one WAV (Tommy's "mix 2-4 sounds into one") ───── */
function dawBounceSelection(){
  dawSync();
  var a=(daw.selA!==null&&daw.selB!==null)?Math.min(daw.selA,daw.selB):0;
  var b=(daw.selA!==null&&daw.selB!==null)?Math.max(daw.selA,daw.selB):dawLen();
  if(b-a<10){ setS('selection too short'); return null; }   /* null = nothing came back */
  var lenMs=dawLen(), N=Math.round((b-a)/1000*SR), s0=Math.round(a/1000*SR);
  var mix=new Float32Array(N);
  for(var t=0;t<4;t++){
    if(!dawAudible(t)) continue;
    var arr=trackArrangement(t,lenMs);
    for(var i=0;i<N;i++){ var j=s0+i; if(j<arr.length) mix[i]+=arr[j]; }
  }
  /* CLIP is judged PRE-guard (ruling); the written file is guarded */
  var pk=0; for(i=0;i<N;i++){ var v=mix[i]<0?-mix[i]:mix[i]; if(v>pk)pk=v; }
  var clipped=pk>1.0;
  var G=Math.pow(10,-0.1/20), g=(pk>G)?G/pk:1;
  for(i=0;i<N;i++) mix[i]*=g;
  var fo=Math.min(Math.round(M.tailFade/1000*SR),N-1);
  for(i=0;i<fo;i++) mix[N-1-i]*=0.5-0.5*Math.cos(Math.PI*i/fo);
  if(N>0) mix[N-1]=0;
  var outName=dawBounceName();
  saveBlob(new Blob([encWAV([mix],M.bits,M.rate)],{type:'audio/wav'}), outName);
  /* Names the FILE, and does not use the word SAVED — the engine's delivery
     verdict lands a tick later and replaces this line with SAVED + the real
     path, or with NO FILE WAS WRITTEN. An optimistic message must not be the
     last word standing when nothing exists. */
  setS('bounced '+((b-a)/1000).toFixed(2)+'s to '+outName+
       (clipped?' — it was clipping before the guard':''));
  /* Return the SAME array that was just encoded, not a second computation:
     two code paths that are supposed to agree eventually stop agreeing.
     VB.daw.bounceSelection() already passes this straight through. */
  return {samples:mix, sampleRate:M.rate, lenMs:b-a, clipped:clipped, gain:g,
          rangeMs:[a,b]};
}

/* ══ DAW UI ═══════════════════════════════════════════════════════════════ */
function dawBuild(){
  dawSync();
  var hdrs=$('dHdrs'), mtrs=$('dMtrs'), lanes=$('dLanes');
  hdrs.innerHTML='<div class="dspacer"></div>';

      '<div class="dknob"><span>PITCH</span><input type="range" data-dt="'+i+'" min="-1200" max="1200" step="10" value="'+(l.pitchNom||0)+'"><b>'+(l.pitchNom||0)+'</b></div>'+
      '<div style="font-size:12px;color:var(--dim)" id="dClipCount'+i+'"></div>';
    hdrs.appendChild(h);
    var m=document.createElement('div');
    m.className='dmtr'; m.id='dMtr'+i;
    m.innerHTML='<div class="dbar"><b style="height:0"></b><i style="bottom:0;display:none"></i></div>'+
                '<span class="dled"></span>';
    mtrs.appendChild(m);
    var ln=document.createElement('div');
    ln.className='dlane'+(i===daw.selTrack?' sel':'')+(daw.trimArmed[i]?' trimon':'');
    ln.id='dLane'+i; ln.dataset.t=i;

}
/* the MCP: one channel strip per track, M/S above the fader, name below */
function dawBuildMixer(){
  var mix=$('dMixTracks'); if(!mix) return;
  mix.innerHTML='';
  for(var i=0;i<4;i++){
    var l=L[i];
    var st=document.createElement('div');

    st.dataset.mt=i;

        '<div class="dbar" id="dMixMtr'+i+'"><b style="height:0"></b><i style="bottom:0;display:none"></i></div>'+
      '</div>'+
      '<div class="mdb" id="dMixDb'+i+'">'+l.level.toFixed(1)+'</div>'+
      '<div class="mname">'+dawTrackName(i)+'</div>';

  }

}
function dawPaint(){
  dawSync();
  var lenMs=dawLen(), W=msToPx(lenMs);
  $('dInner').style.width=Math.max(W,400)+'px';
  /* ruler ticks at a sensible step for the current zoom */
  var step=0.1; var cands=[0.01,0.02,0.05,0.1,0.25,0.5,1,2,5,10];
  for(var ci=0;ci<cands.length;ci++){ if(msToPx(cands[ci]*1000)>=54){ step=cands[ci]; break; } step=cands[cands.length-1]; }
  var r=$('dRuler'); r.innerHTML='';
  for(var t=0;t<=lenMs/1000;t+=step){
    var i2=document.createElement('i');
    i2.style.left=msToPx(t*1000)+'px';
    i2.textContent=(step<1? t.toFixed(2) : t.toFixed(1))+'s';
    r.appendChild(i2);
  }
  /* selection band */
  var old=document.getElementById('dSelBand'); if(old) old.remove();
  if(daw.selA!==null&&daw.selB!==null){
    var band=document.createElement('div'); band.className='dselrange'; band.id='dSelBand';
    var a=Math.min(daw.selA,daw.selB), b=Math.max(daw.selA,daw.selB);
    band.style.left=msToPx(a)+'px'; band.style.width=Math.max(1,msToPx(b-a))+'px';
    $('dInner').appendChild(band);
    $('dSel').textContent='SEL '+(a/1000).toFixed(3)+'s – '+(b/1000).toFixed(3)+'s  ('+((b-a)/1000).toFixed(2)+'s)';
  } else $('dSel').textContent='no selection — drag on the ruler';
  /* clips */
  for(var ti=0;ti<4;ti++){
    var lane=$('dLane'+ti); if(!lane) continue;
    lane.innerHTML='';
    lane.classList.toggle('sel',ti===daw.selTrack);
    var cc=$('dClipCount'+ti);
    if(cc) cc.textContent=daw.tracks[ti].length? (daw.tracks[ti].length+' clip'+(daw.tracks[ti].length>1?'s':'')+(daw.tracks[ti].length>1?' · 1st = the layer':'')) : 'empty';
    daw.tracks[ti].forEach(function(c){
      var el=document.createElement('div');
      el.className='clip'+(daw.selClip===c.id?' sel':'');
      el.style.left=msToPx(c.startMs)+'px';
      el.style.width=Math.max(6,msToPx(clipLen(c)))+'px';
      el.dataset.t=ti; el.dataset.c=c.id;
      el.innerHTML='<canvas></canvas><span class="ctag">'+(L[ti].files[c.fileIdx]?L[ti].files[c.fileIdx].name:'')+'</span>'+
                   '<span class="ctab l"></span><span class="ctab r"></span>';
      lane.appendChild(el);
      var cv=el.querySelector('canvas');
      var f=L[ti].files[c.fileIdx];
      if(f) drawWave(cv,f.samples,{col:L[ti].wave,zero:false,
        s0:Math.round(c.inMs/1000*SR), sN:Math.round(clipLen(c)/1000*SR)});
    });
  }
  dawPaintPlayhead();
  for(var k=0;k<4;k++){
    var hh=$('dHdr'+k); if(hh) hh.classList.toggle('sel',k===daw.selTrack);
  }
}
function dawPaintPlayhead(){
  var ph=$('dPh'); if(ph) ph.style.left=msToPx(daw.posMs)+'px';
  var t=daw.posMs/1000;
  var mm=Math.floor(t/60), ss=Math.floor(t%60), ms=Math.floor((t*1000)%1000);
  $('dTime').textContent=padNum(mm,2)+':'+padNum(ss,2)+'.'+padNum(ms,3);
}
function dawWire(){
  document.querySelectorAll('[data-m]').forEach(function(b){
    b.addEventListener('click',function(e){ var i=+b.dataset.m; L[i].mute=!L[i].mute;
      dawApplyLive(); dawBuild(); onEdit(); e.stopPropagation(); });
  });
  document.querySelectorAll('[data-o]').forEach(function(b){
    b.addEventListener('click',function(e){ var i=+b.dataset.o; L[i].solo=!L[i].solo;
      dawApplyLive(); dawBuild(); onEdit(); e.stopPropagation(); });
  });
  /* clicking a mixer strip selects that track, same as clicking its TCP panel */
  document.querySelectorAll('[data-mt]').forEach(function(s){
    s.addEventListener('click',function(){ daw.selTrack=+s.dataset.mt; dawBuild(); });
  });
  /* TRIM — reveals this track's clip trim handles. Furniture doing furniture's
     job: it changes what you can SEE, never a sample. The §14 handles were
     always draggable but nobody could tell they were there. */
  document.querySelectorAll('[data-trim]').forEach(function(b){
    b.addEventListener('click',function(e){
      var i=+b.dataset.trim; daw.trimArmed[i]=!daw.trimArmed[i];
      dawBuild();
      setS(daw.trimArmed[i]
        ? ('trim handles shown on '+dawTrackName(i)+' — drag a clip edge to trim it')
        : ('trim handles hidden on '+dawTrackName(i)));
      e.stopPropagation();
    });
  });
  /* THE PANEL KNOBS — same value as the mixer fader, dragged vertically */
  document.querySelectorAll('[data-knob]').forEach(function(k){
    var key=k.dataset.knob;
    k.addEventListener('pointerdown',function(e){
      if(e.isTrusted){ try{ k.setPointerCapture(e.pointerId); }catch(_){} }
      k.dataset.drag='1'; k.dataset.y=e.clientY; k.dataset.v=fdrGet(key);
      e.preventDefault(); e.stopPropagation();
    });
    k.addEventListener('pointermove',function(e){
      if(k.dataset.drag!=='1') return;
      var dy=(+k.dataset.y)-e.clientY;            /* up = louder */
      fdrSet(key, (+k.dataset.v) + dy*0.5);       /* 0.5 dB per pixel */
    });
    function kend(e){ if(k.dataset.drag==='1'){ k.dataset.drag=''; onEdit(); }
      try{ k.releasePointerCapture(e.pointerId); }catch(_){} }
    k.addEventListener('pointerup',kend);
    k.addEventListener('pointercancel',kend);
    k.addEventListener('keydown',function(e){
      var step=e.shiftKey?0.1:1, v=fdrGet(key), used=true;
      if(e.key==='ArrowUp'||e.key==='ArrowRight') fdrSet(key,v+step);
      else if(e.key==='ArrowDown'||e.key==='ArrowLeft') fdrSet(key,v-step);
      else if(e.key==='Home') fdrSet(key,FDR_MAX);
      else if(e.key==='End') fdrSet(key,FDR_MIN);
      else used=false;
      if(used){ onEdit(); e.preventDefault(); e.stopPropagation(); }
    });
    k.addEventListener('dblclick',function(e){ fdrSet(key,0); onEdit(); e.stopPropagation(); });
  });
  /* THE FADERS — grab, drag, or focus and arrow. This is the acceptance test. */
  document.querySelectorAll('[data-fader]').forEach(function(el){
    var key=el.dataset.fader;
    el.addEventListener('pointerdown',function(e){
      /* Capture only for a REAL pointer. A synthetic test event carries an id
         no pointer owns, and capturing it makes Chrome retarget the events we
         are about to dispatch — which killed the renderer outright rather than
         failing a test. Real drags still capture, so dragging off the fader
         keeps working; scripted drags simply skip it. */
      if(e.isTrusted){ try{ el.setPointerCapture(e.pointerId); }catch(_){} }
      el.dataset.drag='1';
      fdrSet(key,fdrFromY(el,e.clientY));
      e.preventDefault(); e.stopPropagation();
    });
    el.addEventListener('pointermove',function(e){
      if(el.dataset.drag!=='1') return;
      fdrSet(key,fdrFromY(el,e.clientY));
    });
    function end(e){ if(el.dataset.drag==='1'){ el.dataset.drag=''; onEdit(); }
      try{ el.releasePointerCapture(e.pointerId); }catch(_){} }
    el.addEventListener('pointerup',end);
    el.addEventListener('pointercancel',end);
    el.addEventListener('keydown',function(e){
      var step=e.shiftKey?0.1:1, v=fdrGet(key), used=true;
      if(e.key==='ArrowUp'||e.key==='ArrowRight') fdrSet(key,v+step);
      else if(e.key==='ArrowDown'||e.key==='ArrowLeft') fdrSet(key,v-step);
      else if(e.key==='Home') fdrSet(key,FDR_MAX);
      else if(e.key==='End') fdrSet(key,FDR_MIN);
      else if(e.key==='PageUp') fdrSet(key,v+6);
      else if(e.key==='PageDown') fdrSet(key,v-6);
      else used=false;
      if(used){ onEdit(); e.preventDefault(); e.stopPropagation(); }
    });
    el.addEventListener('dblclick',function(e){ fdrSet(key,0); onEdit(); e.stopPropagation(); });
  });
  document.querySelectorAll('[data-dg]').forEach(function(r){
    r.addEventListener('input',function(){ var i=+r.dataset.dg; L[i].level=+r.value;
      r.parentNode.querySelector('b').textContent=L[i].level.toFixed(1);
      dawApplyLive(); fdrPaint(String(i));      /* the MCP fader follows the TCP slider */
      markStale(); VBUI.notify(); });
  });
  document.querySelectorAll('[data-dp]').forEach(function(r){
    r.addEventListener('input',function(){ var i=+r.dataset.dp; L[i].pan=+r.value;
      r.parentNode.querySelector('b').textContent=L[i].pan; markStale(); });
  });
  document.querySelectorAll('[data-dt]').forEach(function(r){
    r.addEventListener('input',function(){ var i=+r.dataset.dt; L[i].pitchNom=+r.value;
      r.parentNode.querySelector('b').textContent=L[i].pitchNom; markStale(); VBUI.notify(); });
  });
}
/* ruler: click = locate, drag = selection (§16.2) */
(function(){
  var rl=null, dragging=false, downX=0, moved=false;
  function ready(){ rl=$('dRuler'); if(!rl) return;
    rl.addEventListener('pointerdown',function(e){
      var r=rl.getBoundingClientRect(), x=e.clientX-r.left+$('dScroll').scrollLeft;
      downX=x; moved=false; dragging=true; rl.setPointerCapture(e.pointerId);
      daw.selA=pxToMs(x); daw.selB=null; dawPaint();
    });
    rl.addEventListener('pointermove',function(e){
      if(!dragging) return;
      var r=rl.getBoundingClientRect(), x=e.clientX-r.left+$('dScroll').scrollLeft;
      if(Math.abs(x-downX)>3){ moved=true; daw.selB=pxToMs(x); dawPaint(); }
    });
    rl.addEventListener('pointerup',function(e){
      if(!dragging) return; dragging=false;
      if(!moved){ daw.posMs=Math.max(0,pxToMs(downX)); daw.selA=daw.selB=null; }
      dawPaint();
    });
  }
  setTimeout(ready,0);
})();
/* clips: drag body = move (clamped), drag a tab = trim */
document.addEventListener('pointerdown',function(e){
  var el=e.target.closest? e.target.closest('.clip') : null;
  if(!el || !$('dawPane').classList.contains('on')) return;
  var ti=+el.dataset.t, id=+el.dataset.c;
  var c=daw.tracks[ti].filter(function(x){return x.id===id;})[0]; if(!c) return;
  daw.selTrack=ti; daw.selClip=id;
  var tab=e.target.classList&&e.target.classList.contains('ctab')?
          (e.target.classList.contains('l')?'l':'r') : null;
  var x0=e.clientX, s0=c.startMs, in0=c.inMs, out0=c.outMs;
  var f=L[ti].files[c.fileIdx];
  function mv(ev){
    var dms=pxToMs(ev.clientX-x0);
    if(tab==='l'){
      var ni=Math.max(0,Math.min(in0+dms,out0-DAW_MIN_CLIP_MS));
      c.inMs=ni; c.startMs=Math.max(0,s0+(ni-in0));
    }else if(tab==='r'){
      c.outMs=Math.min(f?f.durMs:out0, Math.max(in0+DAW_MIN_CLIP_MS,out0+dms));
    }else{
      c.startMs=clampClip(ti,c,s0+dms);
    }
    sortTrack(ti); dawPaint();
  }
  function up(){ document.removeEventListener('pointermove',mv);
    document.removeEventListener('pointerup',up);
    /* the FIRST clip defines the layer (§16.1b) — push it back to the engine */
    dawCommitNominal(ti); onEdit(); }
  document.addEventListener('pointermove',mv);
  document.addEventListener('pointerup',up);
  e.preventDefault(); dawPaint();
});
/* §16.1b: the first clip's start IS the layer's DELAY and its in/out ARE the trim */
function dawCommitNominal(ti){
  var list=daw.tracks[ti]; if(!list.length) return;
  var c=list[0];
  L[ti].delay=Math.round(c.startMs);
  L[ti].trimIn=c.inMs;
  L[ti].trimOut=c.outMs;
}
var _dawFitted=false;
function dawFitZoom(force){
  if(_dawFitted && !force) return;
  var sc=$('dScroll'); if(!sc) return;
  var w=sc.clientWidth||900, lenS=dawLen()/1000;
  if(lenS>0.05){ daw.pxPerSec=Math.max(40,Math.min(4000,(w-24)/lenS)); _dawFitted=true; dawPaint(); }
}
function dawZoom(mult){
  daw.pxPerSec=Math.max(40,Math.min(4000,daw.pxPerSec*mult));
  dawPaint();
}

<script>
/* inlined: daw-app.js */

   ══════════════════════════════════════════════════════════════════════════ */
'use strict';

$('dPlay').addEventListener('click',dawPlay);

/* the rest of the round transport buttons (§16.2). Still NO record button. */

/* DAW keys. S is SPLIT (Reaper muscle memory, Tommy's explicit ask), so solo
   moved to O — one key cannot serve two masters. Director blessed 25 Aug. */
document.addEventListener('keydown',function(e){

  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='Y')){ doRedo(); e.preventDefault(); return; }

/* ── §16.1 THE POSITION IS **ONE FIELD** ───────────────────────────
   clip[0].startMs IS layer.delay — not a copy of it. Dragging the first clip
   moves the deviation-bar centre; clips[1..n] are ARRANGEMENT and never do.

   The bug this closes: the engine writes `l.delay` in three places nothing in
   this window was listening to — the demo kit, preset load, and UNDO. dawSync()
   only builds clips when a track has none, so after an undo the layer's nominal
   moved and the clip on screen stayed exactly where it was. Two fields claiming
   to be one, disagreeing in silence.

   The loop is closed deliberately in both directions: the field drives the clip,
   the clip is CLAMPED against its neighbour, and the clamped truth is written
   straight back to the field. If a neighbour refuses the move, the number you
   read is the number that happened — never the number that was asked for. */
function dawNominalFits(t,c0,want){
  if(!(want>=0)) return false;
  var len=c0.outMs-c0.inMs, list=daw.tracks[t];
  for(var i=0;i<list.length;i++){
    var o=list[i]; if(o===c0) continue;
    if(want < o.startMs+(o.outMs-o.inMs) && want+len > o.startMs) return false;
  }
  return true;
}
function dawAdoptNominal(){
  for(var t=0;t<4;t++){
    var list=daw.tracks[t]; if(!list||!list.length) continue;
    var c0=list[0], want=L[t].delay;
    if(Math.round(c0.startMs)===Math.round(want)) continue;
    if(dawNominalFits(t,c0,want)) c0.startMs=want;
    /* Either way the FIELD is written from the CLIP, so the two can never
       disagree in silence. If a later clip blocks the move the timeline wins
       and the number is corrected to what actually happened — a nominal that
       cannot be represented on the timeline is not a nominal, it is a lie.

       This deliberately does NOT call clampClip(): that function restarts its
       scan with `i=-1` and OSCILLATES FOREVER when a clip is pulled left onto a
       neighbour it cannot fit before (proven: want=0, len=50, others=[[40,50]]
       — it clamps to 0, still overlaps, and restarts). That hang is reachable
       from an ordinary drag and is reported to TOOL DAW, whose file it is. */
    dawCommitNominal(t);
  }
}

/* the tool's half of the contract (§16.6, §16.6b) — NAMESPACED, 25 Aug.
   Director's ruling: core stays core, each tool registers its own namespace.
   `tool` stays flat because it names the PAGE, not a DAW verb. */
window.VB.tool='mini-daw';
VB.ns('daw',{
  transport:function(){
    return {playing:daw.playing, positionMs:daw.posMs, loop:daw.loop,
            selectionMs:(daw.selA!==null&&daw.selB!==null)?
              [Math.min(daw.selA,daw.selB),Math.max(daw.selA,daw.selB)]:null};
  },
  setTransport:function(o){
    if(!o) return window.VB.daw.transport();
    if(o.positionMs!==undefined){ daw.posMs=Math.max(0,+o.positionMs); dawPaintPlayhead(); }
    if(o.loop!==undefined) daw.loop=!!o.loop;
    if(o.selectionMs===null){ daw.selA=daw.selB=null; }
    else if(o.selectionMs){ daw.selA=+o.selectionMs[0]; daw.selB=+o.selectionMs[1]; }

            than a scrollbar because nothing told you the fourth track existed —
            the invisible-MORE-button bug. DOM-presence is NOT the assertion:
            each lane must be scrollable INTO VIEW.
            NOTE, measured by fault injection: setting scrollTop works even on an
            overflow:hidden box, so the bring-into-view probe alone does NOT catch
            the clip — a SCRIPT can reach a lane a USER cannot. The overflow-y
            assertion is the half that proves user-reachability, and both are in
            the verdict deliberately. Injecting the old overflow-y:hidden takes
            this contract red at 35/36; it has been seen to fail. */
         var body=document.querySelector('.dawbody');
         if(!body) return {ok:false, detail:'no .dawbody scroller'};
         var prevMax=body.style.maxHeight, prevTop=body.scrollTop;
         body.style.maxHeight='200px';                  /* force the short case */
         void body.offsetHeight;                        /* settle layout */
         var overflows=body.scrollHeight>body.clientHeight+1;
         var oy=getComputedStyle(body).overflowY;
         var unreachable=[];
         for(var i=0;i<4;i++){
           var ln=$('dLane'+i);
           if(!ln){ unreachable.push(i+':missing'); continue; }
           var lr=ln.getBoundingClientRect(), br=body.getBoundingClientRect();
           body.scrollTop+=(lr.top-br.top);             /* bring it into view */
           void body.offsetHeight;
           lr=ln.getBoundingClientRect(); br=body.getBoundingClientRect();
           var visible=lr.height>0 && lr.bottom>br.top+1 && lr.top<br.bottom-1;
           if(!visible) unreachable.push(i+':unreachable');
         }
         body.style.maxHeight=prevMax; body.scrollTop=prevTop;
         return {ok:overflows && (oy==='auto'||oy==='scroll') && unreachable.length===0,
                 detail:'at 200px: overflows='+overflows+', overflow-y='+oy+
                        ', unreachable=['+(unreachable.join(',')||'none')+']'}; }},
      {name:'a short window must not DESYNC headers from their lanes',
       fn:function(){
         /* the first fix for the above compressed the header column instead of
            scrolling it: panels went 96px -> 66px and every row pointed at the
            wrong track. Locking the alignment in. */
         var body=document.querySelector('.dawbody');
         var prevMax=body?body.style.maxHeight:'';
         if(body){ body.style.maxHeight='200px'; void body.offsetHeight; }
         var bad=[];
         for(var i=0;i<4;i++){
           var h=$('dHdr'+i), ln=$('dLane'+i), m=$('dMtr'+i);
           if(!h||!ln||!m){ bad.push(i+':missing'); continue; }
           var hh=Math.round(h.getBoundingClientRect().height);
           var lh=Math.round(ln.getBoundingClientRect().height);
           var mh=Math.round(m.getBoundingClientRect().height);
           if(hh!==lh||mh!==lh) bad.push(i+':hdr'+hh+'/lane'+lh+'/mtr'+mh);
         }
         if(body){ body.style.maxHeight=prevMax; }
         return {ok:bad.length===0,
                 detail:bad.length? bad.join(' ') : 'header, lane and meter all 96px on all four tracks'}; }},
      {name:'the STAGE WATCHER is adopted — no gradient-wash timeline',
       fn:function(){
         /* ENGINE measures the watcher's FIRING in both directions (late
            rectangle, later resize, quiet when unchanged, clean stop). What is
            mine to prove is that it is actually wired up here and that MY
            callback is sound — a watcher pointed at a redraw that throws would
            be worse than no watcher, because it would fail silently. */
         var installed=typeof daw._stageWatch==='function';
         var engine=typeof vbWatchStage==='function';
         var threw=null;
         try{ dawRefit(); }catch(e){ threw=e.message; }
         var lanes=document.querySelectorAll('.dlane').length;
         var strips=document.querySelectorAll('.mstrip').length;
         return {ok:installed&&engine&&!threw&&lanes===4&&strips===5,
                 detail:'watcher='+installed+', vbWatchStage='+engine+
                        ', refit threw='+(threw||'no')+', after refit: '+lanes+
                        ' lanes / '+strips+' strips (4 + master)'}; }},
      {name:'ZOOM / SPLIT / BOUNCE are OFF the transport strip',
       fn:function(){ var strip=document.querySelector('.dawtp');
         var stray=['dZoomIn','dZoomOut','dSplit','dBounce'].filter(function(id){
           return $(id)&&strip&&strip.contains($(id)); });
         return {ok:stray.length===0,
                 detail:stray.length? 'still on it: '+stray.join(',') : 'all four moved to the edit bar'}; }}
    ]);
  }
});

</script>
