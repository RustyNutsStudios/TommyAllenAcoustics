<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- CHARSET FIRST — hygiene, NOT a bug fix. Read this before you "restore" the
     banner above <html>: it used to sit there, putting this declaration at byte
     594, and it was moved on a theory that CEF ignores a late charset on
     file:// URLs. THAT THEORY WAS RETRACTED (Director, 25 Aug): TOOL RECORDER
     measured three byte-identical builds with the charset at 45, 646 and 1600 —
     all three rendered correctly, including one OUTSIDE the sniff window.
     Position never mattered. The real defect was a PowerShell Get-Content
     round-trip reading BOM-less UTF-8 as ANSI and corrupting the file, then
     measuring its own corruption.
     Keeping charset first anyway because it costs nothing and it is what the
     spec asks for — but it closes no known bug, so do not treat it as load
     bearing and do not re-investigate it. If you add anything to the top of
     this file, putting it below this line keeps the hygiene intact. -->
<!-- Copyright 2026 Tommy Allen Acoustics. All rights reserved.
     TAA MINI DAW — tool 2 of the family. A tiny Reaper for the quick edit you
     would otherwise leave the engine for: cut, move, snip, zoom, balance,
     bounce. No automation, no FX chains, no crossfades, and NO RECORD — capture
     is the Mini Recorder's job.

     DEV: loads ../shared/vb-core.js by script tag. RELEASE: the build script
     inlines everything into one self-contained file.
     Boot flags: ?demo (a synthesised 4-layer kit) · ?selftest (headless gate). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAA Mini DAW</title>
<style>
/* inlined: ../shared/vb-core.css */
/* ══ VB-CORE.CSS — the S3 HARDWARE PANEL skin, shared by all three tools ══
   One organising idea, and every rule obeys it:
     PANELS ARE LIGHT HARDWARE. ANYTHING SHOWING AUDIO IS A DARK SCREEN INSET.
   Swapping the :root block below re-skins every tool at once - that is the
   whole reason the skin was built as tokens. */
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
/* == SKIN: S3 HARDWARE PANEL (picked 25 Aug) ==============================
   One organising idea, and every rule below obeys it:
     PANELS ARE LIGHT HARDWARE.  ANYTHING SHOWING AUDIO IS A DARK SCREEN INSET.
   So the chrome is a pale instrument face with engraved labels and physical
   fader caps, and every waveform, meter and tile sits on a dark screen the way
   it does on a real desk. Swapping this block is how the skin changes -
   nothing below hard-codes a colour. */
:root{
  --bg:#d9d7d0; --panel:#e7e5df; --panel2:#cfcdc5; --line:#b3b0a6;
  --ink:#1c1b18; --dim:#6e6b62; --dimmer:#8a877e;
  --amber:#ff5a1f; --amber-dim:#8a8780; --green:#1c9e6a; --red:#e0341f;
  /* the screen: where audio lives */
  --screen:#232220; --screen-2:#2e2c28; --screen-line:#3a3833;
  /* field = an editable inset */
  --field:#f2f0ea;
  /* layer identity: DARK on the panel, BRIGHT on the screen */
  --A:#0f766e; --B:#a21caf; --C:#4d7c0f; --D:#b45309;
  --Aw:#2dd4bf; --Bw:#f0abfc; --Cw:#a3e635; --Dw:#fbbf24;
  --cap:linear-gradient(180deg,#fdfdfb,#d5d2c9);
  --engrave:0 1px 0 rgba(255,255,255,.85);
}
body{background:var(--bg);color:var(--ink);font-family:'VT323',monospace;font-size:17px}
.ttl,.lab,.btn,.seg b,.num,.badge{text-shadow:var(--engrave)}
.px{font-family:'Press Start 2P',monospace}

/* THE WHOLE WINDOW IS ONE GRID (APP-BLUEPRINT §4). minmax(0,1fr) is load-bearing:
   an implicit auto column sizes to its content and pushes the UI off-screen. */
.app{height:100vh;display:grid;grid-template-columns:minmax(0,1fr);
     grid-template-rows:auto minmax(0,1fr) auto auto auto;gap:4px;padding:4px 6px}
.panel{background:var(--panel);border:1px solid var(--line);min-width:0;min-height:0;
       box-shadow:0 1px 0 rgba(255,255,255,.75) inset}
.row{display:flex;align-items:center;gap:6px;min-width:0}
.ttl{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--amber);letter-spacing:1px;white-space:nowrap}
.lab{font-size:13px;color:var(--amber-dim);letter-spacing:1px;white-space:nowrap}
.hint{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
.sep{width:1px;height:18px;background:var(--line);flex:0 0 auto}

/* controls — NEVER a native <select>/<input type=file> popup in the editor host
   (APP-BLUEPRINT §6.5: a native popup HARD-CRASHES the editor) */
.btn{font-family:'Press Start 2P',monospace;font-size:8px;padding:6px 9px;cursor:pointer;
     border:1px solid var(--line);background:var(--field);color:var(--ink);white-space:nowrap;
     box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(0,0,0,.16)}
.btn:hover{border-color:var(--amber);background:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#ff7a45,#e04a12);color:#fff;border-color:#c9410f;
             text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.warn{border-color:var(--red);color:var(--red);background:#fdeeeb}
.btn.sm{font-size:7px;padding:4px 6px}
.seg{display:inline-flex;border:1px solid var(--line);flex:0 0 auto}
.seg b{font-family:'Press Start 2P',monospace;font-size:7px;padding:5px 7px;cursor:pointer;
       background:var(--field);color:var(--dim);font-weight:normal;user-select:none;
       box-shadow:0 1px 0 rgba(255,255,255,.9) inset}
.seg b.on{background:var(--amber);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.seg.tiny b{font-size:6px;padding:4px 5px}
.num{font-family:'Press Start 2P',monospace;font-size:8px;padding:5px 4px;background:var(--field);
     border:1px solid var(--line);color:var(--ink);outline:none;text-align:center;width:52px;
     box-shadow:0 1px 2px rgba(0,0,0,.12) inset}
.num.wide{width:96px}
input[type=range]{-webkit-appearance:none;height:5px;background:var(--line);
  border:1px solid #9a978d;border-radius:3px;width:100%;cursor:pointer;display:block;margin:3px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:17px;
  background:var(--cap);border:1px solid #8a8780;border-radius:2px;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.32)}
input[type=range]::-moz-range-thumb{width:12px;height:17px;background:#f0eee8;
  border:1px solid #8a8780;border-radius:2px;cursor:pointer}

/* ── toolbar ─────────────────────────────────────────────────────────── */
.tb{padding:4px 7px}
.brand{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--amber);letter-spacing:1px}
.brand small{color:var(--dim);font-size:7px;letter-spacing:0}

/* ── mode panes ──────────────────────────────────────────────────────── */
.pane{display:none;min-height:0;min-width:0;height:100%}
.pane.on{display:block}
#designPane{overflow:auto}
.layers{display:flex;flex-direction:column;gap:4px;padding:4px}

.status{border:1px solid #9a978d;background:var(--screen);padding:3px 9px;display:flex;align-items:center;
        gap:8px;font-size:14px;color:#7dd3c8;box-shadow:0 1px 3px rgba(0,0,0,.30) inset}
.dot{width:7px;height:7px;background:#5a5852;flex:0 0 auto;border-radius:50%}
.dot.on{background:var(--amber);box-shadow:0 0 7px var(--amber)}
.status .right{margin-left:auto;font-size:12px;color:#8a877e}

/* the preset picker — drawn, because a native popup crashes the editor */
.pick{position:fixed;z-index:240;background:var(--panel);border:1px solid var(--amber);
      box-shadow:0 10px 30px rgba(0,0,0,.45);max-height:60vh;overflow:auto;min-width:230px;display:none}
.pick.show{display:block}
.pick .fold{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--dim);
            padding:6px 8px 3px;letter-spacing:1px;background:var(--panel2)}
.pick .item{padding:5px 9px;font-size:15px;cursor:pointer;display:flex;gap:8px;align-items:center}
.pick .item:hover{background:#f7f5ef}
.pick .item b{color:var(--amber);font-weight:normal;margin-left:auto;font-size:12px}
.dirty{color:var(--red)}

/* ONE dialog does prompts AND the three-way guard. NOT window.confirm(): native
   modals are the class of thing that crashed the editor on 5.6/5.7. */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:220;align-items:center;justify-content:center}
.ov.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--amber);padding:14px 16px;width:min(520px,92vw);
     box-shadow:0 10px 34px rgba(0,0,0,.4);
     display:flex;flex-direction:column;gap:11px}
.dlg p{color:var(--ink);font-size:16px;white-space:pre-wrap;line-height:1.35;overflow-wrap:anywhere}
.dlg .btns{display:flex;gap:6px;justify-content:flex-end}
</style>
<style>
/* inlined: daw.css */
/* MINI DAW — screen-specific rules. Tokens live in ../shared/vb-core.css */
/* ── MINI DAW pane (§16) ─────────────────────────────────────────────────
   The tiny Reaper. Headers in a fixed column, ruler and lanes in ONE shared
   horizontal scroller so they can never drift out of sync, meters down the
   right. Nothing here knows about variation - the DAW is the NOMINAL (§16.1). */
#dawPane{display:none;grid-template-rows:auto minmax(0,1fr) auto;gap:4px;padding:4px;height:100%}
#dawPane.on{display:grid}
.dawtp{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:5px 7px}
/* the BIG readout — the loudest thing on the transport strip, as in Reaper */
.dawtime{font-family:'Press Start 2P',monospace;font-size:24px;color:var(--ink);
         letter-spacing:1px;min-width:236px;text-align:center;
         background:var(--screen);color:#ffb38a;padding:7px 10px;border:1px solid #9a978d;
         box-shadow:0 1px 3px rgba(0,0,0,.3) inset}
/* round transport buttons: prev · next · play · loop · stop · pause. NO record. */
.tgrp{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.tbtn{width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:1px solid #6e6b62;
      background:linear-gradient(180deg,#f4f2ec 0%,#d7d4cb 100%);color:#2a2825;
      font-size:13px;line-height:1;padding:0;cursor:pointer;font-family:inherit;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 1px 2px rgba(0,0,0,.28)}
.tbtn:hover{background:linear-gradient(180deg,#fff 0%,#e8e5dc 100%)}
.tbtn:active{box-shadow:0 1px 3px rgba(0,0,0,.45) inset}
.tbtn.on{background:linear-gradient(180deg,#ff8a4f 0%,#e0451a 100%);color:#fff;border-color:#c9410f}
.tbtn.play.on{background:linear-gradient(180deg,#35c98a 0%,#12855a 100%);border-color:#0e6b49}
.tstate{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--dim);
        min-width:78px;flex:0 0 auto}
.tstate.live{color:var(--green)}
.dawsel{font-size:13px;color:var(--dim);white-space:nowrap}
/* HONEST DEGRADATION BELOW THE RULED 1200x660 (Director's window ruling,
   24 Aug: "minimum 1200x660, honest degradation below it — no control-cutting").
   The lane area SCROLLS when it cannot fit instead of silently clipping track D,
   which was worse than a scrollbar: nothing on screen told you the fourth track
   existed. The plugin case makes it real — a tab docked along the bottom of the
   editor is short and wide, exactly the shape that hides a lane.
   The whole body scrolls as ONE unit on purpose: headers, timeline and meters are
   four grid columns that must stay row-aligned, and four independently scrolled
   columns desync. The transport strip and the mixer sit OUTSIDE this box, so they
   stay pinned; the cost is that the ruler scrolls with its lanes. That is the
   Director's stated fallback, taken deliberately over a JS scroll-sync. */
.dawbody{display:grid;grid-template-columns:200px minmax(0,1fr) 32px 46px;gap:0;
         min-height:0;min-width:0;border:1px solid var(--line);background:var(--panel);
         overflow-y:auto;overflow-x:hidden}
.dcol{display:flex;flex-direction:column;min-width:0;min-height:0}
.dscroll{overflow-x:auto;overflow-y:hidden;min-width:0;background:var(--screen);
         box-shadow:0 1px 3px rgba(0,0,0,.32) inset;position:relative}
.dinner{position:relative;height:100%}
.dspacer{height:22px;flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--panel2)}
.druler{height:22px;position:relative;background:var(--screen-2);
        border-bottom:1px solid #3a3833;cursor:text;flex:0 0 auto}
.druler i{position:absolute;top:0;bottom:0;border-left:1px solid #4a4843;
          font-family:'Press Start 2P',monospace;font-size:6px;color:#8a877e;
          padding:3px 0 0 3px;font-style:normal;white-space:nowrap}
.dlane{height:96px;position:relative;border-bottom:1px solid #3a3833;overflow:hidden}
.dlane.sel{background:rgba(255,90,31,.05)}
/* flex:0 0 auto is load-bearing: without it the header column SHRINKS its panels
   to fit a short body instead of letting the body scroll, and the 96px lanes
   desync from their own track headers. Measured at 1200x560 — panels went to
   66px and every row pointed at the wrong track. */
.dhdr{height:96px;flex:0 0 auto;border-bottom:1px solid var(--line);padding:3px 6px;
      display:flex;flex-direction:column;gap:1px;min-width:0;background:var(--panel);
      overflow:hidden}
.dhdr.sel{background:#f7f5ef;box-shadow:inset 3px 0 0 var(--amber)}
.dhrow{display:flex;align-items:center;gap:4px;min-width:0}
.dms{font-family:'Press Start 2P',monospace;font-size:7px;padding:3px 5px;border:1px solid var(--line);
     background:var(--field);color:var(--dim);cursor:pointer;flex:0 0 auto}
.dms.on{background:var(--amber);color:#fff;border-color:#c9410f}
.dms.so{background:var(--green);color:#fff;border-color:#157952}
.dknob{display:grid;grid-template-columns:30px minmax(0,1fr) 40px;gap:4px;align-items:center}
/* the panel's round VOLUME knob + the TRIM button beside it */
/* 22px, not 28: the panel is a fixed 96px and at 28 the clip-count line fell off
   the bottom of track D. Caught by looking at it, not by a test. */
.dknob.knobrow{grid-template-columns:30px 24px 40px minmax(0,1fr)}
.knb{width:22px;height:22px;border-radius:50%;position:relative;cursor:ns-resize;
     touch-action:none;justify-self:start;
     background:radial-gradient(circle at 50% 34%,#6c6960 0%,#3d3b36 62%,#232120 100%);
     border:1px solid #1b1917;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.knb:focus{outline:2px solid var(--amber);outline-offset:2px}
.knb:focus:not(:focus-visible){outline:none}
.knb i{position:absolute;left:50%;top:2px;width:2px;height:8px;margin-left:-1px;
       background:#ffb38a;border-radius:1px;transform-origin:50% 9px;display:block}
.dms.trim{font-size:6px;justify-self:end}
/* TRIM armed: this track's clip handles stop hiding */
.dlane.trimon .clip{border-color:var(--amber)}
.dlane.trimon .clip .ctab{background:rgba(255,90,31,.92);width:7px}
.dknob span{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--dim)}
.dknob b{font-size:13px;color:var(--ink);text-align:right;font-weight:normal}
.dknob input[type=range]{margin:0}
/* a clip */
.clip{position:absolute;top:6px;bottom:6px;background:var(--screen-2);
      border:1px solid #6e6b62;overflow:hidden;cursor:grab}
.clip.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.clip canvas{display:block;width:100%;height:100%}
.clip .ctag{position:absolute;top:0;left:0;font-size:11px;line-height:1.1;padding:0 3px;
            background:rgba(20,18,16,.75);color:#e7e5df;white-space:nowrap;pointer-events:none}
.clip .ctab{position:absolute;top:0;bottom:0;width:6px;background:rgba(255,90,31,.55);
            cursor:ew-resize}
.clip .ctab.l{left:0} .clip .ctab.r{right:0}
.clip .ctab:hover{background:rgba(255,90,31,.9)}
.dph{position:absolute;top:0;bottom:0;width:2px;background:#ff5a1f;pointer-events:none;z-index:4}
.dselrange{position:absolute;top:0;bottom:0;background:rgba(255,90,31,.13);
           border-left:1px solid rgba(255,90,31,.6);border-right:1px solid rgba(255,90,31,.6);
           pointer-events:none;z-index:3}
/* meters */
.dmtr{height:96px;flex:0 0 auto;border-bottom:1px solid var(--line);padding:5px 4px;
      display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel)}
.dbar{flex:1;width:10px;background:var(--screen);border:1px solid #9a978d;position:relative;overflow:hidden}
.dbar b{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#1c9e6a 0%,#1c9e6a 62%,#e8a33d 82%,#e0341f 100%)}
.dbar i{position:absolute;left:0;right:0;height:2px;background:#fff}
.dled{width:12px;height:5px;background:#a6a399;border:1px solid #8a8780;flex:0 0 auto}
.dled.hot{background:var(--red);border-color:#a02718}
.dmlab{font-family:'Press Start 2P',monospace;font-size:5px;color:var(--dim)}
.dmaster{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;
         background:var(--panel2);border-left:1px solid var(--line)}

/* ── SEGMENTED METERS (REAPER-SPEC item 14) ──────────────────────────────
   Reaper's meters read as a stack of discrete segments, not a smooth bar.
   This is a pure overlay: it rules dark lines ACROSS every .dbar, so the
   height maths in dawPaintMeters is untouched and the ballistics of §16.3
   still measure exactly what they measured before. Furniture, not plumbing. */
.dbar::after{content:'';position:absolute;left:0;right:0;top:0;bottom:0;
             pointer-events:none;z-index:2;
             background:repeating-linear-gradient(180deg,
               rgba(22,20,18,.92) 0 1px, rgba(0,0,0,0) 1px 5px)}

/* ── THE MIXER (Reaper's MCP) ALONG THE BOTTOM ───────────────────────────
   Tommy named this furniture and the window did not have it:
   "wave forms theres meters, theres fucking thing i can slide about."
   A row of vertical channel strips with MASTER on the LEFT. The fader is a
   real grabbable cap driven by pointer events - NOT a restyled <input
   type=range> - because "can I grab it" is the acceptance test. */
/* 112px, and the number is arithmetic, not taste. The body must hold the ruler
   plus four full-height lanes = 22 + 4x96 = 406px, and at the ruled 1200x660
   only ~388px was reaching it — so the mixer sheds 20px.
   This was hidden until now: the header column was being FLEX-SHRUNK to fit,
   which meant that at the RULED size headers ran ~91.5px against 96px lanes,
   a desync growing to ~18px by track D that nobody had spotted. Stopping the
   shrink made the shortfall visible as a scrollbar at 660, which is honest but
   wrong at the minimum size — the ruled window should need no scrolling. */
.mcp{display:flex;height:112px;flex:0 0 auto;min-height:0;
     border:1px solid var(--line);background:var(--panel2);overflow:hidden}
.mstrips{display:flex;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden}
.mstrip{width:88px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
        gap:2px;padding:4px 4px;min-width:0;background:var(--panel);
        border-right:1px solid var(--line);cursor:pointer}
.mstrip.sel{background:#f7f5ef;box-shadow:inset 0 3px 0 var(--amber)}
.mstrip.master{width:106px;flex:0 0 auto;background:var(--panel2);
               border-right:2px solid var(--line);cursor:default;gap:1px}
.mstrip.master .mname{font-size:7px;color:var(--ink);letter-spacing:1px}
.mbtns{display:flex;gap:3px;flex:0 0 auto}
.mfrow{display:flex;align-items:stretch;gap:6px;flex:1;min-height:0}
.mname{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--dim);
       max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto}
.mdb{font-size:11px;color:var(--ink);flex:0 0 auto}
.mrms{font-family:'Press Start 2P',monospace;font-size:5px;color:var(--dim);flex:0 0 auto}
.mrms b{color:#ffb38a;font-weight:normal}
.mtag{font-family:'Press Start 2P',monospace;font-size:5px;color:#fff;background:#6e6b62;
      padding:2px 4px;letter-spacing:.5px;flex:0 0 auto}
.mfrow .dbar{flex:0 0 9px;width:9px;height:auto;align-self:stretch}
.mstrip.master .mfrow .dbar{flex:0 0 8px;width:8px}

/* the fader — a slot with a cap you grab */
.fdr{position:relative;width:24px;flex:0 0 auto;cursor:grab;touch-action:none}
.fdr:active{cursor:grabbing}
.fdr:focus{outline:2px solid var(--amber);outline-offset:1px}
.fdr:focus:not(:focus-visible){outline:none}
.fdrslot{position:absolute;left:50%;top:4px;bottom:4px;width:5px;margin-left:-2.5px;
         background:var(--screen);border:1px solid #8a8780;
         box-shadow:0 1px 2px rgba(0,0,0,.38) inset}
.fdrcap{position:absolute;left:0;right:0;height:15px;margin-bottom:-7.5px;
        background:linear-gradient(180deg,#77746c 0%,#45433d 47%,#2b2926 53%,#514f48 100%);
        border:1px solid #1a1816;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.fdrcap::after{content:'';position:absolute;left:2px;right:2px;top:6px;height:2px;
               background:#ffb38a;box-shadow:0 0 2px rgba(255,179,138,.7)}
.fdr.tall{width:26px}
.fdr.tall .fdrcap{height:17px;margin-bottom:-8.5px}

</style>
<style>.app{grid-template-rows:auto minmax(0,1fr) auto}</style>
</head>
<body>
<div class="app">

  <div class="panel tb">
    <div class="row">
      <span class="brand">MINI DAW<small> &nbsp;TAA</small></span>
      <span class="sep"></span>
      <button class="btn sm" id="undoBtn" title="Undo (Ctrl+Z)" disabled>&#8630;</button>
      <button class="btn sm" id="redoBtn" title="Redo (Ctrl+Y)" disabled>&#8631;</button>
      <button class="btn sm" id="presetBtn" title="Presets">&#9733; <span id="presetName">FACTORY / footstep gravel</span></button>
      <button class="btn sm" id="saveBtn">SAVE</button>
      <button class="btn sm" id="demoBtn" title="Four synthesised layers, so the tool works with nothing to hand">DEMO KIT</button>
      <span class="sep"></span>
      <!-- EDIT commands live here, NOT on the transport strip: the transport bar
           is its own strip in Reaper and carries transport only. -->
      <span class="lab">ZOOM</span>
      <button class="btn sm" id="dZoomOut" title="Zoom out (&minus;)">&minus;</button>
      <button class="btn sm" id="dZoomIn" title="Zoom in (+)">+</button>

      <!-- THE MIXER (Reaper's MCP), MASTER on the LEFT. The faders are grabbable

               title="MONITOR ONLY — this fader changes what you hear, not what BOUNCE writes. The per-track faders change both.">MONITOR</span></div>
          <div class="mfrow">
            <div class="fdr tall" id="dMixMasterFdr" data-fader="master" tabindex="0" role="slider"
                 aria-label="Master monitor level in decibels" aria-valuemin="-60" aria-valuemax="6" aria-valuenow="0"
                 title="MASTER monitor level — grab and drag, or focus and use the arrow keys">

  <p id="dlgMsg"></p>

<script>
/* inlined: ../shared/vb-core.js */
/* ══════════════════════════════════════════════════════════════════════════
   VB-CORE — the shared engine for all three TAA tools.
   Mini Recorder · Mini DAW · Variation Designer all load this file; none of
   them owns it. If a change here breaks one tool it breaks all three, which is
   exactly the property that makes it worth having in one place.

   WHAT IS IN HERE: the design constants, the seeded draw law, the layer state,
   the render chain, the mix, the ONE AudioContext, WAV + zip writing, file
   decode, presets and undo, the dialog, and the shared half of window.VB.
   WHAT IS NOT: anything that knows what a screen looks like. Tools paint
   themselves and register a repaint with VBUI.onChange().
   ══════════════════════════════════════════════════════════════════════════ */
'use strict';
var VERSION='v0.2', DESIGN_REF='DESIGN.md signed 24 Aug 2026';
var SR=48000;

/* ══ SPEC — every design constant in one place, section noted ══════════════
   TESTER's vb-spec.js compares against VB.spec(); if a number moves it moves
   here and nowhere else. */
var SPEC={
  variation:35, count:12, trim:-1, normalise:'set', tailFade:10, maxLength:0,
  rate:48000, bits:24, channels:1,
  offset:15, pitch:40, gain:2, tone:1.0, spread:0, reverse:0, start:0,      /* §4.2 */
  level:0, delay:0, pan:0, lp:20000, hp:20,                                  /* §4.1 */
  offsetMode:'+/-', pick:'RANDOM',                                           /* §4.2 §5 */
  HEAD_MS:30,                                                                /* §4.1 */
  TRIM_FADE_IN_MS:2, TRIM_FADE_OUT_MS:5, TRIM_FADE_MAX_PCT:10, MIN_TRIM_MS:5, /* §14.2 */
  ORDER:'trim -> trimfades -> start -> reverse -> pitch -> tone -> lp/hp -> gain -> place(head+delay+offset)' /* §14.1 */
};
var HEAD_N=Math.round(SR*SPEC.HEAD_MS/1000);

/* ══ SEEDED IDENTITY (§6) ══════════════════════════════════════════════════
   Every draw is DERIVED from (seed, take, roll, slot, param) — never streamed.
   That is what makes the knob SCALE draws in place instead of reshuffling them,
   and it is why a kept take survives a knob move. Nothing in the render path
   reads Math.random(); only DICE and the audition SHUFFLE do. */
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hashTag(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function drawU(seed,take,roll,slot,param){
  return mulberry32((seed>>>0)^hashTag(take+'|'+roll+'|'+slot+'|'+param))();
}
function uni(u){return u*2-1;}
function newSeed(){return (Math.random()*0xFFFFFFFF)>>>0;}

/* ══ STATE ════════════════════════════════════════════════════════════════ */
var SLOT_IDS=['A','B','C','D'];
/* PANEL colours (badges, chips) are dark so they read on the pale face; SCREEN
   colours (waveforms, ticks) are bright so they read on the dark inset. Same
   identity, two surfaces - S3's whole idea in one pair of arrays. */
var SLOT_COL=['#0f766e','#a21caf','#4d7c0f','#b45309'];
var SLOT_WAVE=['#2dd4bf','#f0abfc','#a3e635','#fbbf24'];
function mkLayer(i){
  return {id:SLOT_IDS[i], col:SLOT_COL[i], wave:SLOT_WAVE[i], name:'', files:[], pick:SPEC.pick, fixedIdx:0,
    on:true, solo:false, mute:false,
    level:SPEC.level, delay:SPEC.delay, pan:SPEC.pan, lp:SPEC.lp, hp:SPEC.hp,
    pitchNom:0,                                 /* §4.1 - static, NOT knob-scaled */
    trimIn:0, trimOut:-1,                       /* ms; -1 = to the end (§14) */
    r:{offset:SPEC.offset, pitch:SPEC.pitch, gain:SPEC.gain, tone:SPEC.tone,
       spread:SPEC.spread, reverse:SPEC.reverse, start:SPEC.start}};
}
var L=[mkLayer(0),mkLayer(1),mkLayer(2),mkLayer(3)];
var M={ seed:newSeed(), knob:SPEC.variation, count:SPEC.count, trim:SPEC.trim,
        normalise:SPEC.normalise, tailFade:SPEC.tailFade, maxLength:SPEC.maxLength,
        rate:SPEC.rate, bits:SPEC.bits, channels:SPEC.channels, name:'variation' };
var rolls=[], marks=[], latchGain=null, sel=0, mode='design', mixView='summed';
/* RULING 25 Aug: a dial change NEVER silently re-latches. It marks the level
   STALE and the sheet says so; only BOUNCE and an explicit RE-NORMALISE move
   the latch. Before this, nudging any dial did RE-NORMALISE's job without
   RE-NORMALISE's ceremony, which is how a designer's approved takes changed
   under them. */
var latchStale=false;

function markStale(){ if(latchGain!==null && M.normalise==='set') latchStale=true; }
function resetSheet(n){
  M.count=n||M.count; rolls=[]; marks=[];
  for(var i=0;i<M.count;i++){rolls.push(0);marks.push('open');}
  latchGain=null; latchStale=false; sel=0;
}
resetSheet(M.count);
function anyLoaded(){for(var i=0;i<4;i++) if(L[i].files.length) return true; return false;}
/* MUTE / SOLO PRECEDENCE (§16.4). SOLO BEATS MUTE: when anything is soloed,
   solo membership alone decides, so a soloed-AND-muted track SOUNDS. Otherwise
   the user hunts for a mute they cannot see. Mute only speaks when nothing is
   soloed. Both windows call this shape, so they agree by construction. */
function audibleSlot(l){
  if(!l.files.length || !l.on) return false;
  var soloed=L.some(function(x){return x.solo;});
  return soloed ? !!l.solo : !l.mute;
}
function liveSlots(){
  return L.map(function(l,i){return {l:l,i:i};}).filter(function(o){ return audibleSlot(o.l); });
}

/* ══ THE RECIPE (§4.2, §5, §6) ════════════════════════════════════════════ */
function pickFile(si,ti){
  var l=L[si], n=l.files.length; if(!n) return 0;
  if(l.pick==='FIXED') return Math.min(l.fixedIdx,n-1);
  if(l.pick==='ORDER') return ti%n;
  /* RANDOM: a shuffle-bag - every file used once before any repeats (Wwise's
     "Shuffle"). §5.
     EACH BAG GETS ITS OWN SHUFFLE. This used to shuffle once per (seed, slot)
     and then walk that ONE permutation forever, so a 5-file slot bouncing 30
     takes played the same five-file order six times - the exact repetition this
     product exists to kill, arriving from the tool meant to prevent it. The bag
     index is part of the key now. Determinism is untouched: §6 promises the same
     seed gives the same set, not that the set is one repeating loop.
     A re-rolled take adds its roll to the key, so it draws from a different
     permutation than its bag-mates - which can repeat a file inside one bag, and
     that is correct: a re-roll is a request for something else. */
  var bagIdx=Math.floor(ti/n), roll=rolls[ti]||0;
  var rng=mulberry32(((M.seed>>>0)^hashTag('bag|'+l.id+'|'+bagIdx+'|'+roll))>>>0);
  var bag=[], k, tmp;
  for(k=0;k<n;k++) bag.push(k);
  for(k=n-1;k>0;k--){ var j=Math.floor(rng()*(k+1)); tmp=bag[k]; bag[k]=bag[j]; bag[j]=tmp; }
  return bag[ti%n];
}
function effOf(si,dial){ return L[si].r[dial]*M.knob/100; }   /* §4: range x k/100 */

function recipeOne(si,ti){
  var l=L[si], r=rolls[ti]||0, k=M.knob/100, fi=pickFile(si,ti);
  var f=l.files[fi];
  var off=uni(drawU(M.seed,ti,r,l.id,'offset'))*l.r.offset*k;
  if(l.r.offset>0){
    if(SPEC.offsetMode==='+') off=Math.abs(off);
    else if(SPEC.offsetMode==='-') off=-Math.abs(off);
  }
  return {
    slot:l.id, slotIdx:si, name:l.name, col:l.col,
    file:f?f.name:'', fileIdx:fi,
    delayMs:l.delay, offsetMs:off,
    /* RULING 25 Aug: the range varies AROUND the nominal, exactly as OFFSET
       varies around DELAY. Splitting these is what lets the DAW own the nominal
       without touching the variation. */
    cents: (l.pitchNom||0) + uni(drawU(M.seed,ti,r,l.id,'pitch'))*l.r.pitch*k,
    dB:    uni(drawU(M.seed,ti,r,l.id,'gain')) *l.r.gain *k,
    toneOct:   drawU(M.seed,ti,r,l.id,'tone')  *l.r.tone *k,
    pan:   l.pan + uni(drawU(M.seed,ti,r,l.id,'pan'))*l.r.spread*k,
    startMs:   drawU(M.seed,ti,r,l.id,'start') *l.r.start*k,
    reversed:  drawU(M.seed,ti,r,l.id,'rev') < (l.r.reverse*k)/100,
    levelDb:l.level
  };
}
function recipe(ti){
  var out=[]; liveSlots().forEach(function(o){ out.push(recipeOne(o.i,ti)); }); return out;
}

/* ══ PER-LAYER RENDER — the §14.1 order, and nothing out of order ═════════ */
function trimRegion(l,src){
  var n=src.length;
  var a=Math.max(0,Math.round(l.trimIn/1000*SR));
  var b=(l.trimOut<0)?n:Math.min(n,Math.round(l.trimOut/1000*SR));
  var minN=Math.round(SPEC.MIN_TRIM_MS/1000*SR);
  if(b-a<minN) b=Math.min(n,a+minN);
  if(b<=a){a=0;b=n;}
  return {a:a,b:b,trimmedIn:a>0,trimmedOut:b<n};
}
function layerSamples(ti,si){
  var l=L[si], rc=recipeOne(si,ti), f=l.files[rc.fileIdx];
  if(!f) return new Float32Array(0);
  var src=f.samples, i;

  /* 1. TRIM (static, §14) */
  var tr=trimRegion(l,src);
  var cut=src.subarray(tr.a,tr.b);
  var n=cut.length;
  var base=new Float32Array(n);
  base.set(cut);

  /* 2. auto-fades, ONLY on an edge the user actually moved (§14.2) */
  var maxF=Math.floor(n*SPEC.TRIM_FADE_MAX_PCT/100);
  if(tr.trimmedIn){
    var fi=Math.min(Math.round(SPEC.TRIM_FADE_IN_MS/1000*SR),maxF);
    for(i=0;i<fi;i++) base[i]*=0.5-0.5*Math.cos(Math.PI*i/fi);
  }
  if(tr.trimmedOut){
    var fo=Math.min(Math.round(SPEC.TRIM_FADE_OUT_MS/1000*SR),maxF);
    for(i=0;i<fo;i++) base[n-1-i]*=0.5-0.5*Math.cos(Math.PI*i/fo);
  }

  /* 3. START nudge — INSIDE the trimmed region, clamped so it can never eat it
        down past MIN_TRIM_MS (§14.3). Without the clamp a tight trim + START
        renders silence, which reads as a broken take. */
  if(rc.startMs>0){
    var minN=Math.round(SPEC.MIN_TRIM_MS/1000*SR);
    var sk=Math.min(Math.round(rc.startMs/1000*SR), Math.max(0,n-minN));
    if(sk>0){ base=base.subarray(sk); n=base.length; }
  }

  /* 4. REVERSE (structure — a threshold, monotonic in the knob, §4.2) */
  if(rc.reversed){ var rv=new Float32Array(n); for(i=0;i<n;i++) rv[i]=base[n-1-i]; base=rv; }

  /* 5. PITCH as VARISPEED — keeps the transient intact and lets length follow,
        which is what foley does. Not time-stretch. (§4.2) */
  var rate=Math.pow(2,rc.cents/1200), out;
  if(Math.abs(rc.cents)<0.001){ out=new Float32Array(n); out.set(base); }
  else{
    var m=Math.max(2,Math.floor(n/rate)); out=new Float32Array(m);
    for(i=0;i<m;i++){ var x=i*rate, i0=Math.floor(x), fr=x-i0;
      var s0=base[i0]||0, s1=base[i0+1]||0; out[i]=s0+(s1-s0)*fr; }
    n=m;
  }

  /* 6. TONE (darkening only) then the static LP / HP filters */
  var fc=(rc.toneOct>0.001)? Math.min(l.lp,20000)/Math.pow(2,rc.toneOct) : l.lp;
  if(fc<20000){ var c=Math.exp(-2*Math.PI*fc/SR), z=0;
    for(i=0;i<n;i++){ z=out[i]*(1-c)+z*c; out[i]=z; } }
  if(l.hp>20){ var ch=Math.exp(-2*Math.PI*l.hp/SR), zh=0;
    for(i=0;i<n;i++){ zh=out[i]*(1-ch)+zh*ch; out[i]=out[i]-zh; } }

  /* 7. GAIN */
  var g=Math.pow(10,(rc.levelDb+rc.dB)/20);
  for(i=0;i<n;i++) out[i]*=g;
  return out;
}
function layerOffsetSamples(ti,si){
  var rc=recipeOne(si,ti);
  /* + HEAD_N so a NEGATIVE offset on a DELAY=0 layer is representable instead of
     clamping to zero — without this, half the timing variation on the anchor
     layer silently vanishes (§4.1 HEAD PAD). */
  return Math.max(0, HEAD_N + Math.round((rc.delayMs+rc.offsetMs)/1000*SR));
}

/* ══ THE MIX ══════════════════════════════════════════════════════════════ */
function takeLen(ti){
  var mx=HEAD_N+Math.round(SR*0.05);
  liveSlots().forEach(function(o){
    var n=layerSamples(ti,o.i).length+layerOffsetSamples(ti,o.i);
    if(n>mx) mx=n;
  });
  var tail=Math.round(M.tailFade/1000*SR);
  return mx+tail+8;
}
/* raw = the summed layers, pre-gain. Channels: 1 or 2 (constant-power pan). */
function rawTake(ti){
  var N=takeLen(ti), ch=M.channels, bufs=[];
  for(var c=0;c<ch;c++) bufs.push(new Float32Array(N));
  liveSlots().forEach(function(o){
    var s=layerSamples(ti,o.i), off=layerOffsetSamples(ti,o.i), i;
    if(ch===1){ var m=bufs[0];
      for(i=0;i<s.length;i++){ var j=off+i; if(j<N) m[j]+=s[i]; }
    }else{
      var rc=recipeOne(o.i,ti);
      var p=Math.max(-100,Math.min(100,rc.pan))/100;      /* -1..1 */
      var th=(p+1)*Math.PI/4, gl=Math.cos(th), gr=Math.sin(th);
      var Lb=bufs[0], Rb=bufs[1];
      for(i=0;i<s.length;i++){ var k=off+i; if(k<N){ Lb[k]+=s[i]*gl; Rb[k]+=s[i]*gr; } }
    }
  });
  return bufs;
}
function peakOf(bufs){
  var m=0; for(var c=0;c<bufs.length;c++){ var b=bufs[c];
    for(var i=0;i<b.length;i++){ var a=b[i]<0?-b[i]:b[i]; if(a>m)m=a; } }
  return m;
}
/* BOUNCE LATCHES THE SET GAIN (§7.1). Re-rolls reuse it, so a kept take is
   byte-identical across a re-roll. Only RE-NORMALISE re-latches. */
function latch(){
  latchStale=false;
  if(M.normalise!=='set'){ latchGain=1; return 1; }
  var target=Math.pow(10,M.trim/20), pk=0;
  for(var i=0;i<M.count;i++) pk=Math.max(pk,peakOf(rawTake(i)));
  latchGain = pk>1e-9 ? target/pk : 1;
  return latchGain;
}
function gainFor(ti,pk){
  var target=Math.pow(10,M.trim/20);
  if(M.normalise==='each') return pk>1e-9?target/pk:1;
  /* §7: the soft-clip guard sits at -0.1 dBFS. It was at 0.995 (-0.04 dBFS),
     which is not the number the design states. */
  if(M.normalise==='off'){ var G=Math.pow(10,-0.1/20); return (pk>G)? G/pk : 1; }
  if(latchGain===null) latch();
  var g=latchGain;
  if(pk*g>1.0) return {g:Math.pow(10,-1/20)/pk, trimmed:true};  /* §7.1 guard */
  return g;
}
function headTrimStart(bufs){
  /* §4.3 HEAD: a bounced one-shot starts when the sound starts — 1 ms before the
     first sample above -60 dBFS. */
  var thr=Math.pow(10,-60/20), N=bufs[0].length;
  for(var i=0;i<N;i++){
    for(var c=0;c<bufs.length;c++){ var a=bufs[c][i]; if(a<0)a=-a; if(a>thr){
      return Math.max(0,i-Math.round(SR*0.001)); } }
  }
  return 0;
}
/* renderTake(i) is PURE and SYNCHRONOUS — same inputs, same floats, no device.
   That is a contract, not a preference (CONTRACT.md). It returns the take EXACTLY
   as it will be exported, so what you audition is the file. */
function renderTakeCh(ti){
  var bufs=rawTake(ti), pk=peakOf(bufs), trimmed=false;
  var gr=gainFor(ti,pk), g;
  if(typeof gr==='object'){ g=gr.g; trimmed=true; } else g=gr;
  var c,i;
  for(c=0;c<bufs.length;c++){ var b=bufs[c]; for(i=0;i<b.length;i++) b[i]*=g; }

  var s0=headTrimStart(bufs), N=bufs[0].length-s0;
  if(M.maxLength>0) N=Math.min(N,Math.round(M.maxLength/1000*SR));
  var out=[];
  for(c=0;c<bufs.length;c++) out.push(bufs[c].slice(s0,s0+N));

  var fo=Math.min(Math.round(M.tailFade/1000*SR),N-1);
  for(c=0;c<out.length;c++){
    var o=out[c];
    if(fo>0) for(i=0;i<fo;i++) o[N-1-i]*=0.5-0.5*Math.cos(Math.PI*i/fo);
    if(N>0) o[N-1]=0;                       /* the end is always a hard zero */
  }
  out._trimmed=trimmed;
  return out;
}
function renderTake(ti){ return renderTakeCh(ti)[0]; }
function takeInfo(ti){
  var bufs=rawTake(ti), pk=peakOf(bufs), gr=gainFor(ti,pk);
  var trimmed=(typeof gr==='object'), g=trimmed?gr.g:gr;
  return {trimmed:trimmed, peak:pk*g, peakDb:20*Math.log10(Math.max(1e-9,pk*g)),
          mark:marks[ti]||'open', roll:rolls[ti]||0};
}
function rerollCulled(){
  var n=0;
  for(var i=0;i<M.count;i++) if(marks[i]==='cull'){ rolls[i]++; marks[i]='open'; n++; }
  return n;                    /* latchGain deliberately untouched — §7.1 */
}

/* ══ AUDIO — exactly ONE AudioContext construction site, in audioReady() ═══
   Chromium creates an AudioContext SUSPENDED unless it was constructed during a
   user gesture, and inside the editor's CEF host that is the normal case. A
   suspended context does not advance currentTime: start() schedules and nothing
   is heard, then everything fires at once when it resumes. Never touch audioCtx
   directly — go through audioReady(). (Ported verbatim from the Forge chassis.) */
var audioCtx=null;
function audioReady(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:SR});
  if(audioCtx.state&&audioCtx.state!=='running'&&audioCtx.resume){
    try{ audioCtx.resume(); }catch(e){}
  }

function encWAV(chans,bits,rate){

  function ws(s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));o+=s.length;}
  ws('RIFF'); v.setUint32(o,36+ds,true);o+=4; ws('WAVE'); ws('fmt ');
  v.setUint32(o,16,true);o+=4; v.setUint16(o,1,true);o+=2; v.setUint16(o,nCh,true);o+=2;
  v.setUint32(o,rate,true);o+=4; v.setUint32(o,rate*nCh*bps,true);o+=4;
  v.setUint16(o,nCh*bps,true);o+=2; v.setUint16(o,bits,true);o+=2;
  ws('data'); v.setUint32(o,ds,true);o+=4;
  for(var i=0;i<N;i++) for(var c=0;c<nCh;c++){
    var x=Math.max(-1,Math.min(1,chans[c][i]));
    if(bits===16){ v.setInt16(o,Math.round(x*32767),true); o+=2; }
    else{ var q=Math.round(x*8388607);
      v.setUint8(o,q&0xFF); v.setUint8(o+1,(q>>8)&0xFF); v.setUint8(o+2,(q>>16)&0xFF); o+=3; }

}

    var lh=new Uint8Array(30+nameU8.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,0,true); lv.setUint16(10,dosTime,true); lv.setUint16(12,dosDate,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,nameU8.length,true); lv.setUint16(28,0,true); lh.set(nameU8,30);

    cv.setUint16(14,dosDate,true); cv.setUint32(16,crc,true);

/* ══ DELIVERY — where can a file actually GO from this host? ════════════
   The editor's CEF implements no download handler, so `<a download>` is dropped
   with NO error while the page carries on as though it saved. Measured on 5.6,
   5.7 and 5.8 by the CEF spike. So the engine asks where a file can go BEFORE
   it claims to have put one there.

   THE WORDS LAW (TOOL RECORDER's, adopted engine-wide): the word SAVED appears
   only when a file actually exists. Failures say WRITTEN — "so nothing was
   saved" still reads as a save to anyone scanning a status line. ────────── */
function vbBridge(){
  var b = window.ue && window.ue.taa;
  return (b && typeof b.savefile === 'function') ? b : null;
}
/* HOST IS NOT INFERRED FROM THE BINDING. Deriving it from window.ue.taa means
   any read taken before the bridge attaches answers "browser" — and then the
   engine would pick the <a download> path, which the editor drops with NO error.
   The safe-looking default is the silent one.

   The user agent does not race. MEASURED in an editor tab on 5.7:
     Mozilla/5.0 (…) GuiVerifyTAASuite57/++UE5+Release-5.7-CL-51494982
     UnrealEngine/5.7.4-51494982+++UE5+Release-5.7 Chrome/128.0.6613.138 …

   PLUGIN user to "allow the microphone in a browser". */

  var ua = (typeof navigator!=='undefined' && navigator.userAgent) || '';

  if(vbIsUnrealHost()) return 'none';        /* CEF, and no file bridge present */
  return 'download';
}
/* ⚠ THE BINDING IS NOT THERE AT LOAD. MEASURED, in the plugin skeleton:
   window.ue.taa already exists when the page script runs on UE 5.6 (CEF 90),
   and does NOT yet exist on 5.7 / 5.8 (CEF 128). Injection and first paint are
   not ordered, and 5.6 was simply winning a race.

   Anything that asks "can I write a file?" ONCE AT BOOT will therefore answer
   'none' on two engines out of three and be wrong about it — a SAVE button that
   paints itself dead and then works, which is a lie in the safer direction but
   still a lie. saveBlob() itself is fine because it re-checks at call time; it
   is the BOOT-TIME PAINT that needs this.

   or never if it does not (a plain browser — where 'download' is the right

var VB_NO_PATH_MSG =

function saveBlob(blob,name,done){
  var path=vbDeliveryPath();
  function finish(r){
    if(r.msg) saySoon(r.msg);
    if(typeof done==='function'){ try{ done(r); }catch(e){} }
    return r;
  }

  /* 1. NO PATH. The whole reason this function grew: refuse loudly. */
  if(path==='none') return finish({ok:false, path:'none', name:name, msg:VB_NO_PATH_MSG});

  /* 2. BRIDGE. Only the native side can say whether a file exists, so only it
        is allowed to produce the word SAVED. */
  if(path==='bridge'){
    blobToB64(blob, function(b64, err){
      if(err||!b64) return finish({ok:false, path:'bridge', name:name,
        msg:'could not encode '+name+' — NO FILE WAS WRITTEN.'});
      var p;

      catch(e){ return finish({ok:false, path:'bridge', name:name,
        msg:'the file bridge threw on '+name+' — NO FILE WAS WRITTEN.'}); }

        var r={}; try{ r=(typeof json==='string')? JSON.parse(json) : (json||{}); }catch(e){}
        if(r && r.ok) finish({ok:true, path:'bridge', name:name, file:r.path,
          msg:'SAVED '+name+(r.path? (' — '+r.path) : ' into the project')});
        else finish({ok:false, path:'bridge', name:name,
          msg:'the file bridge refused '+name+(r&&r.error? (' — '+r.error):'')+
              '. NO FILE WAS WRITTEN.'});

/* ══ STAGE WATCH — redraw when your box changes ══════════════════════
   Measured by TOOL RECORDER in a real 5.6 editor tab: CEF reports readyState
   'complete' while the Slate widget still has NO rectangle (stage 18×2), so a
   canvas sized once at draw time gets a 16×1 backing store that CSS then
   stretches into a gradient wash. The real box arrived between 600 ms and
   2100 ms after load.

   "Redraw when your box changes" is not recorder behaviour, it is CANVAS
   behaviour — so it lives here once instead of in three tools, and the DAW
   timeline and the take sheet stop rendering the same wash. Returns a stop
   function. */
function vbWatchStage(el, redraw){
  if(!el || typeof redraw!=='function') return function(){};
  var last='', stopped=false, iv=0, burst=[], muted=false;
  function check(){
    if(stopped) return;
    var r=el.getBoundingClientRect();
    var key=Math.round(r.width)+'x'+Math.round(r.height);
    if(key===last) return;
    last=key;
    if(!(r.width>0 && r.height>0)) return;

    /* BURST CAP. A redraw can change the size of the very box being watched —
       measured: one 0→rectangle transition fires this callback TWICE, because
       repainting changes the container's content height. That settles, but a
       layout where every redraw moves the box would loop forever, and an
       unbounded layout loop is a frozen page with nothing in a console to read.
       Same instinct as the repaint kernel's re-entrancy guard; a re-entrancy
       guard cannot catch this one because ResizeObserver delivers on a later
       frame, so the bound is on RATE instead. */
    var now=(new Date()).getTime();
    burst.push(now);
    while(burst.length && now-burst[0]>1000) burst.shift();
    if(burst.length>12){
      if(!muted){
        muted=true;
        try{ console.warn('vbWatchStage: >12 redraws in 1s — the redraw is '+
                          'resizing its own box. Watch a container whose size '+
                          'does not depend on its content.'); }catch(e){}
      }
      return;
    }
    if(muted && burst.length<=2) muted=false;
    try{ redraw(); }catch(e){}
  }
  if(window.ResizeObserver){ try{ new ResizeObserver(check).observe(el); }catch(e){} }
  window.addEventListener('resize', check);
  /* Belt as well as braces: an older CEF may not deliver ResizeObserver
     callbacks for a Slate-hosted widget, so poll briefly at boot too. */
  var n=0; iv=setInterval(function(){ check(); if(++n>40||stopped) clearInterval(iv); },150);
  check();
  return function(){ stopped=true; clearInterval(iv); };
}

/* ══ THE REPAINT KERNEL ═══════════════════════════════════════════════════
   The engine must never call a tool's paint function by name - that is what
   welded three tools into one file. Instead every tool registers a repaint and
   the engine says "something changed". */
var VBUI = (function(){
  var fns=[], busy=false;

    onChange:function(fn){ fns.push(fn); },
    /* RE-ENTRANCY GUARD. A painter that (directly or otherwise) triggers another
       notify would recurse until the tab dies - which is exactly what happened
       once during the split, and it hangs with no error to read. One level only. */

      if(busy) return;

      finally{ busy=false; }

    c.beginPath(); c.moveTo(0,Math.round(mid)+.5); c.lineTo(W,Math.round(mid)+.5); c.stroke(); }

/* ══════════════════════════════════════════════════════════════════════════
   UNDO / REDO and PRESETS (APP-BLUEPRINT §3, §4)
   A snapshot is VB.state() — which already round-trips byte-exact, so undo
   restores THE SEED and every dial, not just slider positions. Without the seed,
   "I randomised and lost it" is unrecoverable, which is the whole reason the
   blueprint insists on it.
   ══════════════════════════════════════════════════════════════════════════ */
var UNDO_MAX=60;
var undoStack=[], redoStack=[], _lastSnap=null, _commitTimer=0;
function snapKey(o){ return JSON.stringify(o); }
function commitUndo(){
  var st=window.VB.state(), k=snapKey(st);
  if(k===_lastSnap) return;               /* nothing actually changed */
  if(_lastSnap!==null){
    undoStack.push(_lastSnap);
    if(undoStack.length>UNDO_MAX) undoStack.shift();
    redoStack.length=0;
  }
  _lastSnap=k; markDirty(); paintUndo();
}
/* slider drags fire dozens of input events; one edit should be one undo step */
function commitSoon(){ clearTimeout(_commitTimer); _commitTimer=setTimeout(commitUndo,320); }
function paintUndo(){
  var u=$('undoBtn'), r=$('redoBtn');
  if(u) u.disabled=!undoStack.length;
  if(r) r.disabled=!redoStack.length;
}
function doUndo(){
  if(!undoStack.length) return;
  var cur=snapKey(window.VB.state());
  var prev=undoStack.pop(); redoStack.push(cur);
  _lastSnap=prev; window.VB.restore(JSON.parse(prev)); paintUndo();
  setS('undo — '+undoStack.length+' steps left');
}
function doRedo(){
  if(!redoStack.length) return;
  var cur=snapKey(window.VB.state());
  var nx=redoStack.pop(); undoStack.push(cur);
  _lastSnap=nx; window.VB.restore(JSON.parse(nx)); paintUndo();
  setS('redo');
}

   A preset carries the dials AND THE SEED, so loading one returns the exact

var PRESET_KEY='taa.variationbench.presets.v1';
var FACTORY=[

/* STORAGE MAY NOT EXIST, AND SILENCE ABOUT THAT IS THE BUG.
   localStorage throws on an opaque origin (a data: URL, some embedded hosts -
   plausibly the editor's browser). The first version caught that and said
   NOTHING, so SAVE reported success and saved nothing: the worst failure shape
   there is. Now we probe once, fall back to an in-session store so the feature
   still WORKS, and say plainly that it will not survive a reload. */
var memStore=null, storageOK=(function(){
  try{ var k='__taa_probe'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();
function blankStore(){ return {version:1,folders:[{name:'MY PRESETS',presets:[]}]}; }
function loadUserPresets(){
  if(!storageOK){ if(!memStore) memStore=blankStore(); return memStore; }
  try{ var raw=localStorage.getItem(PRESET_KEY); if(!raw) return blankStore();
       var o=JSON.parse(raw.replace(/^﻿/,''));   /* strip a BOM we did not write */
       if(!o.folders) o={version:1,folders:[{name:'MY PRESETS',presets:o.presets||[]}]};
       return o;
  }catch(e){ return blankStore(); }
}
function saveUserPresets(o){
  if(!storageOK){ memStore=o; return false; }
  try{ localStorage.setItem(PRESET_KEY,JSON.stringify(o)); return true; }
  catch(e){ storageOK=false; memStore=o; return false; }   /* quota, or revoked */
}
function storageNote(){ return storageOK? '' : ' - THIS SESSION ONLY, this host has no storage'; }
function applyFactory(f){
  M.seed=f.seed>>>0; M.knob=f.knob; M.count=f.count;
  f.layers.forEach(function(o,i){
    var l=L[i]; if(!l) return;
    l.delay=o.delay; l.level=o.level;
    for(var k in o.r) l.r[k]=o.r[k];

  presetName='FACTORY / '+f.name; presetDirty=false;
  _lastSnap=snapKey(window.VB.state()); paintPreset(); paintUndo(); VBUI.notify();
  if(anyLoaded()) doBounce(M.count);

}
function applyUserPreset(p){
  window.VB.restore(p.state);

  _lastSnap=snapKey(window.VB.state()); paintPreset(); paintUndo();
  var missing=[];
  p.state.layers.forEach(function(o,i){
    (o.files||[]).forEach(function(fn){
      var have=L[i].files.some(function(f){return f.name===fn;});
      if(!have) missing.push(fn);

  setS(missing.length
    ? ('loaded "'+p.name+'" — re-drop '+missing.length+' file(s) to restore the sound: '+missing.slice(0,3).join(', '))
    : ('loaded preset "'+p.name+'"'));
}

function hidePicker(){ var pk=$('pick'); if(pk) pk.classList.remove('show'); }
/* never silently overwrite a designer's work: SAVE / DISCARD / CANCEL */
function guardThen(fn){
