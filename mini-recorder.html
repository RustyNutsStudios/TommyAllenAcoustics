<!DOCTYPE html>
<html lang="en">
<head>
<!-- Charset first, which is good practice and costs nothing.
     CORRECTION, 25 Aug: an earlier version of this comment claimed the late
     position CAUSED mojibake in Unreal's CEF. THAT WAS WRONG, and it was my
     error. Re-measured properly in a real 5.6 tab with byte-exact copies, the
     same build renders correctly with the charset at byte 45, at 646 (inside
     the sniff window) and at 1600 (outside it). Position never mattered here.
     The mojibake I saw came from my own test harness: PowerShell's Get-Content
     reads a BOM-less UTF-8 file as ANSI, so injecting a probe corrupted every
     multi-byte character before the file ever reached the editor. The two
     screenshots I compared differed in TWO variables, and I credited the wrong
     one. Keeping the line here anyway - it is correct by spec - but nobody
     should believe it fixed a bug. -->
<meta charset="UTF-8">
<!-- Copyright 2026 Tommy Allen Acoustics. All rights reserved.
     TAA MINI RECORDER — tool 3 of the family, and the simplest one.
     "just quickly getting in sounds". Pick an input, watch the meter, record,
     trim, name it, send it. Everything that would slow that down is absent.

     DEV: loads ../shared/vb-core.js by script tag. RELEASE: the build script
     (Shared/scripts/build-tools.js) inlines everything into one self-contained
     file — the single-file law is what we SHIP, not how we develop.
     Boot flags: ?demo (a synthetic take, so it works with no microphone). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAA Mini Recorder</title>
<style>
/* inlined: ../shared/vb-core.css */
/* ══ VB-CORE.CSS — the S3 HARDWARE PANEL skin, shared by all three tools ══
   One organising idea, and every rule obeys it:
     PANELS ARE LIGHT HARDWARE. ANYTHING SHOWING AUDIO IS A DARK SCREEN INSET.
   Swapping the :root block below re-skins every tool at once - that is the
   whole reason the skin was built as tokens. */
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
/* == SKIN: S3 HARDWARE PANEL (picked 25 Aug) ==============================
   One organising idea, and every rule below obeys it:
     PANELS ARE LIGHT HARDWARE.  ANYTHING SHOWING AUDIO IS A DARK SCREEN INSET.
   So the chrome is a pale instrument face with engraved labels and physical
   fader caps, and every waveform, meter and tile sits on a dark screen the way
   it does on a real desk. Swapping this block is how the skin changes -
   nothing below hard-codes a colour. */
:root{
  --bg:#d9d7d0; --panel:#e7e5df; --panel2:#cfcdc5; --line:#b3b0a6;
  --ink:#1c1b18; --dim:#6e6b62; --dimmer:#8a877e;
  --amber:#ff5a1f; --amber-dim:#8a8780; --green:#1c9e6a; --red:#e0341f;
  /* the screen: where audio lives */
  --screen:#232220; --screen-2:#2e2c28; --screen-line:#3a3833;
  /* field = an editable inset */
  --field:#f2f0ea;
  /* layer identity: DARK on the panel, BRIGHT on the screen */
  --A:#0f766e; --B:#a21caf; --C:#4d7c0f; --D:#b45309;
  --Aw:#2dd4bf; --Bw:#f0abfc; --Cw:#a3e635; --Dw:#fbbf24;
  --cap:linear-gradient(180deg,#fdfdfb,#d5d2c9);
  --engrave:0 1px 0 rgba(255,255,255,.85);
}
body{background:var(--bg);color:var(--ink);font-family:'VT323',monospace;font-size:17px}
.ttl,.lab,.btn,.seg b,.num,.badge{text-shadow:var(--engrave)}
.px{font-family:'Press Start 2P',monospace}

/* THE WHOLE WINDOW IS ONE GRID (APP-BLUEPRINT §4). minmax(0,1fr) is load-bearing:
   an implicit auto column sizes to its content and pushes the UI off-screen. */
.app{height:100vh;display:grid;grid-template-columns:minmax(0,1fr);
     grid-template-rows:auto minmax(0,1fr) auto auto auto;gap:4px;padding:4px 6px}
.panel{background:var(--panel);border:1px solid var(--line);min-width:0;min-height:0;
       box-shadow:0 1px 0 rgba(255,255,255,.75) inset}
.row{display:flex;align-items:center;gap:6px;min-width:0}
.ttl{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--amber);letter-spacing:1px;white-space:nowrap}
.lab{font-size:13px;color:var(--amber-dim);letter-spacing:1px;white-space:nowrap}
.hint{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
.sep{width:1px;height:18px;background:var(--line);flex:0 0 auto}

/* controls — NEVER a native <select>/<input type=file> popup in the editor host
   (APP-BLUEPRINT §6.5: a native popup HARD-CRASHES the editor) */
.btn{font-family:'Press Start 2P',monospace;font-size:8px;padding:6px 9px;cursor:pointer;
     border:1px solid var(--line);background:var(--field);color:var(--ink);white-space:nowrap;
     box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(0,0,0,.16)}
.btn:hover{border-color:var(--amber);background:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#ff7a45,#e04a12);color:#fff;border-color:#c9410f;
             text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.warn{border-color:var(--red);color:var(--red);background:#fdeeeb}
.btn.sm{font-size:7px;padding:4px 6px}
.seg{display:inline-flex;border:1px solid var(--line);flex:0 0 auto}
.seg b{font-family:'Press Start 2P',monospace;font-size:7px;padding:5px 7px;cursor:pointer;
       background:var(--field);color:var(--dim);font-weight:normal;user-select:none;
       box-shadow:0 1px 0 rgba(255,255,255,.9) inset}
.seg b.on{background:var(--amber);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.seg.tiny b{font-size:6px;padding:4px 5px}
.num{font-family:'Press Start 2P',monospace;font-size:8px;padding:5px 4px;background:var(--field);
     border:1px solid var(--line);color:var(--ink);outline:none;text-align:center;width:52px;
     box-shadow:0 1px 2px rgba(0,0,0,.12) inset}
.num.wide{width:96px}
input[type=range]{-webkit-appearance:none;height:5px;background:var(--line);
  border:1px solid #9a978d;border-radius:3px;width:100%;cursor:pointer;display:block;margin:3px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:17px;
  background:var(--cap);border:1px solid #8a8780;border-radius:2px;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.32)}
input[type=range]::-moz-range-thumb{width:12px;height:17px;background:#f0eee8;
  border:1px solid #8a8780;border-radius:2px;cursor:pointer}

/* ── toolbar ─────────────────────────────────────────────────────────── */
.tb{padding:4px 7px}
.brand{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--amber);letter-spacing:1px}
.brand small{color:var(--dim);font-size:7px;letter-spacing:0}

/* ── mode panes ──────────────────────────────────────────────────────── */
.pane{display:none;min-height:0;min-width:0;height:100%}
.pane.on{display:block}
#designPane{overflow:auto}
.layers{display:flex;flex-direction:column;gap:4px;padding:4px}

.status{border:1px solid #9a978d;background:var(--screen);padding:3px 9px;display:flex;align-items:center;
        gap:8px;font-size:14px;color:#7dd3c8;box-shadow:0 1px 3px rgba(0,0,0,.30) inset}
.dot{width:7px;height:7px;background:#5a5852;flex:0 0 auto;border-radius:50%}
.dot.on{background:var(--amber);box-shadow:0 0 7px var(--amber)}
.status .right{margin-left:auto;font-size:12px;color:#8a877e}

/* the preset picker — drawn, because a native popup crashes the editor */
.pick{position:fixed;z-index:240;background:var(--panel);border:1px solid var(--amber);
      box-shadow:0 10px 30px rgba(0,0,0,.45);max-height:60vh;overflow:auto;min-width:230px;display:none}
.pick.show{display:block}
.pick .fold{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--dim);
            padding:6px 8px 3px;letter-spacing:1px;background:var(--panel2)}
.pick .item{padding:5px 9px;font-size:15px;cursor:pointer;display:flex;gap:8px;align-items:center}
.pick .item:hover{background:#f7f5ef}
.pick .item b{color:var(--amber);font-weight:normal;margin-left:auto;font-size:12px}
.dirty{color:var(--red)}

/* ONE dialog does prompts AND the three-way guard. NOT window.confirm(): native
   modals are the class of thing that crashed the editor on 5.6/5.7. */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:220;align-items:center;justify-content:center}
.ov.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--amber);padding:14px 16px;width:min(520px,92vw);
     box-shadow:0 10px 34px rgba(0,0,0,.4);
     display:flex;flex-direction:column;gap:11px}
.dlg p{color:var(--ink);font-size:16px;white-space:pre-wrap;line-height:1.35;overflow-wrap:anywhere}
.dlg .btns{display:flex;gap:6px;justify-content:flex-end}
</style>
<style>
/* inlined: rec.css */
/* MINI RECORDER — screen-specific rules. Tokens live in ../shared/vb-core.css */
/* ── MINI RECORDER pane (tool 3) ───────────────────────────────────────
   "just quickly getting in sounds". The fastest capture path, not a field
   recorder: pick an input, watch the meter, press record, trim, name, send.
   Bigger and emptier than the other two on purpose - at capture time this
   screen has exactly one job. */
#recPane{display:none;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:6px;padding:6px;height:100%}
#recPane.on{display:grid}
.rtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px}
.rdev{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.rdev .btn{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.rmeterwrap{display:flex;align-items:center;gap:8px;padding:6px 8px}
.rmeter{flex:1;height:16px;background:var(--screen);border:1px solid #9a978d;position:relative;
        overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.3) inset;min-width:0}
.rmeter b{position:absolute;left:0;top:0;bottom:0;width:0;
          background:linear-gradient(90deg,#1c9e6a 0%,#1c9e6a 62%,#e8a33d 82%,#e0341f 100%)}
.rmeter i{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:0;display:none}
.rstage{position:relative;background:var(--screen);border:1px solid #9a978d;min-height:0;
        box-shadow:0 1px 3px rgba(0,0,0,.32) inset;display:flex;align-items:center;
        justify-content:center;overflow:hidden}
.rstage canvas{display:block;width:100%;height:100%}
.rbig{font-family:'Press Start 2P',monospace;font-size:34px;color:#ffb38a;letter-spacing:2px}
.rbadge{font-family:'Press Start 2P',monospace;font-size:9px;padding:5px 8px;color:#fff;
        background:var(--red);border:1px solid #a02718}
.rbadge.idle{background:var(--panel2);color:var(--dim);border-color:var(--line)}
.rbadge.armed{background:var(--amber);border-color:#c9410f}
.rstate{position:absolute;top:8px;left:8px;display:flex;gap:6px;align-items:center;z-index:3}
.rhint{position:absolute;bottom:6px;left:8px;font-size:13px;color:#8a877e}
.rbtns{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px}
.rfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px}
.rbtns .big{font-size:11px;padding:11px 20px}
/* Outside the trim is DIMMED, not deleted - the same idiom as the Variation
   Designer's layer trim, so the muscle memory carries straight over. The kept
   region used to be RECOLOURED instead, which reads as "highlighted" rather
   than "the rest of your take is still there". */
.rdim{position:absolute;top:0;bottom:0;background:rgba(8,7,5,.62);pointer-events:none;z-index:1}
/* audition playhead - where you are inside the TRIMMED range */
.rph{position:absolute;top:0;bottom:0;width:1px;background:#4ec9c9;
     box-shadow:0 0 4px rgba(78,201,201,.8);pointer-events:none;z-index:2}
.rcorner{position:absolute;top:8px;right:8px;font-size:12px;color:#ffb38a;
         background:rgba(20,18,16,.82);padding:2px 6px;z-index:3;letter-spacing:.5px}
.rhandle{position:absolute;top:0;bottom:0;width:7px;background:rgba(255,90,31,.55);cursor:ew-resize}
.rhandle:hover{background:rgba(255,90,31,.9)}
.rlab{position:absolute;top:30px;font-size:12px;color:#ffb38a;background:rgba(20,18,16,.8);padding:0 3px;z-index:2}
.rwarn{font-size:13px;color:var(--red)}
/* The CEF microphone question, worn on the tool's face. It is not an error
   state and must not read as one - it is an OPEN QUESTION that stays visible
   until a real Unreal panel settles it. */
.micflag{font-family:'Press Start 2P',monospace;font-size:7px;line-height:1.5;
         color:#7a2d12;background:#f6dfc4;border:1px solid #c9410f;
         padding:5px 7px;letter-spacing:.5px;white-space:nowrap;cursor:help}
/* STOP is the one control pressed under pressure, so it is the biggest thing
   in the transport - the family sheet draws it oversized for exactly that
   reason. ARM and RECORD are chosen deliberately; STOP is grabbed. */
.rbtns #rStop{font-size:15px;padding:16px 34px;letter-spacing:1px}

</style>
<style>.app{grid-template-rows:auto minmax(0,1fr) auto}</style>
</head>
<body>
<div class="app">

  <div class="panel tb">
    <div class="row">
      <span class="brand">MINI RECORDER<small> &nbsp;TAA</small></span>
      <span class="sep"></span>
      <button class="btn sm" id="undoBtn" title="Undo (Ctrl+Z)" disabled>&#8630;</button>
      <button class="btn sm" id="redoBtn" title="Redo (Ctrl+Y)" disabled>&#8631;</button>
      <button class="btn sm" id="presetBtn" title="Presets">&#9733; <span id="presetName">FACTORY / footstep gravel</span></button>
      <button class="btn sm" id="saveBtn">SAVE</button>
      <span class="hint" id="modeHint">arm &middot; record &middot; trim &middot; name &middot; send</span>
    </div>
  </div>

  <div class="panel" style="min-height:0;position:relative">
    <div class="pane on" id="recPane">
      <div class="panel rtop">
        <div class="ttl">&gt;&gt; INPUT</div>
        <span class="seg" id="rSrcSeg"><b class="on" data-src="mic">MIC</b><b data-src="system">SYSTEM AUDIO</b></span>
        <div class="rdev" id="rDevs"><button class="btn sm">scanning&hellip;</button></div>
        <button class="btn sm" id="rRescan">RESCAN</button>
        <span class="hint" id="rNote">48 kHz &middot; 24-bit &middot; mono &mdash; one path, no format menu</span>
        <!-- The CEF microphone permission is an OPEN QUESTION, and it stays on
             screen until a real Unreal panel answers it. A known gap must not
             quietly become a claim just because a browser tab works. -->
        <span class="micflag" id="rCef" title="getUserMedia works in a browser tab. Whether Unreal's embedded Chromium (CEF) grants the same permission, or needs a native call through the plugin bridge, is UNRESOLVED - flagged, not designed around.">&#9888; CEF MIC &mdash; UNRESOLVED</span>
      </div>
      <div class="panel rmeterwrap">
        <span class="lab">LEVEL</span>
        <div class="rmeter" id="rMeter"><b></b><i></i></div>
        <span class="dled" id="rLed" style="width:14px;height:8px"></span>
        <span class="lab" id="rPeak">&mdash;</span>
      </div>
      <div class="rstage" id="rStage">
        <div class="rstate"><span class="rbadge idle" id="rBadge">IDLE</span>
          <span class="hint" id="rSub" style="color:#8a877e"></span></div>
        <div class="rbig" id="rBig">00:00.0</div>
        <canvas id="rWave" style="display:none"></canvas>
        <!-- Outside the handles is DIMMED, not deleted: drag them back out and
             the audio is still there. Nothing is cut until you save. -->
        <div class="rdim" id="rDimL" style="display:none"></div>
        <div class="rdim" id="rDimR" style="display:none"></div>
        <div class="rph" id="rPh" style="display:none"></div>
        <div class="rhandle" id="rIn" style="display:none"></div>
        <div class="rhandle" id="rOut" style="display:none"></div>
        <div class="rlab" id="rInLab" style="display:none;left:2px"></div>
        <div class="rlab" id="rOutLab" style="display:none;right:2px"></div>
        <div class="rcorner" id="rTrimLen" style="display:none"></div>
        <div class="rhint" id="rStageHint">press ARM to open the input, then RECORD</div>
      </div>
      <!-- TWO ROWS ON PURPOSE. Capture on top, what-to-do-with-it underneath -
           the family sheet draws the same split. One row wrapped raggedly once
           STOP became the big target it is supposed to be. -->
      <div class="panel rbtns">
        <button class="btn big" id="rArm">1 &middot; ARM</button>
        <button class="btn big primary" id="rRec">2 &middot; RECORD</button>
        <button class="btn big warn" id="rStop">3 &middot; STOP</button>
        <span class="sep"></span>
        <button class="btn" id="rPlay">&#9654; PLAY</button>
        <button class="btn" id="rRedo">RE-RECORD</button>
        <span class="hint" id="rKbd">SPACE arm &rarr; record &rarr; stop &middot; ESC discards</span>
      </div>
      <div class="panel rfoot">
        <span class="lab">NAME</span>
        <input class="num" id="rName" style="width:150px;text-align:left;padding-left:5px" value="take_01">
        <button class="btn" id="rSave">SAVE WAV</button>
        <span class="sep"></span>
        <span class="lab">SEND TO</span>
        <span class="seg tiny" id="rDestSeg"><b class="on" data-dest="daw">DAW TRACK</b><b data-dest="slot">VAR SLOT</b></span>
        <span class="seg tiny" id="rSlotSeg"><b class="on" data-slot="0">A</b><b data-slot="1">B</b><b data-slot="2">C</b><b data-slot="3">D</b></span>
        <button class="btn primary" id="rSend">SEND &rarr;</button>
        <span class="hint" id="rMsg"></span>
      </div>
    </div>
  </div>

  <div class="status">
    <div class="dot" id="dot"></div><span id="statusText">ready</span>
    <span class="right" id="verLbl"></span>
  </div>
</div>

<div class="pick" id="pick"></div>
<div class="ov" id="ov"><div class="dlg">
  <p id="dlgMsg"></p>
  <div class="btns">
    <button class="btn" id="dlgYes">OK</button>
    <button class="btn warn" id="dlgAlt" style="display:none">DISCARD</button>
    <button class="btn" id="dlgNo">CANCEL</button>
  </div>
</div></div>

<script>
/* inlined: ../shared/vb-core.js */
/* ══════════════════════════════════════════════════════════════════════════
   VB-CORE — the shared engine for all three TAA tools.
   Mini Recorder · Mini DAW · Variation Designer all load this file; none of
   them owns it. If a change here breaks one tool it breaks all three, which is
   exactly the property that makes it worth having in one place.

   WHAT IS IN HERE: the design constants, the seeded draw law, the layer state,
   the render chain, the mix, the ONE AudioContext, WAV + zip writing, file
   decode, presets and undo, the dialog, and the shared half of window.VB.
   WHAT IS NOT: anything that knows what a screen looks like. Tools paint
   themselves and register a repaint with VBUI.onChange().
   ══════════════════════════════════════════════════════════════════════════ */
'use strict';
var VERSION='v0.2', DESIGN_REF='DESIGN.md signed 24 Aug 2026';
var SR=48000;

/* ══ SPEC — every design constant in one place, section noted ══════════════
   TESTER's vb-spec.js compares against VB.spec(); if a number moves it moves
   here and nowhere else. */
var SPEC={
  variation:35, count:12, trim:-1, normalise:'set', tailFade:10, maxLength:0,
  rate:48000, bits:24, channels:1,
  offset:15, pitch:40, gain:2, tone:1.0, spread:0, reverse:0, start:0,      /* §4.2 */
  level:0, delay:0, pan:0, lp:20000, hp:20,                                  /* §4.1 */
  offsetMode:'+/-', pick:'RANDOM',                                           /* §4.2 §5 */
  HEAD_MS:30,                                                                /* §4.1 */
  TRIM_FADE_IN_MS:2, TRIM_FADE_OUT_MS:5, TRIM_FADE_MAX_PCT:10, MIN_TRIM_MS:5, /* §14.2 */
  ORDER:'trim -> trimfades -> start -> reverse -> pitch -> tone -> lp/hp -> gain -> place(head+delay+offset)' /* §14.1 */
};
var HEAD_N=Math.round(SR*SPEC.HEAD_MS/1000);

/* ══ SEEDED IDENTITY (§6) ══════════════════════════════════════════════════
   Every draw is DERIVED from (seed, take, roll, slot, param) — never streamed.
   That is what makes the knob SCALE draws in place instead of reshuffling them,
   and it is why a kept take survives a knob move. Nothing in the render path
   reads Math.random(); only DICE and the audition SHUFFLE do. */
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hashTag(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function drawU(seed,take,roll,slot,param){
  return mulberry32((seed>>>0)^hashTag(take+'|'+roll+'|'+slot+'|'+param))();
}
function uni(u){return u*2-1;}
function newSeed(){return (Math.random()*0xFFFFFFFF)>>>0;}

/* ══ STATE ════════════════════════════════════════════════════════════════ */
var SLOT_IDS=['A','B','C','D'];
/* PANEL colours (badges, chips) are dark so they read on the pale face; SCREEN
   colours (waveforms, ticks) are bright so they read on the dark inset. Same
   identity, two surfaces - S3's whole idea in one pair of arrays. */
var SLOT_COL=['#0f766e','#a21caf','#4d7c0f','#b45309'];
var SLOT_WAVE=['#2dd4bf','#f0abfc','#a3e635','#fbbf24'];
function mkLayer(i){
  return {id:SLOT_IDS[i], col:SLOT_COL[i], wave:SLOT_WAVE[i], name:'', files:[], pick:SPEC.pick, fixedIdx:0,
    on:true, solo:false, mute:false,
    level:SPEC.level, delay:SPEC.delay, pan:SPEC.pan, lp:SPEC.lp, hp:SPEC.hp,
    pitchNom:0,                                 /* §4.1 - static, NOT knob-scaled */
    trimIn:0, trimOut:-1,                       /* ms; -1 = to the end (§14) */
    r:{offset:SPEC.offset, pitch:SPEC.pitch, gain:SPEC.gain, tone:SPEC.tone,
       spread:SPEC.spread, reverse:SPEC.reverse, start:SPEC.start}};
}
var L=[mkLayer(0),mkLayer(1),mkLayer(2),mkLayer(3)];
var M={ seed:newSeed(), knob:SPEC.variation, count:SPEC.count, trim:SPEC.trim,
        normalise:SPEC.normalise, tailFade:SPEC.tailFade, maxLength:SPEC.maxLength,
        rate:SPEC.rate, bits:SPEC.bits, channels:SPEC.channels, name:'variation' };

/* ══ THE RECIPE (§4.2, §5, §6) ════════════════════════════════════════════ */
function pickFile(si,ti){
  var l=L[si], n=l.files.length; if(!n) return 0;

  if(l.pick==='ORDER') return ti%n;
  /* RANDOM: a shuffle-bag - every file used once before any repeats (Wwise's
     "Shuffle"). §5.
     EACH BAG GETS ITS OWN SHUFFLE. This used to shuffle once per (seed, slot)
     and then walk that ONE permutation forever, so a 5-file slot bouncing 30
     takes played the same five-file order six times - the exact repetition this
     product exists to kill, arriving from the tool meant to prevent it. The bag
     index is part of the key now. Determinism is untouched: §6 promises the same
     seed gives the same set, not that the set is one repeating loop.
     A re-rolled take adds its roll to the key, so it draws from a different
     permutation than its bag-mates - which can repeat a file inside one bag, and
     that is correct: a re-roll is a request for something else. */

  var rng=mulberry32(((M.seed>>>0)^hashTag('bag|'+l.id+'|'+bagIdx+'|'+roll))>>>0);

  for(k=n-1;k>0;k--){ var j=Math.floor(rng()*(k+1)); tmp=bag[k]; bag[k]=bag[j]; bag[j]=tmp; }

function effOf(si,dial){ return L[si].r[dial]*M.knob/100; }   /* §4: range x k/100 */

function recipeOne(si,ti){
  var l=L[si], r=rolls[ti]||0, k=M.knob/100, fi=pickFile(si,ti);
  var f=l.files[fi];
  var off=uni(drawU(M.seed,ti,r,l.id,'offset'))*l.r.offset*k;
  if(l.r.offset>0){
    if(SPEC.offsetMode==='+') off=Math.abs(off);
    else if(SPEC.offsetMode==='-') off=-Math.abs(off);

  return {
    slot:l.id, slotIdx:si, name:l.name, col:l.col,
    file:f?f.name:'', fileIdx:fi,
    delayMs:l.delay, offsetMs:off,
    /* RULING 25 Aug: the range varies AROUND the nominal, exactly as OFFSET

       without touching the variation. */
    cents: (l.pitchNom||0) + uni(drawU(M.seed,ti,r,l.id,'pitch'))*l.r.pitch*k,
    dB:    uni(drawU(M.seed,ti,r,l.id,'gain')) *l.r.gain *k,

/* ══ PER-LAYER RENDER — the §14.1 order, and nothing out of order ═════════ */
function trimRegion(l,src){

  /* 2. auto-fades, ONLY on an edge the user actually moved (§14.2) */

    for(i=0;i<fi;i++) base[i]*=0.5-0.5*Math.cos(Math.PI*i/fi);

    for(i=0;i<fo;i++) base[n-1-i]*=0.5-0.5*Math.cos(Math.PI*i/fo);

        down past MIN_TRIM_MS (§14.3). Without the clamp a tight trim + START
        renders silence, which reads as a broken take. */

    var minN=Math.round(SPEC.MIN_TRIM_MS/1000*SR);
    var sk=Math.min(Math.round(rc.startMs/1000*SR), Math.max(0,n-minN));

  /* 4. REVERSE (structure — a threshold, monotonic in the knob, §4.2) */
  if(rc.reversed){ var rv=new Float32Array(n); for(i=0;i<n;i++) rv[i]=base[n-1-i]; base=rv; }

/* ══ THE MIX ══════════════════════════════════════════════════════════════ */

    var s=layerSamples(ti,o.i), off=layerOffsetSamples(ti,o.i), i;
    if(ch===1){ var m=bufs[0];

    }else{

  return n;                    /* latchGain deliberately untouched — §7.1 */
}

/* ══ AUDIO — exactly ONE AudioContext construction site, in audioReady() ═══
   Chromium creates an AudioContext SUSPENDED unless it was constructed during a
   user gesture, and inside the editor's CEF host that is the normal case. A
   suspended context does not advance currentTime: start() schedules and nothing
   is heard, then everything fires at once when it resumes. Never touch audioCtx
   directly — go through audioReady(). (Ported verbatim from the Forge chassis.) */
var audioCtx=null;
function audioReady(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:SR});
  if(audioCtx.state&&audioCtx.state!=='running'&&audioCtx.resume){
    try{ audioCtx.resume(); }catch(e){}
  }
  return audioCtx;
}
/* Warm it on the first real gesture, so the first audition is not the press that
   has to pay for starting the audio device. A TESTED REQUIREMENT (§12.10). */
(function(){
  var EV=['pointerdown','mousedown','keydown'];
  function warm(){ audioReady(); EV.forEach(function(e){window.removeEventListener(e,warm,true);}); }
  EV.forEach(function(e){ window.addEventListener(e,warm,true); });
})();
var curSrc=null;
function stopS(){ if(curSrc){ try{curSrc.stop();}catch(e){} curSrc=null; } }
function play(chans){
  var ctx=audioReady(); stopS();

  for(var c=0;c<arr.length;c++) buf.getChannelData(c).set(arr[c]);

/* ══ WAV + ZIP (chassis) ══════════════════════════════════════════════════ */
function encWAV(chans,bits,rate){
  var nCh=chans.length, N=chans[0].length, bps=bits/8;
  var ds=N*nCh*bps, buf=new ArrayBuffer(44+ds), v=new DataView(buf), o=0;
  function ws(s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));o+=s.length;}
  ws('RIFF'); v.setUint32(o,36+ds,true);o+=4; ws('WAVE'); ws('fmt ');
  v.setUint32(o,16,true);o+=4; v.setUint16(o,1,true);o+=2; v.setUint16(o,nCh,true);o+=2;
  v.setUint32(o,rate,true);o+=4; v.setUint32(o,rate*nCh*bps,true);o+=4;
  v.setUint16(o,nCh*bps,true);o+=2; v.setUint16(o,bits,true);o+=2;
  ws('data'); v.setUint32(o,ds,true);o+=4;
  for(var i=0;i<N;i++) for(var c=0;c<nCh;c++){
    var x=Math.max(-1,Math.min(1,chans[c][i]));
    if(bits===16){ v.setInt16(o,Math.round(x*32767),true); o+=2; }
    else{ var q=Math.round(x*8388607);

  }

}

    var lh=new Uint8Array(30+nameU8.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,0,true); lv.setUint16(10,dosTime,true); lv.setUint16(12,dosDate,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,nameU8.length,true); lv.setUint16(28,0,true); lh.set(nameU8,30);
    parts.push(lh,data);

    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0,true); cv.setUint16(10,0,true); cv.setUint16(12,dosTime,true);
    cv.setUint16(14,dosDate,true); cv.setUint32(16,crc,true);

/* ══ DELIVERY — where can a file actually GO from this host? ════════════
   The editor's CEF implements no download handler, so `<a download>` is dropped
   with NO error while the page carries on as though it saved. Measured on 5.6,
   5.7 and 5.8 by the CEF spike. So the engine asks where a file can go BEFORE
   it claims to have put one there.

   THE WORDS LAW (TOOL RECORDER's, adopted engine-wide): the word SAVED appears
   only when a file actually exists. Failures say WRITTEN — "so nothing was

/* HOST IS NOT INFERRED FROM THE BINDING. Deriving it from window.ue.taa means
   any read taken before the bridge attaches answers "browser" — and then the
   engine would pick the <a download> path, which the editor drops with NO error.
   The safe-looking default is the silent one.

   The user agent does not race. MEASURED in an editor tab on 5.7:
     Mozilla/5.0 (…) GuiVerifyTAASuite57/++UE5+Release-5.7-CL-51494982
     UnrealEngine/5.7.4-51494982+++UE5+Release-5.7 Chrome/128.0.6613.138 …

/* ⚠ THE BINDING IS NOT THERE AT LOAD. MEASURED, in the plugin skeleton:

   not ordered, and 5.6 was simply winning a race.

function saySoon(msg){ setTimeout(function(){ try{ setS(msg); }catch(e){} },0); }

function blobToB64(blob, cb){
  try{
    var fr=new FileReader();
    fr.onload=function(){
      var s=String(fr.result||''), c=s.indexOf(',');
      cb(c>=0? s.slice(c+1) : s, null);
    };
    fr.onerror=function(){ cb(null, fr.error||new Error('read failed')); };
    fr.readAsDataURL(blob);
  }catch(e){ cb(null,e); }
}

function saveBlob(blob,name,done){
  var path=vbDeliveryPath();
  function finish(r){
    if(r.msg) saySoon(r.msg);
    if(typeof done==='function'){ try{ done(r); }catch(e){} }
    return r;
  }

  /* 1. NO PATH. The whole reason this function grew: refuse loudly. */
  if(path==='none') return finish({ok:false, path:'none', name:name, msg:VB_NO_PATH_MSG});

  /* 2. BRIDGE. Only the native side can say whether a file exists, so only it
        is allowed to produce the word SAVED. */
  if(path==='bridge'){
    blobToB64(blob, function(b64, err){
      if(err||!b64) return finish({ok:false, path:'bridge', name:name,
        msg:'could not encode '+name+' — NO FILE WAS WRITTEN.'});
      var p;
      try{ p=vbBridge().savefile(name,b64); }
      catch(e){ return finish({ok:false, path:'bridge', name:name,
        msg:'the file bridge threw on '+name+' — NO FILE WAS WRITTEN.'}); }
      Promise.resolve(p).then(function(json){
        var r={}; try{ r=(typeof json==='string')? JSON.parse(json) : (json||{}); }catch(e){}
        if(r && r.ok) finish({ok:true, path:'bridge', name:name, file:r.path,
          msg:'SAVED '+name+(r.path? (' — '+r.path) : ' into the project')});
        else finish({ok:false, path:'bridge', name:name,
          msg:'the file bridge refused '+name+(r&&r.error? (' — '+r.error):'')+
              '. NO FILE WAS WRITTEN.'});
      }, function(e){
        finish({ok:false, path:'bridge', name:name,
          msg:'the file bridge failed on '+name+': '+((e&&e.message)||e)+
              ' — NO FILE WAS WRITTEN.'});
      });
    });
    return {ok:null, path:'bridge', name:name, pending:true};
  }

  /* 3. DOWNLOAD. The one path whose completion cannot be observed from here —
        and the one where that is acceptable, because a real browser either
        saves the file or tells the user why not. CEF does neither, which is
        exactly why case 1 exists. */
  try{
    var a=document.createElement('a'), url=URL.createObjectURL(blob);
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(url)},4000);
  }catch(e){
    return finish({ok:false, path:'download', name:name,
      msg:'the browser refused the download of '+name+' — NO FILE WAS WRITTEN.'});
  }
  return finish({ok:true, path:'download', name:name,
    msg:'SAVED '+name+' — your browser has it'});
}

/* ══ STAGE WATCH — redraw when your box changes ══════════════════════
   Measured by TOOL RECORDER in a real 5.6 editor tab: CEF reports readyState
   'complete' while the Slate widget still has NO rectangle (stage 18×2), so a
   canvas sized once at draw time gets a 16×1 backing store that CSS then
   stretches into a gradient wash. The real box arrived between 600 ms and
   2100 ms after load.

   "Redraw when your box changes" is not recorder behaviour, it is CANVAS
   behaviour — so it lives here once instead of in three tools, and the DAW
   timeline and the take sheet stop rendering the same wash. Returns a stop
   function. */
function vbWatchStage(el, redraw){
  if(!el || typeof redraw!=='function') return function(){};
  var last='', stopped=false, iv=0, burst=[], muted=false;
  function check(){
    if(stopped) return;
    var r=el.getBoundingClientRect();
    var key=Math.round(r.width)+'x'+Math.round(r.height);
    if(key===last) return;
    last=key;
    if(!(r.width>0 && r.height>0)) return;

    /* BURST CAP. A redraw can change the size of the very box being watched —
       measured: one 0→rectangle transition fires this callback TWICE, because
       repainting changes the container's content height. That settles, but a
       layout where every redraw moves the box would loop forever, and an
       unbounded layout loop is a frozen page with nothing in a console to read.
       Same instinct as the repaint kernel's re-entrancy guard; a re-entrancy
       guard cannot catch this one because ResizeObserver delivers on a later
       frame, so the bound is on RATE instead. */
    var now=(new Date()).getTime();
    burst.push(now);
    while(burst.length && now-burst[0]>1000) burst.shift();
    if(burst.length>12){
      if(!muted){
        muted=true;
        try{ console.warn('vbWatchStage: >12 redraws in 1s — the redraw is '+
                          'resizing its own box. Watch a container whose size '+
                          'does not depend on its content.'); }catch(e){}
      }
      return;
    }
    if(muted && burst.length<=2) muted=false;
    try{ redraw(); }catch(e){}
  }
  if(window.ResizeObserver){ try{ new ResizeObserver(check).observe(el); }catch(e){} }
  window.addEventListener('resize', check);
  /* Belt as well as braces: an older CEF may not deliver ResizeObserver
     callbacks for a Slate-hosted widget, so poll briefly at boot too. */
  var n=0; iv=setInterval(function(){ check(); if(++n>40||stopped) clearInterval(iv); },150);
  check();
  return function(){ stopped=true; clearInterval(iv); };
}
function padNum(v,w){var s=String(v);while(s.length<w)s='0'+s;return s;}

/* ══ PACK — kept + open takes only; culled never leave the app (§9) ═══════ */
function pack(){
  if(latchGain===null) latch();
  var files=[], manifest={
    taaBridge:1, tool:'variation-bench', toolVersion:VERSION, title:M.name,
    buildTarget:'soundcue', sampleRate:M.rate, bounces:[],
    output:{chainApplied:true, chain:SPEC.ORDER},
    dials:{ variation:M.knob, count:M.count, seed:M.seed, rolls:rolls.slice(),
            normalise:M.normalise, trim:M.trim, tailFade:M.tailFade,
            maxLength:M.maxLength, headPadMs:SPEC.HEAD_MS, channels:M.channels, bits:M.bits,
            layers:L.map(function(l){return {id:l.id, name:l.name, files:l.files.map(function(f){return f.name;}),
              pick:l.pick, level:l.level, delay:l.delay, pan:l.pan, lp:l.lp, hp:l.hp,
              trimIn:l.trimIn, trimOut:l.trimOut, offset:l.r.offset, pitch:l.r.pitch,
              gain:l.r.gain, tone:l.r.tone, spread:l.r.spread, reverse:l.r.reverse, start:l.r.start};})},
    takes:[]
  };
  var w=Math.max(2,String(M.count).length), n=0;
  for(var i=0;i<M.count;i++){
    if(marks[i]==='cull') continue;
    var ch=renderTakeCh(i), nm=M.name+'_'+padNum(n+1,w)+'.wav';
    files.push({name:nm, data:encWAV(ch,M.bits,M.rate)});
    manifest.bounces.push(nm);
    manifest.takes.push({file:nm, index:i, roll:rolls[i]||0, trimmed:!!ch._trimmed,
      recipe:recipe(i).map(function(r){return {slot:r.slot,file:r.file,offsetMs:+r.offsetMs.toFixed(3),
        cents:+r.cents.toFixed(2),dB:+r.dB.toFixed(3),toneOct:+r.toneOct.toFixed(3),
        pan:+r.pan.toFixed(1),reversed:r.reversed,startMs:+r.startMs.toFixed(2)};})});
    n++;
  }
  files.push({name:'manifest.json', data:new TextEncoder().encode(JSON.stringify(manifest,null,2)).buffer});
  return {files:files, manifest:manifest};
}


/* ══ THE REPAINT KERNEL ═══════════════════════════════════════════════════
   The engine must never call a tool's paint function by name - that is what
   welded three tools into one file. Instead every tool registers a repaint and
   the engine says "something changed". */
var VBUI = (function(){
  var fns=[], busy=false;
  return {
    onChange:function(fn){ fns.push(fn); },
    /* RE-ENTRANCY GUARD. A painter that (directly or otherwise) triggers another
       notify would recurse until the tab dies - which is exactly what happened
       once during the split, and it hangs with no error to read. One level only. */
    notify:function(){
      if(busy) return;
      busy=true;
      try{ for(var i=0;i<fns.length;i++){ try{ fns[i](); }catch(e){ /* a broken painter must not stop the engine */ } } }
      finally{ busy=false; }
    }
  };
})();
function onEdit(){ markStale(); VBUI.notify(); commitSoon(); }
function bounceCount(n){
  if(!anyLoaded()){ setS('load some files first — or press LOAD DEMO KIT'); return false; }
  resetSheet(n||M.count); latch(); VBUI.notify(); commitUndo(); return true;
}

function $(id){return document.getElementById(id);}
function setS(t){ $('statusText').textContent=t; var d=$('dot');
  d.classList.add('on'); setTimeout(function(){d.classList.remove('on');},550); }
function fitCv(cv){
  var r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  var w=Math.max(1,Math.round(r.width*dpr)), h=Math.max(1,Math.round(r.height*dpr));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  return cv.getContext('2d');
}
/* TRUE min/max peak envelope — not a squiggle. */
function drawWave(cv,samples,opt){
  opt=opt||{};
  var c=fitCv(cv), W=cv.width, H=cv.height, mid=H/2;
  if(!opt.keep) c.clearRect(0,0,W,H);
  if(opt.zero!==false){ c.strokeStyle='rgba(255,255,255,.09)'; c.lineWidth=1;
    c.beginPath(); c.moveTo(0,Math.round(mid)+.5); c.lineTo(W,Math.round(mid)+.5); c.stroke(); }
  if(!samples||!samples.length) return;
  var s0=opt.s0||0, sN=opt.sN||samples.length, g=opt.gain||1;
  c.strokeStyle=opt.col||'#2dd4bf'; c.lineWidth=(opt.lw||1)*(window.devicePixelRatio||1);
  if(opt.alpha!==undefined) c.globalAlpha=opt.alpha;
  c.beginPath();
  for(var x=0;x<W;x++){
    var a=s0+Math.floor(x/W*sN), b=s0+Math.floor((x+1)/W*sN); if(b<=a)b=a+1;
    var mn=0,mx=0,any=false;
    for(var i=a;i<b && i<samples.length;i++){ var v=samples[i];
      if(!any){mn=mx=v;any=true;} else { if(v<mn)mn=v; if(v>mx)mx=v; } }
    if(!any) continue;
    c.moveTo(x+.5, mid-Math.max(-1,Math.min(1,mx*g))*mid*.94);
    c.lineTo(x+.5, mid-Math.max(-1,Math.min(1,mn*g))*mid*.94);
  }
  c.stroke(); c.globalAlpha=1;
}

/* ── DECODE: drop files on a slot ─────────────────────────────────────── */
function addFiles(si,fileList){
  var l=L[si], list=[].slice.call(fileList), done=0;
  if(!list.length) return;
  setS('decoding '+list.length+' file'+(list.length>1?'s':'')+'…');
  list.forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(){
      /* decodeAudioData on a context created at SR resamples for us, and it
         handles 24-bit, EXTENSIBLE and BWF-with-bext (measured: INFRA.md §1). */
      audioReady().decodeAudioData(rd.result).then(function(ab){
        var n=ab.length, mono=new Float32Array(n), c;
        for(c=0;c<ab.numberOfChannels;c++){
          var d=ab.getChannelData(c);
          for(var i=0;i<n;i++) mono[i]+=d[i];
        }
        if(ab.numberOfChannels>1) for(var i=0;i<n;i++) mono[i]/=ab.numberOfChannels;
        if(l.files.length<32) l.files.push({name:f.name.replace(/\.[^.]+$/,''),samples:mono,
          durMs:n/SR*1000, stereo:ab.numberOfChannels>1});
        if(!l.name) l.name=f.name.replace(/\.[^.]+$/,'').slice(0,14);
        if(++done===list.length){ l.trimIn=0; l.trimOut=-1; afterLoad(); }
      }).catch(function(e){
        if(++done===list.length) afterLoad();
        setS('could not decode '+f.name+' — '+(e&&e.message?e.message:e));
      });
    };
    rd.readAsArrayBuffer(f);
  });
}
function afterLoad(){
  resetSheet(M.count); VBUI.notify();
  setS(anyLoaded()? 'loaded — press BOUNCE' : 'drop WAVs on a slot');
}

/* ── DEMO KIT: four synthesised layers so the bench works with no files ── */
function demoKit(){
  function synth(kind,seedName,secs){
    var rng=mulberry32(hashTag(seedName)), n=Math.round(SR*secs), out=new Float32Array(n), i,t,env;
    if(kind==='heel'){ var f=88+rng()*16;
      for(i=0;i<n;i++){ t=i/SR; env=Math.exp(-t*48);
        out[i]=Math.sin(2*Math.PI*f*t)*env*.72 + (i<70?(rng()*2-1)*Math.exp(-i/22)*.9:0); } }
    else if(kind==='scuff'){ var lp=0,hp=0,pv=0;
      for(i=0;i<n;i++){ t=i/SR; env=(t<.004? t/.004 : Math.exp(-(t-.004)*30));
        var w=rng()*2-1; lp+=(w-lp)*.55; hp=.86*(hp+lp-pv); pv=lp; out[i]=hp*env*.85; } }
    else if(kind==='grit'){ var gr=16+Math.floor(rng()*10);
      for(var g=0;g<gr;g++){ var at=Math.floor(Math.pow(rng(),1.6)*n*.8), ln=40+Math.floor(rng()*160), am=.25+rng()*.6;
        for(i=0;i<ln&&at+i<n;i++) out[at+i]+=(rng()*2-1)*Math.exp(-i/(ln*.32))*am*.5; } }
    else { var f0=52+rng()*10;
      for(i=0;i<n;i++){ t=i/SR; var fr=f0*(1+.5*Math.exp(-t*40));
        env=Math.exp(-t*24)*(t<.002?t/.002:1); out[i]=Math.sin(2*Math.PI*fr*t)*env*.95; } }
    var pk=0; for(i=0;i<n;i++) pk=Math.max(pk,Math.abs(out[i]));
    if(pk>1e-9) for(i=0;i<n;i++) out[i]/=pk;
    return out;
  }
  var kit=[
    {k:'heel', nm:'heel',  files:['heel_01','heel_02','heel_03','heel_04','heel_05'], secs:.20, delay:0,  level:0},
    {k:'scuff',nm:'scuff', files:['scuff_01','scuff_02','scuff_03'],                  secs:.14, delay:22, level:-3},
    {k:'grit', nm:'grit',  files:['gravel_a','gravel_b','gravel_c','gravel_d'],       secs:.22, delay:8,  level:-7},
    {k:'body', nm:'body',  files:['thud_01','thud_02'],                               secs:.28, delay:2,  level:-11}
  ];
  kit.forEach(function(spec,si){
    var l=L[si]=mkLayer(si);
    l.name=spec.nm; l.delay=spec.delay; l.level=spec.level;
    spec.files.forEach(function(fn){
      var s=synth(spec.k,fn,spec.secs);
      l.files.push({name:fn, samples:s, durMs:s.length/SR*1000, stereo:false});
    });
  });
  afterLoad();
  setS('demo kit loaded — 4 layers, 14 files. Press BOUNCE.');
}

/* ══════════════════════════════════════════════════════════════════════════
   UNDO / REDO and PRESETS (APP-BLUEPRINT §3, §4)
   A snapshot is VB.state() — which already round-trips byte-exact, so undo
   restores THE SEED and every dial, not just slider positions. Without the seed,
   "I randomised and lost it" is unrecoverable, which is the whole reason the
   blueprint insists on it.
   ══════════════════════════════════════════════════════════════════════════ */
var UNDO_MAX=60;
var undoStack=[], redoStack=[], _lastSnap=null, _commitTimer=0;
function snapKey(o){ return JSON.stringify(o); }
function commitUndo(){
  var st=window.VB.state(), k=snapKey(st);
  if(k===_lastSnap) return;               /* nothing actually changed */
  if(_lastSnap!==null){
    undoStack.push(_lastSnap);
    if(undoStack.length>UNDO_MAX) undoStack.shift();
    redoStack.length=0;
  }
  _lastSnap=k; markDirty(); paintUndo();
}
/* slider drags fire dozens of input events; one edit should be one undo step */
function commitSoon(){ clearTimeout(_commitTimer); _commitTimer=setTimeout(commitUndo,320); }
function paintUndo(){
  var u=$('undoBtn'), r=$('redoBtn');
  if(u) u.disabled=!undoStack.length;
  if(r) r.disabled=!redoStack.length;
}
function doUndo(){
  if(!undoStack.length) return;
  var cur=snapKey(window.VB.state());
  var prev=undoStack.pop(); redoStack.push(cur);
  _lastSnap=prev; window.VB.restore(JSON.parse(prev)); paintUndo();
  setS('undo — '+undoStack.length+' steps left');
}
function doRedo(){
  if(!redoStack.length) return;
  var cur=snapKey(window.VB.state());
  var nx=redoStack.pop(); undoStack.push(cur);
  _lastSnap=nx; window.VB.restore(JSON.parse(nx)); paintUndo();
  setS('redo');
}

/* STORAGE MAY NOT EXIST, AND SILENCE ABOUT THAT IS THE BUG.
   localStorage throws on an opaque origin (a data: URL, some embedded hosts -
   plausibly the editor's browser). The first version caught that and said
   NOTHING, so SAVE reported success and saved nothing: the worst failure shape
   there is. Now we probe once, fall back to an in-session store so the feature
   still WORKS, and say plainly that it will not survive a reload. */
var memStore=null, storageOK=(function(){
  try{ var k='__taa_probe'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();
function blankStore(){ return {version:1,folders:[{name:'MY PRESETS',presets:[]}]}; }
function loadUserPresets(){
  if(!storageOK){ if(!memStore) memStore=blankStore(); return memStore; }
  try{ var raw=localStorage.getItem(PRESET_KEY); if(!raw) return blankStore();
       var o=JSON.parse(raw.replace(/^﻿/,''));   /* strip a BOM we did not write */
       if(!o.folders) o={version:1,folders:[{name:'MY PRESETS',presets:o.presets||[]}]};
       return o;
  }catch(e){ return blankStore(); }
}
function saveUserPresets(o){
  if(!storageOK){ memStore=o; return false; }
  try{ localStorage.setItem(PRESET_KEY,JSON.stringify(o)); return true; }
  catch(e){ storageOK=false; memStore=o; return false; }   /* quota, or revoked */
}
function storageNote(){ return storageOK? '' : ' - THIS SESSION ONLY, this host has no storage'; }
function applyFactory(f){

    for(var k in o.r) l.r[k]=o.r[k];

  presetName='FACTORY / '+f.name; presetDirty=false;
  _lastSnap=snapKey(window.VB.state()); paintPreset(); paintUndo(); VBUI.notify();
  if(anyLoaded()) doBounce(M.count);

}
function applyUserPreset(p){

/* ══ HEADLESS SELF-CHECK ══════════════════════════════════════════════════
   Once the tools are separate files, a preview pane that re-serves a page as a
   data: URL cannot load their script tags - so the ONLY honest way to test a
   split tool is headless. This renders results into the DOM where
   `chrome --dump-dom` can read them, which is exactly what run-vbench needs.
   Usage:  <tool>/index.html?selftest      Look for  VBSELFTEST PASS/FAIL. */
function vbSelfTest(toolName, checks){
  /* ── ENGINE INVARIANTS — asserted in EVERY tool, for free ─────────────────
     These belong to the engine, not to any one screen. Copying them into three
     gates would mean three gates that drift apart, and the one tool that quietly
     dropped a check would be the one that broke — so they live at the single
     place every tool already calls. No tool can forget them, and adding a tool
     cannot lose them. Three sessions now write into one window.VB; the clash
     check in particular has to run everywhere or it is not a guard at all. */
  var engine=[
    {name:'ENGINE · no namespace CLASH — nobody silently overwrote anybody',
     fn:function(){ var c=(window.VB&&window.VB.nsClashes)?window.VB.nsClashes():[];
       return {ok:c.length===0, detail:c.length? c.join(', ') : 'none'}; }},
    {name:'ENGINE · the page NAMES ITSELF (VB.tool)',
     fn:function(){ var t=window.VB&&window.VB.tool;
       return {ok:(typeof t==='string')&&!!t, detail:'tool = '+t}; }},
    {name:'ENGINE · SAVE never claims success without a delivery path',
     fn:function(){
       /* The lie this kills: the editor drops <a download> with no error while
          the status line says it saved. Forced, so it is proven without an
          editor and in EVERY tool, not just the one that found it. */
       var was=window.VB.deliveryPath();
       window.VB.forceDeliveryPath('none');
       var r=saveBlob(new Blob(['probe']),'probe.wav');
       window.VB.forceDeliveryPath(null);
       var m=(r&&r.msg)||'';
       return {ok: !!r && r.ok===false && m.indexOf('NO FILE WAS WRITTEN')>=0 &&
                   m.indexOf('SAVED')<0 && window.VB.deliveryPath()===was,
               detail:'path none → ok='+(r&&r.ok)+', says WRITTEN not SAVED'}; }},
    {name:'ENGINE · state()/restore() round-trips BYTE-EXACT (CONTRACT)',
     fn:function(){
       var a=snapKey(window.VB.state());
       window.VB.restore(JSON.parse(a));        /* a CLONE — proves no aliasing */
       var b=snapKey(window.VB.state());
       return {ok:a===b, detail:(a===b)? (a.length+' bytes, identical') : 'DIFFERS'}; }}
  ];
  checks=engine.concat(checks);
  var out=[], failed=0;
  checks.forEach(function(c){
    var ok=false, detail='';
    try{ var r=c.fn(); if(r&&typeof r==='object'){ ok=!!r.ok; detail=r.detail||''; } else ok=!!r; }
    catch(e){ ok=false; detail='threw: '+(e&&e.message?e.message:e); }
    if(!ok) failed++;
    out.push((ok?'PASS ':'FAIL ')+c.name+(detail?('  ['+detail+']'):''));
  });
  var pre=document.createElement('pre');
  pre.id='vbselftest';
  pre.style.cssText='position:fixed;inset:0;z-index:999;background:#0b0a06;color:#d6d3d1;'+
                    'font:12px monospace;padding:12px;overflow:auto;white-space:pre-wrap';
  pre.textContent='VBSELFTEST '+(failed?'FAIL':'PASS')+' - '+toolName+' - '+
                  (checks.length-failed)+'/'+checks.length+String.fromCharCode(10,10)+
                  out.join(String.fromCharCode(10));
  document.body.appendChild(pre);
  document.title='VBSELFTEST '+(failed?'FAIL':'PASS')+' '+toolName;
  return failed===0;
}

/* boot helper every tool uses. NEVER gate first paint on rAF alone: rAF is
   PAUSED in a non-compositing webview and the tool would render blank with no
   error at all (INFRA.md risk 5). */
function vbBoot(fn){
  var done=false;
  function go(){ if(done) return; done=true; fn(); vbAnnounce(); }
  setTimeout(go,0); requestAnimationFrame(go);
}

/* ══ ANNOUNCE — one line into the editor log, once ════════════════════
   THERE IS NO DEVTOOLS WINDOW ON THIS BROWSER. Inside the editor a page is a
   black box the moment anything goes wrong on a machine that is not ours, so
   every tool says what it is, what host it thinks it is in, and where it
   believes a file can go — the three things worth knowing before anything else
   is diagnosed.

   It also carries the exact phrase `page loaded:` that verify-gui.ps1 greps for,
   which is what lets a REAL tool be gated in a real editor rather than only a
   placeholder page that was written to be gateable. A harness that can only
   verify a stub verifies nothing that ships. */
function vbAnnounce(){
  vbBridgeReady(function(bridge){
    try{
      bridge.log('page loaded: ' + (window.VB && window.VB.tool || 'unknown') +
                 ' ' + VERSION +
                 ' | host=' + (vbIsUnrealHost() ? 'unreal' : 'browser') +
                 ' | delivery=' + vbDeliveryPath() +
                 ' | storage=' + (storageOK ? 'persistent' : 'none'));
    }catch(e){}
  });
}

/* ── NAMESPACE REGISTRAR — VB.ns('daw', {…}) ───────────────────────
   Three sessions now write into one window.VB: the engine here, VB.rec from
   mini-recorder, VB.daw from mini-daw. A plain `window.VB.rec = {…}` written in
   two files means THE LAST ONE LOADED WINS and the other disappears without a
   sound — the exact silent-failure class this build keeps paying for (setDial
   coercing to NaN, the swallowed storage exception, the contract advertising
   doors that did not exist).

   So registration MERGES rather than replaces, and every duplicate key is
   RECORDED so the gate can go red on a collision instead of shipping whichever
   file happened to load second. A clash is not resolved here on purpose: two
   sessions disagreeing about who owns a verb is a routing question, and the
   honest thing is to make it visible, not to pick a winner quietly. */
var _nsClash=[];
window.VB.ns=function(name,members){
  var t=window.VB[name]||(window.VB[name]={});
  for(var k in members){
    if(!Object.prototype.hasOwnProperty.call(members,k)) continue;
    if(Object.prototype.hasOwnProperty.call(t,k)) _nsClash.push(name+'.'+k);
    t[k]=members[k];
  }
  return t;
};
window.VB.nsClashes=function(){ return _nsClash.slice(); };

</script>
<script>
/* inlined: rec.js */
/* ══════════════════════════════════════════════════════════════════════════
   MINI RECORDER — the fastest capture path
   Part of the TAA tool family. Shared engine lives in ../shared/.
   ══════════════════════════════════════════════════════════════════════════ */
'use strict';
/* ══════════════════════════════════════════════════════════════════════════
   MINI RECORDER (tool 3) — "just quickly getting in sounds".
   The fastest capture path, not a field recorder. Pick an input, watch the
   meter, press record, trim what you caught, name it, send it to a DAW track
   or a Variation slot. Everything that would slow that down is absent.

   ⚠ CEF: getUserMedia's permission path inside Unreal's embedded browser is an
   OPEN QUESTION (INFRA spike). The browser build is the guaranteed one; the
   plugin build may need a native permission call through the bridge. Flagged in
   the UI rather than assumed away.
   ══════════════════════════════════════════════════════════════════════════ */
var rec={
  mode:'idle',                 /* idle | armed | recording | captured */
  src:'mic', devId:null, devices:[],
  stream:null, node:null, an:null, srcNode:null,
  chunks:[], len:0, buffer:null,
  trimIn:0, trimOut:-1,
  peak:0, hold:0, clipped:false,
  t0:0, dest:'daw', slot:0, _raf:0, _playing:null, _sent:0, _phRaf:0
};
function recMsg(t,warn){ var e=$('rMsg'); if(e){ e.textContent=t; e.className='hint'+(warn?' rwarn':''); } setS(t); }
function recBadge(){
  var b=$('rBadge'); if(!b) return;
  b.className='rbadge '+(rec.mode==='recording'?'':(rec.mode==='armed'?'armed':'idle'));
  b.textContent=rec.mode.toUpperCase();
  var fullMs=rec.buffer? rec.buffer.length/SR*1000 : 0;
  $('rSub').textContent = rec.mode==='captured'
    ? ((recTrimMs()/1000).toFixed(2)+'s trimmed (of '+(fullMs/1000).toFixed(2)+'s) · 48kHz/24-bit mono')
    : (rec.src==='system'?'system audio':'microphone');
}
function recTrimMs(){
  if(!rec.buffer) return 0;
  var a=Math.round(rec.trimIn/1000*SR), b=(rec.trimOut<0)?rec.buffer.length:Math.round(rec.trimOut/1000*SR);
  return Math.max(0,(b-a)/SR*1000);
}
function recTrimmed(){
  if(!rec.buffer) return new Float32Array(0);
  var a=Math.max(0,Math.round(rec.trimIn/1000*SR));
  var b=(rec.trimOut<0)?rec.buffer.length:Math.min(rec.buffer.length,Math.round(rec.trimOut/1000*SR));

  if(a>0){ var fi=Math.min(Math.round(SPEC.TRIM_FADE_IN_MS/1000*SR),maxF);

  if(b<rec.buffer.length){ var fo=Math.min(Math.round(SPEC.TRIM_FADE_OUT_MS/1000*SR),maxF);
    for(i=0;i<fo;i++) out[n-1-i]*=0.5-0.5*Math.cos(Math.PI*i/fo); }
  return out;
}
/* ── devices ─────────────────────────────────────────────────────────────
   The sheet lists "remembers the last choice, so relaunch needs zero clicks"
   as SHIPS, and it was never implemented — devId lived in memory only. It is
   stored through the same probe the presets use, and when the host has no
   storage the tool SAYS so instead of silently forgetting: the third instance
   of that fix in this codebase, and the reason the family keeps finding them. */
var REC_DEV_KEY='taa_vb_rec_device';
function recRememberDevice(){
  if(!storageOK) return false;
  try{ localStorage.setItem(REC_DEV_KEY, rec.devId||''); return true; }
  catch(e){ return false; }
}
function recRecallDevice(){

function recScan(){

  return navigator.mediaDevices.enumerateDevices().then(function(list){
    rec.devices=list.filter(function(d){return d.kind==='audioinput';})
      .map(function(d,i){ return {id:d.deviceId, label:d.label||('input '+(i+1)+' (label hidden until permission)')}; });

      rec.devId = still? want : rec.devices[0].id;
    }

    rec.devices.forEach(function(d){
      var b=document.createElement('button');
      b.className='btn sm'+(d.id===rec.devId?' primary':'');
      b.textContent=d.label; b.title=d.label;
      b.addEventListener('click',function(){
        rec.devId=d.id; recRememberDevice(); recScan();
        recMsg('input: '+d.label+storageNote());
      });

    });

  }).catch(function(e){
    host.innerHTML='<span class="rwarn">device scan failed: '+(e&&e.message?e.message:e)+'</span>';
    return [];
  });

/* ── arm: open the input so the meter is live BEFORE you commit ───────── */
function recArm(){

        echoCancellation:false, noiseSuppression:false, autoGainControl:false}});

/* ── ONE metering path ────────────────────────────────────────────────────

   from a microphone or from feedInput(). That is deliberate: the peak-hold and
   the clip LED are the only warning a designer gets that a take is ruined, and
   a test that drove a SEPARATE path would prove nothing about the one the user
   actually relies on. TESTER asked for exactly this ("the SAME analyser path a
