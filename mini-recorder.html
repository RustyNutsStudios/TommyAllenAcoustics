  for(i=0;i<d.length;i++){ var v=d[i]<0?-d[i]:d[i]; if(v>mx)mx=v; }
  rec.peak=mx;
  if(mx>rec.hold) rec.hold=mx;
  if(mx>=1.0) rec.clipped=true;          /* 0 dBFS, per the family sheet */
  if(rec.mode==='recording'){
    var c=new Float32Array(d.length); c.set(d); rec.chunks.push(c); rec.len+=d.length;
  }
  micSaw(origin||'live', d.length);      /* evidence, for cefMicStatus */
  return mx;
}
/* ── THE INJECTION POINT: tests and the native bridge both arrive here ──────
   NOT test-only, and it must not be tidied into being test-only in fact.

   `recBlock` meters, holds the peak, latches the clip LED AND accumulates the
   take — both halves, one door. That is what makes this the plugin's capture
   INGRESS as well as the test hook: when the wrap's Path 2 pumps natively
   captured audio in through here, it drives the meter, the LED and the recorded
   buffer on exactly the code a live microphone uses.

   That property is not a coincidence. This path exists because proving the
   meter reads the SIGNAL rather than decorating the screen required the test to
   share the live path — anything else would have proved nothing. Reuse fell out
   of honesty.

   `origin` is what the evidence is worth, and it defaults to the SAFE value:
     'live'   — real getUserMedia samples (the onaudioprocess default)
     'bridge' — native capture through the plugin bridge  <- PUMP MUST PASS THIS
     'inject' — a test amplitude we chose; proves the meter, NOT a microphone
   Only 'live' and 'bridge' can ever make cefMicStatus() report state:'ok',
   because a green nobody watched happen is the thing this whole file refuses
   to print. */
function recFeed(sig,origin){
  if(!sig||!sig.length) return 0;
  var mx=recBlock(sig,origin||'inject');
  recPaintMeter(rec.peak);
  return mx;
}
function recMeterRead(){
  return {peakDb:20*Math.log10(Math.max(1e-5,rec.peak)),
          holdDb:20*Math.log10(Math.max(1e-5,rec.hold)),
          clipped:!!rec.clipped};
}
function recFormat(){ return {rate:SR, bits:24, channels:1, fixed:true}; }
/* ── THE MICROPHONE'S STATUS, AND THE RULE THAT GOVERNS IT ─────────────────
   THE RULE: state:'ok' is permitted ONLY after samples have actually arrived
   and been metered. Not because getUserMedia exists — the spike proved it
   exists on 5.6/5.7/5.8 and is refused on all three. Not because the bridge
   says a permission handler is installed — that is a diagnosis, not a cure.
   Only because audio came through recBlock and we watched it.

   'unproven' is the honest value before evidence and is NOT a failure state.
   'refused' carries the real DOMException name. 'unavailable' means this host
   offers no capture path at all.

   Who owns what, so the two sides cannot disagree: `host` and `path` come from
   the bridge when it is there, because only native knows them. `state` is owned
   by the PAGE, because the page is the only one that can see samples arrive. */
var micEv={
  proven:false,          /* a real capture path delivered audio, and we metered it */
  provenBy:null,         /* 'live' | 'bridge' */
  refusedName:null, refusedMsg:null,
  since:'boot',
  bridge:null            /* cached ue.taa.micstatus() - the call is a PROMISE */
};
function micSaw(origin,n){
  if(!n) return;
  if(origin==='live'||origin==='bridge'){
    if(!micEv.proven){ micEv.proven=true; micEv.provenBy=origin; micEv.since='capture'; }
    micEv.refusedName=null; micEv.refusedMsg=null;
  }
}
/* The bridge's methods resolve as PROMISES in CEF, so this cannot be folded in
   synchronously. Cache it, and never block cefMicStatus() on it. */
function recBridgeMicRefresh(){
  try{
    var t=window.ue&&window.ue.taa;
    if(!t||typeof t.micstatus!=='function') return Promise.resolve(null);
    return Promise.resolve(t.micstatus()).then(function(r){
      try{ micEv.bridge=(typeof r==='string')?JSON.parse(r):r; }catch(e){ micEv.bridge=null; }
      return micEv.bridge;
    },function(){ micEv.bridge=null; return null; });
  }catch(e){ return Promise.resolve(null); }
}
/* WHICH HOST am I in — answered without racing the binding.
   `window.ue.taa` is definitive when present, but on CEF 128 it is NOT bound
   yet when the page script runs, so its ABSENCE proves nothing early. Reading
   host from the bridge alone made this report host:'browser' inside Unreal for
   the first moments of the tab's life, and the detail sentence would then have
   told a plugin user to "allow the microphone in a browser". The user agent is
   available immediately and does not race — measured in the spike:
   "...UnrealEngine/5.6.1-44394996+". Same bug family as the SAVE paint. */
function recIsUnrealHost(){
  try{
    if(window.ue&&window.ue.taa) return true;
    return /UnrealEngine/i.test(navigator.userAgent||'');
  }catch(e){ return false; }
}
function recCefMicStatus(){
  var t=null;
  try{ t=window.ue&&window.ue.taa; }catch(e){ t=null; }
  var host=recIsUnrealHost()? 'unreal' : 'browser';
  var bm=micEv.bridge;
  var canGum=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  /* path: the bridge's word when it is there, since only native knows */
  var path;
  if(bm&&bm.path){ path=(bm.path==='cef')?'webaudio':(bm.path==='native'?'bridge':'none'); }
  else if(host==='unreal'){ path=(t&&typeof t.micread==='function')?'bridge':(canGum?'webaudio':'none'); }
  else { path=canGum?'webaudio':'none'; }

  var state, detail;
  if(micEv.proven){
    state='ok';
    detail='audio has actually arrived and been metered through the '+
           (micEv.provenBy==='bridge'?'plugin bridge':'browser capture path')+
           ' — this is the only way this reports ok.';
  }else if(micEv.refusedName){
    state='refused';
    detail='the host refused capture ('+micEv.refusedName+
           (micEv.refusedMsg?(': '+micEv.refusedMsg):'')+'). '+
           (host==='unreal'
             ? 'This is the known CEF gap: the plugin must grant the permission natively or capture natively.'
             : 'In a browser, allow the microphone and press ARM again.');
  }else if(path==='none'){
    state='unavailable';
    detail='this host offers no capture path at all — neither a browser capture API nor a bridge mic method.';
  }else{
    state='unproven';
    detail='nothing has been captured yet, so nothing is proven. '+
           (canGum?'A capture function exists, which is not evidence that it works — ':'')+
           'press ARM to find out.';
  }
  return {host:host, path:path, state:state, detail:detail, since:micEv.since};
}
function recDiscard(){
  recDisarm();
  rec.buffer=null; rec.chunks=[]; rec.len=0;
  rec.trimIn=0; rec.trimOut=-1;
  rec.peak=0; rec.hold=0; rec.clipped=false;
  rec.mode='idle';
  recBadge(); recPaint(); recPaintMeter(0);
  return rec.mode;
}
/* STRICT — the API's capture verb refuses when the input was never opened, and
   says so by returning false. The on-screen 2·RECORD button is allowed to be
   friendlier (it arms for you); the API is not, because the invariant has to
   live somewhere a caller cannot skip. Same lesson as setDial's strings and
   setRecTrim's bounds: an invariant enforced only in the UI is not one. */
function recRecordStrict(){
  if(rec.mode!=='armed') return false;
  recStart();
  return rec.mode==='recording';
}
/* STOP, optionally with the take handed in. A headless run can never reach
   'recording' (arm needs a microphone this rig has none of), so without this
   the entire trim/save/send half of the tool would be untestable. */
function recStopWith(sig){
  if(rec.mode==='recording'){ recStopIt(); return rec.buffer?rec.buffer.length:0; }
  if(sig&&sig.length){
    var b=new Float32Array(sig.length); b.set(sig);
    rec.buffer=b; rec.len=b.length; rec.chunks=[];
    rec.trimIn=0; rec.trimOut=-1; rec.mode='captured';
    recDisarm(); recBadge(); recPaint();
    return b.length;
  }
  recStopIt();
  return rec.buffer?rec.buffer.length:0;
}
/* SAVE, split in two: the bytes, and the download. They were one function, so
   the only way to check what SAVE writes was to hook the browser's download
   machinery. Returning the bytes lets the WAV be parsed from bytes. */
function recWavBytes(){
  var b=recTrimmed();
  if(!b.length) return null;
  return {data:encWAV([b],24,SR), name:recName()+'.wav', samples:b.length};
}
function recName(){
  var e=$('rName');
  return ((e&&e.value)||'take').replace(/[^\w\-]/g,'_');
}
/* ── SAVE ─ the routing now lives ONE LEVEL DOWN ──────────────────────
   This tool used to own a three-way delivery decision. It does not any more:
   `shared/vb-core.js`'s saveBlob is bridge-aware and honest for all three
   tools, so a copy here would be two answers to one question. The words-rule
   this department derived (failures say WRITTEN, successes say SAVED; the
   success word appears only when a file exists) was adopted verbatim in the
   engine, so it now protects the DAW and the Variation Designer too.

   What stays is the only part that is genuinely the Recorder's: WHICH bytes,
   and WHAT the take is called. Host detection, encoding, the refusal message
   and the delivery decision are all shared's now. */
var REC_NO_TAKE_MSG='nothing to write — capture a take first';
/* Always a Promise of the shared result {ok, path, name, file?, msg}. `ok` is
   NULL while a bridge call is in flight, so this waits for the real answer
   instead of reporting the pending one. */
function recSaveWavHonest(){
  var w=recWavBytes();
  if(!w) return Promise.resolve({ok:false, path:'none', name:null, samples:0,
                                 msg:REC_NO_TAKE_MSG, message:REC_NO_TAKE_MSG});
  return new Promise(function(resolve){
    var settled=false;
    function hand(r){
      if(settled) return; settled=true;
      r=r||{}; r.samples=w.samples; r.message=r.msg;
      resolve(r);
    }
    var immediate=saveBlob(new Blob([w.data],{type:'audio/wav'}), w.name, hand);
    /* a non-pending answer is final and has already gone through `done` */
    if(immediate && immediate.pending!==true) hand(immediate);
  });
}

function recDisarm(){
  if(rec.node){ try{rec.node.disconnect();}catch(e){} rec.node.onaudioprocess=null; rec.node=null; }
  if(rec.srcNode){ try{rec.srcNode.disconnect();}catch(e){} rec.srcNode=null; }
  if(rec.stream){ rec.stream.getTracks().forEach(function(t){t.stop();}); rec.stream=null; }
  rec.an=null;
  if(rec._raf){ cancelAnimationFrame(rec._raf); rec._raf=0; }
}
function recStart(){
  if(rec.mode==='idle'||rec.mode==='captured'){ recArm().then(function(ok){ if(ok) recStart(); }); return; }
  if(rec.mode!=='armed') return;
  rec.chunks=[]; rec.len=0; rec.buffer=null; rec.clipped=false; rec.hold=0;
  rec.t0=audioReady().currentTime; rec.mode='recording';
  recBadge(); recMsg('recording — press STOP when you are done');
}
function recStopIt(){
  if(rec.mode!=='recording'){ recDisarm(); rec.mode='idle'; recBadge(); recPaint(); return; }
  var buf=new Float32Array(rec.len), o=0;
  rec.chunks.forEach(function(c){ buf.set(c,o); o+=c.length; });
  rec.buffer=buf; rec.chunks=[];
  rec.trimIn=0; rec.trimOut=-1;
  rec.mode='captured'; recDisarm();
  if(!$('rName').value || /^take_\d+$/.test($('rName').value)){
    var n=(rec.devices[0]&&rec.devices[0].label||'take').split(' ')[0].replace(/[^\w]/g,'').slice(0,10).toLowerCase();
    $('rName').value=(n||'take')+'_'+padNum(Math.floor((buf.length/SR)*10)%100,2);
  }
  recBadge(); recPaint();
  recMsg('captured '+(buf.length/SR).toFixed(2)+'s — trim it, then SAVE or SEND'+(rec.clipped?' (it clipped)':''));
}
/* test-only: a synthetic take, so the trim/name/save/send path is verifiable in
   a headless run that has no microphone. Without this the whole tool is
   untestable, which is how a capture tool ships broken. */
function recSimulate(ms){
  var n=Math.round(SR*(ms||900)/1000), b=new Float32Array(n), rng=mulberry32(12345);
  for(var i=0;i<n;i++){ var t=i/SR;
    b[i]=Math.sin(2*Math.PI*220*t)*Math.exp(-t*2.2)*0.6 + (rng()*2-1)*0.02*Math.exp(-t*4); }
  rec.buffer=b; rec.len=n; rec.trimIn=0; rec.trimOut=-1; rec.mode='captured';
  rec.clipped=false; rec.hold=0.6;
  recBadge(); recPaint();
  return n;
}
function recLoop(){
  if(rec.mode!=='armed' && rec.mode!=='recording'){ recPaintMeter(0); return; }
  recPaintMeter(rec.peak);
  if(rec.mode==='recording'){
    var el=(audioReady().currentTime-rec.t0);
    $('rBig').textContent=padNum(Math.floor(el/60),2)+':'+padNum(Math.floor(el%60),2)+'.'+Math.floor((el*10)%10);
  }
  rec._raf=requestAnimationFrame(recLoop);
}
function recPaintMeter(pk){
  var m=$('rMeter'); if(!m) return;
  var db=20*Math.log10(Math.max(1e-5,pk)), w=Math.max(0,Math.min(1,(db+60)/60));
  m.querySelector('b').style.width=(w*100)+'%';
  var hb=20*Math.log10(Math.max(1e-5,rec.hold)), hw=Math.max(0,Math.min(1,(hb+60)/60));
  var h=m.querySelector('i');
  h.style.display=rec.hold>0.001?'':'none'; h.style.left=(hw*100)+'%';
  $('rLed').classList.toggle('hot',rec.clipped);
  $('rPeak').textContent = rec.hold>0.001? (20*Math.log10(rec.hold)).toFixed(1)+' dB' : '—';
}
function recPaint(){
  var cap=(rec.mode==='captured' && rec.buffer && rec.buffer.length);
  $('rBig').style.display=cap?'none':'';
  $('rWave').style.display=cap?'':'none';
  ['rIn','rOut','rInLab','rOutLab'].forEach(function(id){ $(id).style.display=cap?'':'none'; });
  $('rStageHint').textContent = cap
    ? 'drag the handles to trim · PLAY to check · SEND fires it at the next tool'
    : (rec.mode==='armed'? 'armed — the meter is live; press RECORD'
      : rec.mode==='recording'? 'recording — press STOP, nothing is lost'
      : 'press ARM to open the input, then RECORD');
  ['rDimL','rDimR','rTrimLen'].forEach(function(id){ var e=$(id); if(e) e.style.display=cap?'':'none'; });
  if(!cap){ recPlayheadHide(); return; }
  var cv=$('rWave');
  /* ONE wave, drawn once, at full strength. The trim is expressed by DIMMING
     what falls outside it — the take is never redrawn in a "kept" colour,
     because that reads as highlighting rather than "the rest is still there". */
  drawWave(cv,rec.buffer,{col:'#ffb38a',zero:false});
  var wrapW=cv.getBoundingClientRect().width, dur=rec.buffer.length/SR*1000;
  var inMs=rec.trimIn, outMs=(rec.trimOut<0)?dur:rec.trimOut;
  var xIn=inMs/dur*wrapW, xOut=outMs/dur*wrapW;
  $('rDimL').style.left='0px';  $('rDimL').style.width=Math.max(0,xIn)+'px';
  $('rDimR').style.left=xOut+'px'; $('rDimR').style.width=Math.max(0,wrapW-xOut)+'px';
  $('rIn').style.left=(xIn-3)+'px';
  $('rOut').style.left=(xOut-3)+'px';
  $('rInLab').textContent='IN '+inMs.toFixed(0)+'ms';
  $('rOutLab').textContent='OUT '+outMs.toFixed(0)+'ms';
  /* what you are about to save, read off the TRIMMED take rather than the
     whole capture - the number that matters is the one that leaves the tool */
  var t=recTrimmed(), pk=0;
  for(var i=0;i<t.length;i++){ var v=t[i]<0?-t[i]:t[i]; if(v>pk)pk=v; }
  $('rTrimLen').textContent='TRIM '+(recTrimMs()/1000).toFixed(2)+'s · PEAK '+
    (pk>0? (20*Math.log10(pk)).toFixed(1)+' dBFS' : '—');
  recBadge();
}
/* ── audition playhead ─────────────────────────────────────────────────────
   PLAY used to give no positional feedback at all, so a trim you were checking
   by ear had nothing on screen to check it against. The head runs across the
   TRIMMED range only, because that is what is playing. */
function recPlayheadHide(){
  var p=$('rPh'); if(p) p.style.display='none';
  if(rec._phRaf){ cancelAnimationFrame(rec._phRaf); rec._phRaf=0; }
}
function recPlayhead(durMs){
  var p=$('rPh'), cv=$('rWave');
  if(!p||!cv||!rec.buffer) return;
  var t0=audioReady().currentTime;
  var full=rec.buffer.length/SR*1000;
  var inMs=rec.trimIn, outMs=(rec.trimOut<0)?full:rec.trimOut;
  p.style.display='';
  if(rec._phRaf) cancelAnimationFrame(rec._phRaf);
  (function step(){
    var el=(audioReady().currentTime-t0)*1000;
    if(el>=durMs){ recPlayheadHide(); return; }
    var w=cv.getBoundingClientRect().width;
    p.style.left=((inMs+el)/full*w)+'px';
    rec._phRaf=requestAnimationFrame(step);
  })();
  return outMs;
}
/* The destinations this tool understands. An unknown one is REJECTED, never
   quietly redirected — the old code mapped anything that was not 'slot' onto
   the DAW, so sendTo('variation', 2) silently went to a DAW track. Worse, that
   branch also appends to the layer's file list, so slotCount() still went up
   and the misroute was invisible to exactly the assertion you would write to
   catch it. Director's ruling, 25 Aug: a misroute must be LOUD. */
var REC_DESTS={slot:'slot', variation:'slot', daw:'daw', track:'daw'};
function recNormDest(d){ return REC_DESTS[String(d||'').toLowerCase()] || null; }
function recSend(){
  var buf=recTrimmed();
  if(!buf.length){ recMsg('nothing to send',true); return null; }
  var nm=($('rName').value||'take').replace(/[^\w\-]/g,'_');
  if(rec.dest==='slot'){
    window.VB.loadLayer(rec.slot,{name:nm,samples:buf,sampleRate:SR});
    recMsg('sent '+(buf.length/SR).toFixed(2)+'s to VARIATION slot '+SLOT_IDS[rec.slot]);
  }else if(typeof daw==='undefined'){
    /* the DAW module is not in this build. The layer's file list IS the DAW's
       track content when it opens (dawSync builds clips from it), so the take
       still lands where it was aimed - it just arrives when the DAW does. */
    window.VB.loadLayer(rec.slot,{name:nm,samples:buf,sampleRate:SR});
    recMsg('sent '+(buf.length/SR).toFixed(2)+'s to track '+SLOT_IDS[rec.slot]+' — it will be there when the Mini DAW opens');
  }else{
    var l=L[rec.slot];
    l.files.push({name:nm,samples:buf,durMs:buf.length/SR*1000,stereo:false});
    if(!l.name) l.name=nm.slice(0,14);
    var fi=l.files.length-1, start=daw.tracks[rec.slot].length? (function(){
      var last=daw.tracks[rec.slot][daw.tracks[rec.slot].length-1];
      return last.startMs+(last.outMs-last.inMs);
    })() : 0;
    daw.tracks[rec.slot].push({id:daw._nextId++, fileIdx:fi, startMs:start,
                               inMs:0, outMs:buf.length/SR*1000});
    sortTrack(rec.slot); dawCommitNominal(rec.slot);
    VBUI.notify();
    recMsg('sent '+(buf.length/SR).toFixed(2)+'s to DAW track '+SLOT_IDS[rec.slot]+' at '+(start/1000).toFixed(2)+'s');
  }
  rec._sent++;
  return buf.length;
}
/* ── THE CANVAS MUST BE RE-FITTED WHEN ITS BOX CHANGES ────────────────────
   `fitCv` sizes the backing store from getBoundingClientRect() at DRAW TIME,
   once. Measured inside a real UE 5.6 editor tab:

     before any take     canvas 0.0x0.0    backing 300x150   STAGE 18.0x2.0
     right after drawing  canvas 16.0x0.0   backing 16x1      STAGE 18.0x2.0
     +1500ms, no redraw   canvas 1128x461   backing 16x1   <-- STILL 16x1
     after a repaint      canvas 1128x461   backing 1128x461

   CEF reports document.readyState "complete" while the Slate widget still has
   no rectangle — Click Factory's panel says the same thing in its own words
   ("one second of real ticks ... so the browser widget has been arranged and
   has a rectangle"). So the take was drawn into a 16x1 buffer and CSS stretched
   it across 1128x461, which is the smooth gradient wash on screen. Nothing ever
   re-fitted it, so it stayed broken for the life of the tab.

   This is NOT a CEF hack. The same bug bites a plain browser: resize the window
   with a take captured and the waveform is left at the old backing size. The
   missing behaviour is "redraw when your box changes", and that is what this
   adds. */
function recWatchStage(){
  var st=$('rStage'); if(!st) return;
  var last='';
  function check(){
    var cv=$('rWave'); if(!cv) return;
    var r=cv.getBoundingClientRect();
    var key=Math.round(r.width)+'x'+Math.round(r.height);
    if(key===last) return;
    last=key;
    if(r.width>0 && r.height>0) recPaint();
  }
  if(window.ResizeObserver){
    try{ new ResizeObserver(check).observe(st); }catch(e){}
  }
  window.addEventListener('resize',check);
  /* Belt as well as braces: an older CEF may not deliver ResizeObserver
     callbacks for a Slate-hosted widget, so poll briefly at boot too. Measured:
     the real box arrived between 600 ms and 2100 ms after load on 5.6. */
  var n=0, iv=setInterval(function(){ check(); if(++n>40) clearInterval(iv); },150);
  check();
}
/* A button that cannot do its job must not look like one that can. When there
   is no delivery path, SAVE WAV wears it before it is pressed rather than
   apologising afterwards. */
function recPaintSave(){
  var b=$('rSave'); if(!b) return;
  /* the DECISION is shared's; wearing it is mine */
  var path=vbDeliveryPath();
  var dead=(path==='none');
  b.classList.toggle('warn',dead);
  b.textContent=dead? 'SAVE WAV ⚠' : 'SAVE WAV';
  b.title=dead
    ? 'This host cannot receive a file: Unreal\'s browser drops downloads and no '+
      'file bridge is present. Press for the full explanation, or use SEND TO.'
    : (path==='bridge'
        ? 'Writes the trimmed take into the project through the plugin bridge.'
        : 'Writes the trimmed take to disk.');
  return path;
}
/* ── wiring ──────────────────────────────────────────────────────────── */
function recWire(){
  $('rArm').addEventListener('click',function(){ recArm(); });
  $('rRec').addEventListener('click',recStart);
  $('rStop').addEventListener('click',recStopIt);
  $('rRedo').addEventListener('click',function(){ rec.buffer=null; rec.mode='idle'; recBadge(); recPaint(); recArm(); });
  $('rRescan').addEventListener('click',function(){ recScan().then(function(d){ recMsg(d.length+' input(s) found'); }); });
  $('rPlay').addEventListener('click',function(){
    var b=recTrimmed(); if(!b.length){ recMsg('nothing captured yet',true); return; }
    play(b);
    recPlayhead(b.length/SR*1000);
    recMsg('playing the trimmed take · '+(b.length/SR).toFixed(2)+'s');
  });
  $('rSave').addEventListener('click',function(){
    /* the button writes the SAME bytes recWavBytes() returns - one encoder, so
       what the gate parses is what the designer gets - and it reports what
       ACTUALLY happened, never a save that did not occur */
    recSaveWavHonest().then(function(r){ recMsg(r.message, !r.ok); });
  });
  $('rSend').addEventListener('click',recSend);
  ['rIn','rOut'].forEach(function(id){
    var h=$(id), which=(id==='rIn')?'in':'out';
    h.addEventListener('pointerdown',function(e){
      if(!rec.buffer) return;
      e.preventDefault(); h.setPointerCapture(e.pointerId);
      var cv=$('rWave'), r=cv.getBoundingClientRect(), dur=rec.buffer.length/SR*1000;
      function mv(ev){
        var x=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)), ms=x*dur;
        var to=(rec.trimOut<0)?dur:rec.trimOut;
        if(which==='in') rec.trimIn=Math.max(0,Math.min(ms,to-SPEC.MIN_TRIM_MS));
        else rec.trimOut=Math.min(dur,Math.max(ms,rec.trimIn+SPEC.MIN_TRIM_MS));
        recPaint();
      }
      function up(){ h.removeEventListener('pointermove',mv); h.removeEventListener('pointerup',up); }
      h.addEventListener('pointermove',mv); h.addEventListener('pointerup',up);
    });
  });
}

</script>
<script>
/* inlined: rec-app.js */
/* ══════════════════════════════════════════════════════════════════════════
   MINI RECORDER — wiring and boot.
   rec.js holds the capture engine; this file is only the screen's plumbing and
   the tool's half of window.VB. Keeping them apart is what lets the recorder
   ship on its own without dragging the other two tools with it.
   ══════════════════════════════════════════════════════════════════════════ */
'use strict';

segWire('rSrcSeg',function(v){
  rec.src=v; recBadge();
  setS(v==='system'
    ? 'SYSTEM AUDIO — the share dialog must have "share audio" ticked; if the host refuses, mic is the guaranteed path'
    : 'microphone input');
});
segWire('rDestSeg',function(v){ rec.dest=v; });
segWire('rSlotSeg',function(v){ rec.slot=+v; });

/* preset + undo furniture, identical in all three tools */
$('undoBtn').addEventListener('click',doUndo);
$('redoBtn').addEventListener('click',doRedo);
$('presetBtn').addEventListener('click',function(e){
  var pk=$('pick');
  if(pk.classList.contains('show')) hidePicker(); else showPicker(this);
  e.stopPropagation();
});
$('saveBtn').addEventListener('click',savePreset);
document.addEventListener('click',function(e){
  var pk=$('pick');
  if(pk&&pk.classList.contains('show')&&!pk.contains(e.target)&&e.target.id!=='presetBtn') hidePicker();
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){ doUndo(); e.preventDefault(); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='Y')){ doRedo(); e.preventDefault(); return; }
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key===' '){                       /* space is the one key that matters here */
    if(rec.mode==='recording') recStopIt(); else recStart();
    e.preventDefault();
  }
  /* ESC bails out. The family sheet's state diagram promises "SPACE toggles
     ARM -> RECORD - ESC discards and returns to idle" and says the mouse is
     never required; SPACE was bound and ESC was not, so half that promise was
     decoration. TESTER named the gap by name in escDiscards. */
  else if(e.key==='Escape'){
    if(rec.mode==='idle') return;
    var had=rec.buffer&&rec.buffer.length;
    recDiscard();
    recMsg(had? 'take discarded — back to idle' : 'back to idle');
    e.preventDefault();
  }
});

/* ── the tool's half of the contract — DESIGN §16.6c, amended 25 Aug ───────
   ONE NAMESPACE, VB.rec. The flat members this replaced (VB.arm, VB.record,
   VB.stopRec, VB.recState, VB.takeBuffer, VB.setRecTrim, VB.sendTo, VB.inputs)
   are GONE on purpose, and the important one is VB.record: §16.5 says the DAW
   does not record and TESTER asserts that by name, so a global VB.record was a
   scope violation waiting to be read as one. Namespacing retires it by
   construction rather than by anyone remembering. Director's ruling, 25 Aug. */
function recTrimSet(inMs,outMs){
  /* CLAMPED here as well as in the drag handles - an invariant enforced in the
     UI but not in the API is not an invariant. */
  var dur=rec.buffer? (rec.buffer.length/SR*1000) : 0, mn=SPEC.MIN_TRIM_MS;
  var a=Math.max(0,+inMs||0);
  var b=(outMs===null||outMs===undefined)?-1:+outMs;
  if(dur>0){ a=Math.min(a,Math.max(0,dur-mn)); if(b>=0) b=Math.min(dur,Math.max(b,a+mn)); }
  else if(b>=0){ b=Math.max(b,a+mn); }
  rec.trimIn=a; rec.trimOut=b; recPaint();
  return {trimIn:rec.trimIn,trimOut:rec.trimOut,trimmedMs:recTrimMs()};
}
window.VB.tool='mini-recorder';
window.VB.rec={
  /* input */
  devices:function(){ return rec.devices.map(function(d){ return {deviceId:d.id, label:d.label}; }); },
  setDevice:function(id){ rec.devId=id; recRememberDevice(); recScan(); return rec.devId; },
  device:function(){ return rec.devId; },
  rescan:function(){ return recScan(); },
  source:function(sr){ if(sr!==undefined){ rec.src=(sr==='system')?'system':'mic'; recBadge(); } return rec.src; },
  /* the capture chain */
  phase:function(){ return rec.mode; },
  /* the whole observable state in one read. dest/slot are in here because the
     COUNT alone cannot prove a take went where it was aimed: the DAW branch
     also appends to the layer's file list, so a misroute increments slotCount
     too. The ROUTE has to be readable, or the assertion is measuring nothing. */
  state:function(){
    return {mode:rec.mode, dest:rec.dest, slot:rec.slot,
            ms:rec.buffer?(rec.buffer.length/SR*1000):(rec.len/SR*1000),
            trimmedMs:recTrimMs(), name:recName(),
            peakDb:20*Math.log10(Math.max(1e-5,rec.peak)),
            holdDb:20*Math.log10(Math.max(1e-5,rec.hold)),
            clipped:!!rec.clipped, sent:rec._sent};
  },
  arm:function(){ return recArm(); },
  record:recRecordStrict,
  stop:function(sig){ return recStopWith(sig); },
  discard:recDiscard,
  take:function(){ return rec.buffer; },
  trimmed:function(){ return recTrimmed(); },
  setTrim:recTrimSet,
  name:function(nm){ if(nm!==undefined && $('rName')) $('rName').value=nm; return recName(); },
  /* what the meter knows */
  meter:recMeterRead,
  format:recFormat,
  /* honesty */
  cefMicStatus:recCefMicStatus,
  storagePersistent:function(){ return !!storageOK; },
  /* out */
  saveWav:recWavBytes,                    /* the BYTES - what a gate parses */
  save:function(){ return recSaveWavHonest(); },   /* the ACT, and its truth */
  /* delivery is the ENGINE's decision now - VB.deliveryPath() is the one
     answer, and this is kept only so recorder callers need not know that */
  deliveryPath:function(){ return window.VB.deliveryPath(); },
  sendTo:function(dest,idx){
    var d=recNormDest(dest);
    if(!d){                                  /* LOUD, never a quiet redirect */
      recMsg('unknown SEND destination "'+dest+'" — nothing was sent. Use daw/track or slot/variation.',true);
      return false;
    }
    rec.dest=d; rec.slot=Math.max(0,Math.min(3,+idx||0));
    return recSend()!==null;
  },
  sent:function(){ return rec._sent||0; },
  /* TEST ONLY: a headless run has no microphone, and a capture tool nobody can
     test is a capture tool that ships broken. */
  simulate:function(ms){ return recSimulate(ms); },
  /* THE INJECTION POINT — tests AND the plugin's native capture pump arrive
     here (see rec.js). The pump MUST pass origin 'bridge'; without it the
     samples count as a test injection and can never report state:'ok'. */
  feedInput:function(sig,origin){ return recFeed(sig,origin); }
};

/* one repaint, registered with the engine */
VBUI.onChange(function(){
  recBadge(); recPaint();
  if($('verLbl')) $('verLbl').textContent='TAA MINI RECORDER '+VERSION;
});
window.__vbAfterDemo=function(){ recPaint(); };

vbBoot(function(){
  recWire(); recScan(); recBadge(); recPaint(); recPaintMeter(0); recPaintSave();
  recWatchStage();          /* the box arrives late in CEF - redraw when it does */
  /* ── THE BRIDGE ARRIVES LATE, AND CHECKING ONCE IS A LIE ──────────────────
     recPaintSave() above ran at boot. On CEF 128 (UE 5.7/5.8) window.ue.taa is
     NOT bound yet at that moment, so deliveryPath() answered 'none' and SAVE
     WAV painted itself DEAD — on a host where saving works perfectly. The
     ACTION was always fine (saveBlob re-checks at call time); it was the PAINT
     that lied, and a button that lies in the safe direction is still a button
     that lies. 5.6 (CEF 90) happened to win the race, which is the trap: it
     passed on one engine and failed on the next for reasons belonging to
     neither. Fires now if the bridge is here, once when it arrives, never in a
     plain browser — where 'download' was the right answer all along. */
  window.VB.onBridge(function(){ recPaintSave(); recBridgeMicRefresh(); });
  recBridgeMicRefresh();    /* cache what only native knows; never blocks a read */
  $('verLbl').textContent='TAA MINI RECORDER '+VERSION;
  _lastSnap=snapKey(window.VB.state()); presetDirty=false; paintPreset(); paintUndo();
  setS('press ARM to open the input, then RECORD');
  /* ?demo drops a synthetic take in so the whole trim/name/save/send path is
     usable — and testable — on a machine with no microphone at all. */
  if(/(^|[?&])demo(=|&|$)/.test(location.search)){ recSimulate(900); recPaint(); }
  recScan().then(function(){ recPaint(); });

  /* ?selftest — the headless gate for this tool */
  if(/(^|[?&])selftest(=|&|$)/.test(location.search)) vbSelfTest('mini-recorder',[
    {name:'boots STANDALONE as its own tool',
     fn:function(){ return {ok:VB.tool==='mini-recorder', detail:'tool = '+VB.tool}; }},
    {name:'does NOT drag the other tools in',
     fn:function(){ return typeof VB.clips==='undefined' && typeof VB.devBar==='undefined'; }},
    {name:'the shared engine came across',
     fn:function(){ return {ok:VB.spec().MIN_TRIM_MS===5 && VB.SR===48000,
                            detail:'SR '+VB.SR+' MIN_TRIM '+VB.spec().MIN_TRIM_MS}; }},
    {name:'the audio contract survives the split',
     fn:function(){ return typeof VB.audioReady==='function'; }},
    {name:'simulate fills a take (no microphone needed)',
     fn:function(){ VB.rec.simulate(900);
       var ms=VB.rec.take()?VB.rec.take().length/VB.SR*1000:0;
       return {ok:VB.rec.phase()==='captured' && Math.abs(ms-900)<12, detail:ms.toFixed(0)+'ms'}; }},
    {name:'trim narrows the take',
     fn:function(){ var t=VB.rec.setTrim(200,600);
       return {ok:Math.abs(t.trimmedMs-400)<1, detail:JSON.stringify(t)}; }},
    {name:'the MIN_TRIM clamp survived the split',
     fn:function(){ var t=VB.rec.setTrim(500,501); VB.rec.setTrim(200,600);
       return {ok:t.trimmedMs>=5, detail:t.trimmedMs+'ms'}; }},
    {name:'trimmed() is trimmed and faded at both cut edges',
     fn:function(){ var b=VB.rec.trimmed();
       return {ok:Math.abs(b.length-19200)<80 && Math.abs(b[0])<0.02 && Math.abs(b[b.length-1])<0.02,
               detail:b.length+' samples'}; }},
    {name:'the meter reads an INJECTED amplitude, not a decoration',
     fn:function(){ var s=new Float32Array(512);
       for(var i=0;i<512;i++) s[i]=Math.sin(2*Math.PI*440*i/VB.SR)*0.5;
       VB.rec.feedInput(s); var m=VB.rec.meter();
       return {ok:Math.abs(m.peakDb-(-6.02))<0.5, detail:m.peakDb.toFixed(2)+' dBFS (want -6.02)'}; }},
    {name:'a 0 dBFS spike latches the clip LED and holds the peak',
     fn:function(){ var sp=new Float32Array(64); sp[10]=1.0; VB.rec.feedInput(sp);
       var hot=VB.rec.meter();
       var q=new Float32Array(2048);
       for(var i=0;i<2048;i++) q[i]=Math.sin(2*Math.PI*440*i/VB.SR)*0.05;
       VB.rec.feedInput(q); var back=VB.rec.meter();
       return {ok:hot.clipped===true && back.holdDb>=-0.5 && back.peakDb<back.holdDb-1,
               detail:'hold '+back.holdDb.toFixed(1)+' dB, live '+back.peakDb.toFixed(1)+' dB'}; }},
    {name:'SEND TO a Variation slot',
     fn:function(){ VB.rec.simulate(900); VB.rec.setTrim(0,-1);
       var n=VB.slotCount(2); VB.rec.sendTo('slot',2);
       return {ok:VB.slotCount(2)===n+1, detail:n+' -> '+VB.slotCount(2)}; }},
    {name:'SEND TO a DAW track degrades gracefully with no DAW module',
     fn:function(){ VB.rec.sendTo('daw',3); return {ok:VB.slotCount(3)>=1, detail:'slot D = '+VB.slotCount(3)+' file(s)'}; }},
    {name:'an UNKNOWN destination is refused, not quietly redirected',
     fn:function(){ var a=VB.slotCount(1), ok=VB.rec.sendTo('sideways',1);
       return {ok:ok===false && VB.slotCount(1)===a,
               detail:'returned '+ok+', slot B still '+VB.slotCount(1)+' file(s)'}; }},
    {name:'record() REFUSES when the input was never armed',
     fn:function(){ VB.rec.discard();
       var r=VB.rec.record();
       return {ok:r===false && VB.rec.phase()==='idle', detail:'returned '+r+', phase '+VB.rec.phase()}; }},
    {name:'trim DIMS the outside instead of recolouring the inside',
     fn:function(){ VB.rec.simulate(900); VB.rec.setTrim(200,600);
       var L=document.getElementById('rDimL'), R=document.getElementById('rDimR');
       var lw=parseFloat(L.style.width)||0, rw=parseFloat(R.style.width)||0;
       return {ok:L.style.display!=='none' && lw>0 && rw>0,
               detail:'dim left '+lw.toFixed(0)+'px, dim right '+rw.toFixed(0)+'px'}; }},
    {name:'dragging the handles back out un-dims the whole take',
     fn:function(){ VB.rec.setTrim(0,-1);
       var lw=parseFloat(document.getElementById('rDimL').style.width)||0;
       var rw=parseFloat(document.getElementById('rDimR').style.width)||0;
       return {ok:lw===0 && rw===0, detail:'dim left '+lw+'px, right '+rw+'px - nothing was cut'}; }},
    {name:'the audition playhead appears INSIDE the trimmed range',
     fn:function(){ VB.rec.simulate(900); VB.rec.setTrim(200,600);
       var cv=document.getElementById('rWave'), w=cv.getBoundingClientRect().width;
       recPlayhead(400);
       var p=document.getElementById('rPh'), x=parseFloat(p.style.left)||0;
       var lo=200/900*w, hi=600/900*w;
       var ok=p.style.display!=='none' && x>=lo-2 && x<=hi+2;
       recPlayheadHide();
       return {ok:ok, detail:'head at '+x.toFixed(0)+'px, trim spans '+
               lo.toFixed(0)+'-'+hi.toFixed(0)+'px'}; }},
    {name:'the playhead is cleared when the take is discarded',
     fn:function(){ VB.rec.simulate(400); recPlayhead(400); VB.rec.discard();
       return {ok:document.getElementById('rPh').style.display==='none',
               detail:'display = '+document.getElementById('rPh').style.display}; }},
    {name:'the captured readout names the trim AND the peak that will be saved',
     fn:function(){ VB.rec.setTrim(200,600);
       var t=document.getElementById('rTrimLen').textContent;
       return {ok:/TRIM 0\.40s/.test(t) && /PEAK -?\d/.test(t), detail:t}; }},
    {name:'ESC discards from the keyboard (the mouse is never required)',
     fn:function(){ VB.rec.simulate(400);
       var had=VB.rec.phase();
       document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
       return {ok:had==='captured' && VB.rec.phase()==='idle',
               detail:had+' -> '+VB.rec.phase()+' on Escape'}; }},
    /* ── cefMicStatus: the shape, and THE RULE. These try to MANUFACTURE a
       green, because that is the failure this rule exists to prevent. ── */
    {name:'cefMicStatus has the shape the wrap reports through',
     fn:function(){ var s=VB.rec.cefMicStatus();
       var ok=s && typeof s==='object'
         && /^(browser|unreal)$/.test(s.host)
         && /^(webaudio|bridge|none)$/.test(s.path)
         && /^(ok|refused|unavailable|unproven)$/.test(s.state)
         && typeof s.detail==='string' && s.detail.length>10
         && /^(boot|arm|capture)$/.test(s.since);
       return {ok:ok, detail:s?JSON.stringify({host:s.host,path:s.path,state:s.state,since:s.since}):'null'}; }},
    {name:'a capture FUNCTION EXISTING is not evidence — state stays unproven',
     fn:function(){ var s=VB.rec.cefMicStatus();
       var gum=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
       return {ok:s.state==='unproven' && gum,
               detail:'getUserMedia present='+gum+' yet state="'+s.state+'" — the spike proved '+
                      'it exists on 5.6/5.7/5.8 and is refused on all three'}; }},
    {name:'INJECTED samples CANNOT manufacture a green',
     fn:function(){ var sig=new Float32Array(512);
       for(var i=0;i<512;i++) sig[i]=Math.sin(2*Math.PI*440*i/VB.SR)*0.5;
       VB.rec.feedInput(sig);                 /* origin defaults to 'inject' */
       var s=VB.rec.cefMicStatus();
       return {ok:s.state!=='ok',
               detail:'fed a test tone, meter moved, state still "'+s.state+
                      '" — a test amplitude proves the METER, not a microphone'}; }},
    {name:'BRIDGE samples DO prove it — state becomes ok, since "capture"',
     fn:function(){ var sig=new Float32Array(512);
       for(var i=0;i<512;i++) sig[i]=Math.sin(2*Math.PI*440*i/VB.SR)*0.5;
       VB.rec.feedInput(sig,'bridge');        /* what the native pump will pass */
       var s=VB.rec.cefMicStatus();
       var ok=s.state==='ok' && s.since==='capture';
       micEv.proven=false; micEv.provenBy=null; micEv.since='boot';   /* restore */
       return {ok:ok, detail:'state="'+s.state+'" since="'+s.since+'" after real samples arrived'}; }},
    {name:'the CEF warning is ON SCREEN, not just in the source',
     fn:function(){ var e=document.getElementById('rCef');
       return {ok:!!e && /UNRESOLVED/i.test(e.textContent), detail:e?e.textContent.trim():'MISSING'}; }},
    {name:'the CEF mic question is still reported as OPEN (never laundered)',
     fn:function(){ var s=VB.rec.cefMicStatus();
       /* the gap is closed ONLY by s.state==='ok', which only real samples reach */
       return {ok:s.state!=='ok',
               detail:'state="'+s.state+'" on '+s.host+'/'+s.path+
                      ' — a known GAP has not become a claim'}; }},
    /* SAVE WAV honesty. The three-way ROUTING now lives in shared saveBlob,
       so these no longer re-test the engine's decision - they test that this
       tool asks the real door and reports the real answer. The no-delivery
       host is still modelled, because that is the failure that used to lie. */
    {name:'NO DELIVERY PATH: SAVE refuses and NEVER claims a save',
     fn:function(){ VB.rec.simulate(400); VB.rec.setTrim(0,-1);
       VB.forceDeliveryPath('none');
       var r=saveBlob(new Blob(['x']),'take_01.wav');
       VB.forceDeliveryPath(null);
       var claims=/saved/i.test(r.msg||'');
       return {ok:r.ok===false && r.path==='none' && !claims,
               detail:(claims?'STILL CLAIMS SAVED: ':'')+(r.msg||'(no msg)').slice(0,95)}; }},
    {name:'NO DELIVERY PATH: the button wears it BEFORE it is pressed',
     fn:function(){ VB.forceDeliveryPath('none'); recPaintSave();
       var b=document.getElementById('rSave');
       var marked=b.classList.contains('warn') && /⚠/.test(b.textContent);
       var told=/cannot receive a file/i.test(b.title||'');
       VB.forceDeliveryPath(null); recPaintSave();
       return {ok:marked&&told, detail:'marked='+marked+' tooltip='+told+
               ', restored to "'+b.textContent+'"'}; }},
    /* ── THE BRIDGE RACE. On CEF 128 the binding is not there when the page
       script runs, so anything painted from a ONE-TIME check at boot lies on
       5.7/5.8 and passes on 5.6. These model the arrival, in a plain browser,
       so the trap cannot hide behind an engine that happens to win the race. ── */
    {name:'SAVE paint RECOVERS when the bridge arrives late',
     fn:function(){
       var prevUe=window.ue, b=document.getElementById('rSave');
       try{ delete window.ue; }catch(e){ window.ue=undefined; }
       VB.forceDeliveryPath('none'); recPaintSave();
       var deadFirst=b.classList.contains('warn');
       /* ...now the bridge shows up, exactly as it does on 5.7/5.8 */
       window.ue={taa:{savefile:function(){ return '{"ok":true}'; }}};
       VB.forceDeliveryPath(null); recPaintSave();
       var aliveAfter=!b.classList.contains('warn');
       window.ue=prevUe; VB.forceDeliveryPath(null); recPaintSave();
       return {ok:deadFirst && aliveAfter,
               detail:'painted dead with no bridge='+deadFirst+
                      ', repainted alive once it arrived='+aliveAfter}; }},
    {name:'onBridge WAITS instead of answering once',
     fn:function(){
       var prevUe=window.ue;
       try{ delete window.ue; }catch(e){ window.ue=undefined; }
       var firedWithNone=false;
       VB.onBridge(function(){ firedWithNone=true; });
       window.ue={taa:{savefile:function(){ return '{"ok":true}'; }}};
       var firedWithOne=false;
       VB.onBridge(function(){ firedWithOne=true; });
       window.ue=prevUe;
       return {ok:firedWithNone===false && firedWithOne===true,
               detail:'no bridge -> did NOT fire a wrong answer ('+firedWithNone+
                      '); bridge present -> fired at once ('+firedWithOne+')'}; }},
    {name:'cefMicStatus does not call an Unreal host a browser',
     fn:function(){
       var prevUe=window.ue;
       window.ue={taa:{savefile:function(){ return '{}'; }}};
       var withBridge=VB.rec.cefMicStatus().host;
       window.ue=prevUe;
       var without=VB.rec.cefMicStatus().host;
       /* in a real browser 'browser' is correct; inside Unreal the user-agent
          branch answers 'unreal' before the binding lands */
       return {ok:withBridge==='unreal' && without==='browser',
               detail:'bridge present -> "'+withBridge+'", plain browser -> "'+without+
                      '" (UA branch covers the pre-binding window in Unreal)'}; }},
    {name:'the tool asks the SHARED door, not a private copy',
     fn:function(){ VB.forceDeliveryPath('bridge');
       var mine=VB.rec.deliveryPath(), theirs=VB.deliveryPath();
       VB.forceDeliveryPath(null);
       return {ok:mine==='bridge' && mine===theirs,
               detail:'VB.rec.deliveryPath()="'+mine+'" VB.deliveryPath()="'+theirs+
                      '" - one answer to one question'}; }},
    {name:'SAVE hands the engine a real WAV, and waits for the real verdict',
     fn:function(){ VB.rec.simulate(400); VB.rec.setTrim(0,-1);
       var w=VB.rec.saveWav();
       var head=''; try{ head=String.fromCharCode.apply(null,new Uint8Array(w.data,0,4)); }catch(e){ head='?'; }
       /* forced to the refusing path on purpose: this asserts the WIRING, and a
          real <a download> click stalls a headless run waiting on a file */
       VB.forceDeliveryPath('none');
       var p=VB.rec.save();
       VB.forceDeliveryPath(null);
       return {ok:head==='RIFF' && p && typeof p.then==='function',
               detail:'bytes start "'+head+'", save() returns a promise of the ENGINE result'}; }},
    {name:'the flat surface is GONE (§16.5: no global VB.record)',
     fn:function(){ return {ok:typeof VB.record==='undefined' && typeof VB.recState==='undefined',
               detail:'VB.record '+typeof VB.record+', VB.recState '+typeof VB.recState}; }},
    {name:'presets and undo came across',
     fn:function(){ return {ok:typeof VB.undo==='function' && typeof VB.presets==='function',
                            detail:'storage persistent = '+VB.presets().persistent}; }}
  ]);
});

</script>
</body>
</html>
