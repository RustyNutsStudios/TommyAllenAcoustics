}

/* ── TRIM handles, dragged on the waveform (§14) ──────────────────────── */
function srcDur(si){ var l=L[si], f=l.files[pickFile(si,sel)]; return f?f.durMs:0; }
function wireTrim(el,si){
  var wrap=el.querySelector('.wavewrap');
  ['in','out'].forEach(function(which){
    var h=wrap.querySelector('[data-h="'+which+'"]');
    h.addEventListener('pointerdown',function(e){
      e.preventDefault(); h.setPointerCapture(e.pointerId);
      var rect=wrap.getBoundingClientRect(), dur=srcDur(si); if(!dur) return;
      function mv(ev){
        var x=Math.max(0,Math.min(1,(ev.clientX-rect.left)/rect.width));
        var ms=x*dur, l=L[si];
        var to=(l.trimOut<0)?dur:l.trimOut;
        if(which==='in') l.trimIn=Math.max(0,Math.min(ms,to-SPEC.MIN_TRIM_MS));
        else l.trimOut=Math.min(dur,Math.max(ms,l.trimIn+SPEC.MIN_TRIM_MS));
        onEdit();
      }
      function up(){ h.removeEventListener('pointermove',mv); h.removeEventListener('pointerup',up); }
      h.addEventListener('pointermove',mv); h.addEventListener('pointerup',up);
    });
  });
}

/* ── deviation bars (§15) ─────────────────────────────────────────────── */
function devSpan(si,d){
  var full=L[si].r[d], e=effOf(si,d);
  if(d==='tone') return {lo:0, hi:Math.max(1e-6,full), bLo:0, bHi:e, centre:0, oneSided:true};
  full=Math.max(1e-6,full);
  return {lo:-full, hi:full, bLo:-e, bHi:e, centre:0, oneSided:false};
}
function devValue(rc,d){
  return d==='offset'?rc.offsetMs : d==='pitch'?rc.cents : d==='gain'?rc.dB : rc.toneOct;
}
function drawDev(cv,si,d){
  var c=fitCv(cv), W=cv.width, H=cv.height, dpr=window.devicePixelRatio||1;
  c.clearRect(0,0,W,H);
  var sp=devSpan(si,d), span=Math.max(1e-6,sp.hi-sp.lo);
  var pad=3*dpr, w=W-pad*2;
  function X(v){ return pad + (v-sp.lo)/span*w; }
  /* the AXIS is the dial's full range (fixed); the BAND is the knob-scaled
     sub-range inside it, so turning the knob visibly widens and narrows it. */
  c.strokeStyle='rgba(255,255,255,.10)'; c.lineWidth=1*dpr;
  c.strokeRect(pad+.5,1.5*dpr,w-1,H-3*dpr);
  var bx=X(sp.bLo), bw=Math.max(1*dpr,X(sp.bHi)-X(sp.bLo));
  c.fillStyle=L[si].wave; c.globalAlpha=.26; c.fillRect(bx,2*dpr,bw,H-4*dpr); c.globalAlpha=1;
  /* centre marker = nominal, and because draws are uniform it is also the median */
  c.strokeStyle='rgba(255,255,255,.45)'; c.lineWidth=1*dpr;
  c.beginPath(); c.moveTo(X(sp.centre),1*dpr); c.lineTo(X(sp.centre),H-1*dpr); c.stroke();
  /* one tick per take, at its REAL draw */
  for(var i=0;i<M.count;i++){
    if(!L[si].files.length) break;
    var v=devValue(recipeOne(si,i),d), x=X(Math.max(sp.bLo,Math.min(sp.bHi,v)));
    var isSel=(i===sel);
    c.strokeStyle=isSel?'#fde68a':'rgba(255,255,255,.55)';
    c.lineWidth=(isSel?2:1)*dpr;
    c.beginPath(); c.moveTo(x,isSel?1*dpr:3*dpr); c.lineTo(x,H-(isSel?1*dpr:3*dpr)); c.stroke();
  }
}

/* ── faders (MIX mode) ────────────────────────────────────────────────── */
function buildFaders(){
  var host=$('faders'); host.innerHTML='';
  L.forEach(function(l,si){
    var d=document.createElement('div'); d.className='fad';
    d.innerHTML='<span class="badge" style="background:'+l.col+'">'+l.id+'</span>'+
      '<div class="fname">'+(l.name||('slot '+l.id))+'</div>'+
      '<input type="range" min="-60" max="6" step="0.5" value="'+l.level+'">'+
      '<div class="fv">'+l.level.toFixed(1)+' dB</div>'+
      '<div class="devnote" style="text-align:center">'+l.files.length+' file'+(l.files.length===1?'':'s')+'</div>';
    var r=d.querySelector('input'), v=d.querySelector('.fv');
    r.addEventListener('input',function(){ l.level=+r.value; v.textContent=l.level.toFixed(1)+' dB'; onEdit(); });
    host.appendChild(d);
  });
}

/* ── the sheet ────────────────────────────────────────────────────────── */
function buildSheet(){
  var host=$('sheet');
  if(host.children.length!==M.count){
    host.innerHTML='';
    for(var i=0;i<M.count;i++){
      var d=document.createElement('div'); d.className='tile';
      d.innerHTML='<span class="tn">'+padNum(i+1,2)+'</span><span class="tm"></span><canvas></canvas>';
      (function(idx){ d.addEventListener('click',function(){ selectTake(idx,true); }); })(i);
      host.appendChild(d);
    }
  }
}
function paintSheet(){
  var host=$('sheet');
  for(var i=0;i<M.count;i++){
    var d=host.children[i]; if(!d) continue;
    var inf=takeInfo(i);
    d.className='tile'+(i===sel?' sel':'')+(marks[i]!=='open'?' '+marks[i]:'')+(inf.trimmed?' trim':'');
    d.querySelector('.tm').innerHTML=marks[i]==='keep'?'&#10003;':(marks[i]==='cull'?'&#10007;':'');
    if(anyLoaded()) drawWave(d.querySelector('canvas'),renderTake(i),{col:'#fde68a'});
  }
  var kept=marks.filter(function(m){return m==='keep';}).length;
  var cull=marks.filter(function(m){return m==='cull';}).length;
  $('counter').textContent=kept+' kept · '+cull+' culled · '+(M.count-kept-cull)+' open / '+M.count;
  var sp=$('staleLbl');
  if(sp){ sp.style.display=latchStale?'':'none'; }
  $('expInfo').textContent=(M.count-cull)+' WAVs + manifest.json — culled takes never leave the app';
}
function selectTake(i,doPlay){
  sel=Math.max(0,Math.min(M.count-1,i));
  if(doPlay && anyLoaded()) play(renderTakeCh(sel));
  renderAll();
}

/* ── the bounce strip ─────────────────────────────────────────────────── */
function paintBounce(){
  var cv=$('mixCv');
  if(!anyLoaded()){ var c=fitCv(cv); c.clearRect(0,0,cv.width,cv.height); return; }
  if(mixView==='summed'){
    drawWave(cv,renderTake(sel),{col:'#fde68a',lw:1});
  }else{
    var c2=fitCv(cv); c2.clearRect(0,0,cv.width,cv.height);
    drawWave(cv,null,{keep:true});
    var N=takeLen(sel);
    liveSlots().forEach(function(o){
      var s=layerSamples(sel,o.i), off=layerOffsetSamples(sel,o.i);
      var pad=new Float32Array(N);
      for(var i=0;i<s.length;i++){ var j=off+i; if(j<N) pad[j]=s[i]; }
      drawWave(cv,pad,{col:L[o.i].wave,keep:true,zero:false,alpha:.85});
    });
  }
  var inf=anyLoaded()?takeInfo(sel):null;
  $('latchLbl').textContent = latchGain===null?'—':(20*Math.log10(Math.max(1e-9,latchGain))).toFixed(1)+' dB';
  $('takeLbl').innerHTML = inf? ('#'+padNum(sel+1,2)+' '+inf.peakDb.toFixed(1)+' dBFS'+(inf.trimmed?' <span style="color:#f87171">TRIMMED</span>':'')) : '—';
  $('normLbl').textContent=M.normalise.toUpperCase();
  $('trimLbl').textContent=M.trim.toFixed(1);
}

/* ── whole-screen paint ───────────────────────────────────────────────── */
function renderAll(){
  layerEls.forEach(function(el,si){
    var l=L[si];
    el.classList.toggle('off',!(l.on&&l.files.length));
    el.querySelector('[data-v="level"]').textContent=l.level.toFixed(1)+' dB';
    el.querySelector('[data-v="delay"]').textContent=l.delay.toFixed(0)+' ms';
    el.querySelector('[data-v="lp"]').textContent=l.lp>=20000?'off':(l.lp/1000).toFixed(1)+'k';
    el.querySelector('[data-v="hp"]').textContent=l.hp<=20?'off':l.hp.toFixed(0);
    /* the layer waveform, with the trimmed region bright and the rest dimmed */
    var cv=el.querySelector('.wavewrap canvas'), f=l.files[pickFile(si,sel)];
    if(f){
      var dur=f.durMs, tr=trimRegion(l,f.samples);
      drawWave(cv,f.samples,{col:'#4a4843'});
      drawWave(cv,f.samples,{col:l.wave,keep:true,zero:false,s0:tr.a,sN:tr.b-tr.a});
      /* redraw the trimmed part in place across the full width */
      var c=cv.getContext('2d'), W=cv.width, H=cv.height, dpr=window.devicePixelRatio||1;
      c.clearRect(0,0,W,H);
      drawWave(cv,f.samples,{col:'#4a4843',keep:true});
      var x0=tr.a/f.samples.length*W, x1=tr.b/f.samples.length*W;
      c.save(); c.beginPath(); c.rect(x0,0,Math.max(1,x1-x0),H); c.clip();
      drawWave(cv,f.samples,{col:l.wave,keep:true,zero:false});
      c.restore();
      var wrapW=cv.getBoundingClientRect().width;
      var hi=el.querySelector('[data-h="in"]'), ho=el.querySelector('[data-h="out"]');
      hi.style.left=(l.trimIn/dur*wrapW-3)+'px';
      ho.style.left=(((l.trimOut<0?dur:l.trimOut)/dur*wrapW)-3)+'px';
      hi.style.display=ho.style.display='';
      el.querySelector('[data-hl="in"]').textContent='IN '+l.trimIn.toFixed(0)+'ms';
      el.querySelector('[data-hl="out"]').textContent='OUT '+((l.trimOut<0?dur:l.trimOut)).toFixed(0)+'ms';
    }else{
      var cc=fitCv(cv); cc.clearRect(0,0,cv.width,cv.height);
      el.querySelector('[data-h="in"]').style.display='none';
      el.querySelector('[data-h="out"]').style.display='none';
      el.querySelector('[data-hl="in"]').textContent='';
      el.querySelector('[data-hl="out"]').textContent='';
    }
    ['reverse','start','spread'].forEach(function(d){
      var v=el.querySelector('[data-mv="'+d+'"]'), e2=el.querySelector('[data-me="'+d+'"]');
      if(!v) return;
      var u=({reverse:'%',start:'ms',spread:'%'})[d], ef=effOf(si,d);
      v.textContent=l.r[d].toFixed(0)+u;
      e2.textContent = l.r[d]===0 ? 'off'
        : (d==='reverse' ? ('\u2192 '+ef.toFixed(0)+'% of takes')
        : d==='start'    ? ('\u2192 0\u2013'+ef.toFixed(0)+'ms in')
                         : ('\u2192 \u00b1'+ef.toFixed(0)+'%'));
    });
    var pv=el.querySelector('[data-mv="pan"]');
    if(pv) pv.textContent=(l.pan===0?'C':(l.pan<0?('L'+(-l.pan)):('R'+l.pan)));
    ['offset','pitch','gain','tone'].forEach(function(d){
      drawDev(el.querySelector('[data-dev="'+d+'"]'),si,d);
      var e=effOf(si,d), u=({offset:'ms',pitch:'ct',gain:'dB',tone:'oct'})[d];
      el.querySelector('[data-de="'+d+'"]').textContent=
        (d==='tone'?('0–'+e.toFixed(2)):('±'+e.toFixed(d==='pitch'?0:1)))+u+' /'+l.r[d];
    });
  });
  paintChips(); paintSheet(); paintBounce();
  var rc=recipe(sel);
  $('recipeLine').textContent = rc.length? ('#'+padNum(sel+1,2)+'  '+rc.map(function(r){
    return r.slot+' '+r.file+' '+(r.offsetMs>=0?'+':'')+r.offsetMs.toFixed(1)+'ms '+
           (r.cents>=0?'+':'')+r.cents.toFixed(0)+'ct '+(r.dB>=0?'+':'')+r.dB.toFixed(1)+'dB';
  }).join('   ')) : 'no layers loaded';
}
/* a dial moved: re-render in place, keep the marks (§8) */
function onEdit(){ if(latchGain!==null && M.normalise==='set') latchStale=true; VBUI.notify(); commitSoon(); }

</script>
<script>
/* inlined: variation-vb.js */
/* ══════════════════════════════════════════════════════════════════════════
   VARIATION DESIGNER — its half of window.VB.
   These are THIS TOOL'S doors, not the engine's: the knob, the take sheet, the
   deviation bars, the level latch. They used to sit in the shared core, which
   meant a Mini Recorder build advertised a BOUNCE and a RE-NORMALISE it does
   not have. A contract that lists doors a tool cannot open is a lie the harness
   will believe.
   ══════════════════════════════════════════════════════════════════════════ */
'use strict';
Object.assign(window.VB,{
  tool:'variation-designer',
  knob:function(){return M.knob;},  setKnob:function(v){M.knob=Math.max(0,Math.min(100,+v));markStale();VBUI.notify();},
  count:function(){return M.count;},setCount:function(n){bounceCount(Math.max(1,Math.min(64,+n)));},
  setTrim:function(slot,inMs,outMs){
    var l=L[slot]; if(!l) return null;
    l.trimIn=Math.max(0,+inMs||0);
    l.trimOut=(outMs===null||outMs===undefined)?-1:+outMs;
    markStale(); VBUI.notify();
    return {trimIn:l.trimIn, trimOut:l.trimOut};
  },
  /* §15 deviation bar, as DATA so the drawing can be asserted without pixels */
  devBar:function(slot,dial){
    var full=L[slot].r[dial], e=full*M.knob/100, ticks=[];
    for(var i=0;i<M.count;i++){
      var rc=recipeOne(slot,i);
      ticks.push(dial==='offset'?rc.offsetMs : dial==='pitch'?rc.cents :
                 dial==='gain'?rc.dB : rc.toneOct);
    }
    return {axis:[dial==='tone'?0:-full, full], band:[dial==='tone'?0:-e, e],

  },
  latchStale:function(){ return latchStale; },
  latchPrompt:function(){ return latchStale ? 'levels stale - RE-NORMALISE' : ''; },
  latchGain:function(){ return latchGain; },

  reNormalise:function(){
    latchGain=null; var g=latch();

    VBUI.notify();
    return g;
  },
  recipe:function(ti){
    /* delayMs is ADDITIVE to CONTRACT.md's listed shape: §12.9 asserts the
       inter-layer lag, which is delay + offset, so a harness that only sees
       offsetMs cannot compute the thing it is checking. Told to TESTER. */
    return recipe(ti).map(function(r){
      return {slot:r.slot,file:r.file,fileIdx:r.fileIdx,delayMs:r.delayMs,offsetMs:r.offsetMs,

  },

  pack:pack,

  sheet:function(){

      len:anyLoaded()?renderTake(i).length:0, trimmed:anyLoaded()?takeInfo(i).trimmed:false});
    return out;
  },
  takeSamples:function(i){ return renderTake(i); },
  keep:function(i){ marks[i]='keep'; VBUI.notify(); },
  cull:function(i){ marks[i]='cull'; VBUI.notify(); },

<script>
/* inlined: variation-app.js */
/* ══════════════════════════════════════════════════════════════════════════

var mode='design';

document.querySelectorAll('#modeSeg b').forEach(function(b){
  b.addEventListener('click',function(){ setMode(b.dataset.mode); }); });

segWire('rateSeg',function(v){ M.rate=+v; });

    if(!ok) return;

$('dlBtn').addEventListener('click',function(){

$('demoBtn').addEventListener('click',function(){ demoKit(); doBounce(M.count); commitUndo(); });

document.addEventListener('keydown',function(e){

VBUI.onChange(function(){ if($('layers').children.length!==4) buildLayers(); syncUI(); });
window.__vbAfterDemo=function(){ buildLayers(); buildFaders(); doBounce(M.count); };

vbBoot(function(){

     TOOL RECORDER in a real 5.6 tab; the service is in vb-core so all three
     tools answer it the same way. It also fixes plain-browser resize, which was
     leaving every waveform stretched until the next edit. */
  /* syncUI() alone, MEASURED sufficient: through the real 0→rectangle path it
     leaves 0 of 21 canvases with a wrong backing store and 0 blank, identical
     to calling all four builders. The other three were redundant work on every
     resize — the same double-paint TOOL DAW caught in my DAW addendum. */
  vbWatchStage($('app') || document.body, syncUI);
  _lastSnap=snapKey(window.VB.state()); presetDirty=false; paintPreset(); paintUndo();
  setS('Drop WAVs on a slot — or press DEMO KIT');
  if(/(^|[?&])demo(=|&|$)/.test(location.search)){ demoKit(); buildLayers(); buildFaders(); doBounce(M.count); }
  if(/(^|[?&])mix(=|&|$)/.test(location.search)) setMode('mix');
  if(/(^|[?&])selftest(=|&|$)/.test(location.search)){
    demoKit(); buildLayers(); buildFaders(); VB.setSeed(2148294601); doBounce(12);
    function eqF(a,b){ if(a.length!==b.length) return false;
      for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false; return true; }
    function peak(b){ var m=0; for(var i=0;i<b.length;i++){ var v=b[i]<0?-b[i]:b[i]; if(v>m)m=v; } return m; }
    vbSelfTest('variation-designer',[
      {name:'boots STANDALONE as its own tool',
       fn:function(){ return {ok:VB.tool==='variation-designer', detail:'tool = '+VB.tool}; }},
      {name:'does NOT drag the other tools in',
       fn:function(){ return typeof VB.clips==='undefined' && typeof VB.simulateTake==='undefined'; }},
      {name:'§12.1 ZERO — one file per slot at knob 0 gives identical takes',
       fn:function(){ var st=VB.state(); st.layers.forEach(function(l){l.pick='FIXED';l.fixedIdx=0;}); VB.restore(st);
         VB.setKnob(0); VB.setCount(8);
         var t0=VB.renderTake(0), ok=true;
         for(var i=1;i<8;i++) if(!eqF(t0,VB.renderTake(i))) ok=false;
         var s2=VB.state(); s2.layers.forEach(function(l){l.pick='RANDOM';}); VB.restore(s2);
         VB.setKnob(35); VB.setCount(12); VB.bounce(); return ok; }},
      {name:'§12.3 LOCALITY — a re-roll changes only the culled takes',
       fn:function(){ var b=[]; for(var i=0;i<12;i++) b.push(VB.renderTake(i).slice());
         VB.cull(2); VB.cull(6); VB.rerollCulled();
         var ch=[]; for(i=0;i<12;i++) if(!eqF(b[i],VB.renderTake(i))) ch.push(i);
         return {ok:JSON.stringify(ch)==='[2,6]', detail:JSON.stringify(ch)}; }},
      {name:'§12.7 LEVEL — set-normalise lands on TRIM',
       fn:function(){ VB.bounce(); var mx=0;
         for(var i=0;i<12;i++) mx=Math.max(mx,peak(VB.renderTake(i)));
         var db=20*Math.log10(mx);
         return {ok:Math.abs(db-(-1))<0.01, detail:db.toFixed(4)+' dBFS'}; }},
      {name:'the knob scales draws IN PLACE, never reshuffles',
       fn:function(){ VB.setKnob(35); var a=VB.recipe(3)[0].offsetMs;
         VB.setKnob(100); var c=VB.recipe(3)[0].offsetMs; VB.setKnob(35);
         return {ok:Math.abs(c/a-100/35)<0.001, detail:a.toFixed(2)+' -> '+c.toFixed(2)+' ratio '+(c/a).toFixed(4)}; }},
      {name:'the per-bag shuffle deals a different order each bag',
       fn:function(){ VB.setCount(30); VB.bounce();
         var s=[]; for(var i=0;i<30;i++) s.push(VB.recipe(i)[0].fileIdx);
         var bags={}; for(i=0;i<30;i+=5) bags[s.slice(i,i+5).join('')]=1;
         VB.setCount(12); VB.bounce();
         return {ok:Object.keys(bags).length>1, detail:Object.keys(bags).join(' | ')}; }},
      {name:'the deviation bar answers as DATA',
       fn:function(){ var d=VB.devBar(0,'offset');
         return {ok:d.ticks.length===12 && d.axis[1]===15, detail:'axis '+JSON.stringify(d.axis)+' ticks '+d.ticks.length}; }},
      {name:'a dial nudge marks the level STALE, it does not re-latch',
       fn:function(){ var g=VB.latchGain(); VB.setDial(1,'gain',3);
         return {ok:VB.latchGain()===g && VB.latchStale()===true, detail:VB.latchPrompt()}; }},
      {name:'RE-NORMALISE is the only other thing that moves the latch',
       fn:function(){ var g=VB.latchGain(); var n=VB.reNormalise();
         return {ok:typeof n==='number' && VB.latchStale()===false, detail:g.toFixed(6)+' -> '+n.toFixed(6)}; }},
      {name:'presets and undo came across',
       fn:function(){ return typeof VB.undo==='function' && VB.presets().factory.length===3; }}
    ]);
  }
});

</script>
